name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

      - name: Build self-contained editor
        run: npm run build

      - name: Verify generated artifact is current
        run: git diff --exit-code -- sabura.html

      - name: Verify example boards carry the current runtime
        run: npm run examples:refresh && git diff --exit-code -- examples

      - name: Verify the plugin skill carries the current editor and board script
        run: npm run plugin:check

      - name: Browser checks (incremental render, text box, blocked storage)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          # Ubuntu runners block the unprivileged namespaces Chrome's sandbox needs.
          CHROME_ARGS: --no-sandbox
        run: npm run test:e2e:render
