/**
 * Sabura Workspace: Viewport coordinate transforms, camera navigation, pointer gestures,
 * snapping coordinator, and tool state machine.
 */





class Workspace {
  constructor(svgContainer, callbacks) {
    this.container = svgContainer;
    this.callbacks = callbacks;
    // callbacks: { onCommand, onCommandBatch, onOpenWheel, onDoubleClickedObject }

    this.camera = { x: 0, y: 0, zoom: 1.0 };
    this.activeTool = 'hand'; // Default tool: Hand/Pan!
    this.previousTool = 'select';
    this.connectorRouting = 'straight';
    this.selectedIds = [];
    this.snapGrid = true;
    this.showGrid = true;
    this.gridSize = 20;

    // Interaction state
    this.isPanning = false;
    this.isDraggingSelection = false;
    this.isDHeld = false;
    this.isDDragging = false;
    this.isResizing = false;
    this.isCreating = false;
    this.isReconnecting = false;
    this.reconnectSnapIndicator = null;
    this.isMarquee = false;
    this.spaceHeld = false;

    this.dragStart = { x: 0, y: 0 };
    this.pointerStartScreen = { x: 0, y: 0 };
    this.activeHandle = null;
    this.resizeOriginalBounds = null;
    this.snapGuides = [];
    this.marquee = null;
    this.draftObject = null;
    this.reconnectingData = null;

    // Long press detection
    this.longPressTimer = null;

    this.bindEvents();
  }

  setTool(tool) {
    this.activeTool = tool;
    this.updateCursor();
    this.render();
  }

  setConnectorRouting(routing) {
    this.connectorRouting = routing || 'straight';
  }

  setSnapGrid(enabled) {
    this.snapGrid = enabled;
  }

  updateCursor() {
    if (this.spaceHeld || this.activeTool === 'hand') {
      this.container.style.cursor = this.isPanning ? 'grabbing' : 'grab';
    } else if (this.activeTool === 'select') {
      this.container.style.cursor = 'default';
    } else if (['rectangle', 'ellipse', 'diamond', 'triangle', 'text', 'connector', 'draw'].includes(this.activeTool)) {
      this.container.style.cursor = 'crosshair';
    } else {
      this.container.style.cursor = 'default';
    }
  }

  /**
   * Transforms screen (viewport) coordinates to world (canvas) coordinates.
   */
  screenToWorld(screenX, screenY) {
    return {
      x: (screenX - this.camera.x) / this.camera.zoom,
      y: (screenY - this.camera.y) / this.camera.zoom
    };
  }

  /**
   * Transforms world coordinates to screen coordinates.
   */
  worldToScreen(worldX, worldY) {
    return {
      x: worldX * this.camera.zoom + this.camera.x,
      y: worldY * this.camera.zoom + this.camera.y
    };
  }

  zoomAt(screenX, screenY, deltaFactor) {
    const minZoom = 0.1;
    const maxZoom = 5.0;
    const oldZoom = this.camera.zoom;
    const newZoom = Math.max(minZoom, Math.min(maxZoom, oldZoom * deltaFactor));

    // Keep point under cursor invariant
    this.camera.x = screenX - (screenX - this.camera.x) * (newZoom / oldZoom);
    this.camera.y = screenY - (screenY - this.camera.y) * (newZoom / oldZoom);
    this.camera.zoom = newZoom;

    this.render();
  }

  zoomIn() {
    const center = this.getViewportCenter();
    this.zoomAt(center.x, center.y, 1.2);
  }

  zoomOut() {
    const center = this.getViewportCenter();
    this.zoomAt(center.x, center.y, 1 / 1.2);
  }

  resetZoom() {
    if (this.camera.zoom === 1.0) return;
    const center = this.getViewportCenter();
    this.zoomAt(center.x, center.y, 1.0 / this.camera.zoom);
  }

  getViewportCenter() {
    const rect = this.container.getBoundingClientRect();
    return {
      x: rect.left + rect.width / 2,
      y: rect.top + rect.height / 2
    };
  }

  fitToContent(padding = 60) {
    const doc = this.callbacks.getDocument();
    const allObjects = Object.values(doc.objects || {});
    if (allObjects.length === 0) {
      this.camera = { x: 0, y: 0, zoom: 1.0 };
      this.render();
      return;
    }

    const union = getUnionBoundingBox(allObjects);
    if (!union) return;

    const w = window.innerWidth;
    const h = window.innerHeight;
    const scaleX = (w - padding * 2) / union.width;
    const scaleY = (h - padding * 2) / union.height;
    const targetZoom = Math.max(0.2, Math.min(2.0, Math.min(scaleX, scaleY)));

    this.camera.zoom = targetZoom;
    this.camera.x = (w - union.width * targetZoom) / 2 - union.x * targetZoom;
    this.camera.y = (h - union.height * targetZoom) / 2 - union.y * targetZoom;
    this.render();
  }

  bindEvents() {
    this.onPointerDown = this.onPointerDown.bind(this);
    this.onPointerMove = this.onPointerMove.bind(this);
    this.onPointerUp = this.onPointerUp.bind(this);
    this.onWheel = this.onWheel.bind(this);
    this.onContextMenu = this.onContextMenu.bind(this);
    this.onDblClick = this.onDblClick.bind(this);

    this.onPointerCancel = this.onPointerCancel.bind(this);

    this.container.addEventListener('pointerdown', this.onPointerDown);
    window.addEventListener('pointermove', this.onPointerMove);
    window.addEventListener('pointerup', this.onPointerUp);
    window.addEventListener('pointercancel', this.onPointerCancel);
    this.container.addEventListener('wheel', this.onWheel, { passive: false });
    this.container.addEventListener('contextmenu', this.onContextMenu);
    this.container.addEventListener('dblclick', this.onDblClick);
  }

  destroy() {
    this.container.removeEventListener('pointerdown', this.onPointerDown);
    window.removeEventListener('pointermove', this.onPointerMove);
    window.removeEventListener('pointerup', this.onPointerUp);
    window.removeEventListener('pointercancel', this.onPointerCancel);
    this.container.removeEventListener('wheel', this.onWheel);
    this.container.removeEventListener('contextmenu', this.onContextMenu);
    this.container.removeEventListener('dblclick', this.onDblClick);
  }

  onPointerCancel(e) {
    this.cancelGesture();
  }

  cancelGesture() {
    if (this.longPressTimer) {
      clearTimeout(this.longPressTimer);
      this.longPressTimer = null;
    }

    const doc = this.callbacks.getDocument();

    if (this.isDraggingSelection && this.dragInitialPositions) {
      for (const [id, pos] of Object.entries(this.dragInitialPositions)) {
        const obj = doc.objects[id];
        if (obj) {
          obj.x = pos.x;
          obj.y = pos.y;
          if (obj.type === 'connector') {
            if (pos.fromPoint && obj.from) obj.from.point = { ...pos.fromPoint };
            if (pos.toPoint && obj.to) obj.to.point = { ...pos.toPoint };
          }
        }
      }
    }

    if (this.isResizing && this.resizeOriginalBounds && this.selectedIds.length > 0) {
      const obj = doc.objects[this.selectedIds[0]];
      if (obj) {
        obj.x = this.resizeOriginalBounds.x;
        obj.y = this.resizeOriginalBounds.y;
        obj.width = this.resizeOriginalBounds.width;
        obj.height = this.resizeOriginalBounds.height;
      }
    }

    if (this.isReconnecting && this.reconnectingData && this.reconnectOriginalTarget) {
      const conn = doc.objects[this.reconnectingData.connectorId];
      if (conn) {
        conn[this.reconnectingData.endpoint] = JSON.parse(JSON.stringify(this.reconnectOriginalTarget));
      }
    }

    this.isPanning = false;
    this.isDraggingSelection = false;
    this.isResizing = false;
    this.isCreating = false;
    this.isReconnecting = false;
    this.isMarquee = false;
    this.activeHandle = null;
    this.resizeOriginalBounds = null;
    this.latestResizeBounds = null;
    this.reconnectOriginalTarget = null;
    this.latestReconnectTarget = null;
    this.dragInitialPositions = null;
    this.dragAccumulatedDelta = null;
    this.snapGuides = [];
    this.marquee = null;
    this.draftObject = null;
    this.setTool('select');
    this.updateCursor();
    this.render();
  }

  findObjectAt(worldPoint) {
    const doc = this.callbacks.getDocument();
    // Search backwards from topmost (end of doc.order) to bottom
    for (let i = doc.order.length - 1; i >= 0; i--) {
      const objId = doc.order[i];
      const obj = doc.objects[objId];
      if (!obj) continue;

      if (obj.type === 'connector') {
        // Precision hit test: close to the actual line with zoom-adaptive comfortable hit area
        const dist = distanceToConnector(worldPoint, obj, doc);
        const hitThreshold = Math.max(12, 14 / this.camera.zoom);
        if (dist <= hitThreshold) {
          return obj;
        }
      } else {
        const box = getBoundingBox(obj);
        if (worldPoint.x >= box.x && worldPoint.x <= box.right &&
            worldPoint.y >= box.y && worldPoint.y <= box.bottom) {
          return obj;
        }
      }
    }
    return null;
  }

  onContextMenu(e) {
    e.preventDefault();
    const worldPt = this.screenToWorld(e.clientX, e.clientY);
    const hitObj = this.findObjectAt(worldPt);

    if (hitObj) {
      if (!this.selectedIds.includes(hitObj.id)) {
        this.selectedIds = [hitObj.id];
      }
      this.callbacks.onOpenWheel(e.clientX, e.clientY, 'object', hitObj);
    } else {
      this.callbacks.onOpenWheel(e.clientX, e.clientY, 'canvas', null);
    }
  }

  onDblClick(e) {
    const worldPt = this.screenToWorld(e.clientX, e.clientY);
    const hitObj = this.findObjectAt(worldPt);
    if (hitObj) {
      this.callbacks.onDoubleClickedObject(hitObj);
    }
  }

  onPointerDown(e) {
    if (e.button !== 0 && e.button !== 1) return;

    const worldPt = this.screenToWorld(e.clientX, e.clientY);
    this.pointerStartScreen = { x: e.clientX, y: e.clientY };

    // 1. Check if clicked a resize or connector handle (always takes priority on left click)
    const handleEl = e.button === 0 ? e.target?.closest?.('[data-handle]') : null;
    if (handleEl) {
      clearTimeout(this.longPressTimer);
      const handleId = handleEl.getAttribute('data-handle');
      if (handleId.startsWith('conn-')) {
        this.isReconnecting = true;
        this.reconnectingData = {
          connectorId: this.selectedIds[0],
          endpoint: handleId === 'conn-from' ? 'from' : 'to'
        };
        const doc = this.callbacks.getDocument();
        const conn = doc.objects[this.selectedIds[0]];
        this.reconnectOriginalTarget = conn ? JSON.parse(JSON.stringify(conn[this.reconnectingData.endpoint])) : null;
        this.latestReconnectTarget = null;
        this.reconnectSnapIndicator = null;
      } else {
        this.isResizing = true;
        this.activeHandle = handleId;
        const doc = this.callbacks.getDocument();
        const obj = doc.objects[this.selectedIds[0]];
        this.resizeOriginalBounds = {
          x: obj.x,
          y: obj.y,
          width: obj.width,
          height: obj.height,
          resolvedSize: obj.textStyle?.resolvedSize || 20
        };
        this.latestResizeBounds = null;
        this.dragStart = { ...worldPt };
      }
      return;
    }

    // 2. If middle click or space held or activeTool === 'hand', start panning
    if (e.button === 1 || this.spaceHeld || this.activeTool === 'hand') {
      this.isPanning = true;
      this.panMoved = false;
      this.dragStart = { x: e.clientX - this.camera.x, y: e.clientY - this.camera.y };
      this.updateCursor();
      return;
    }

    // Setup long-press timer (500ms) for opening circular wheel on touch / static click
    this.longPressTimer = setTimeout(() => {
      this.longPressTimer = null;
      const hit = this.findObjectAt(worldPt);
      this.callbacks.onOpenWheel(e.clientX, e.clientY, hit ? 'object' : 'canvas', hit);
    }, 500);

    // Check if clicked an object
    const hitObj = this.findObjectAt(worldPt);

    if (this.activeTool === 'select') {
      if (hitObj) {
        clearTimeout(this.longPressTimer);
        let targetId = hitObj.id;
        // Group selection logic: if part of group, select all group members
        const doc = this.callbacks.getDocument();
        if (hitObj.groupId) {
          const groupMembers = Object.values(doc.objects).filter(o => o.groupId === hitObj.groupId).map(o => o.id);
          if (e.shiftKey) {
            this.selectedIds = Array.from(new Set([...this.selectedIds, ...groupMembers]));
          } else if (!this.selectedIds.includes(targetId)) {
            this.selectedIds = groupMembers;
          }
        } else {
          if (e.shiftKey) {
            if (this.selectedIds.includes(targetId)) {
              this.selectedIds = this.selectedIds.filter(id => id !== targetId);
            } else {
              this.selectedIds.push(targetId);
            }
          } else if (!this.selectedIds.includes(targetId)) {
            this.selectedIds = [targetId];
          }
        }

        this.isDraggingSelection = true;
        this.isDDragging = Boolean(this.isDHeld);
        this.dragStart = { ...worldPt };
        this.dragInitialPositions = {};
        this.dragAccumulatedDelta = { dx: 0, dy: 0 };
        for (const id of this.selectedIds) {
          const o = doc.objects[id];
          if (o) {
            this.dragInitialPositions[id] = {
              x: o.x,
              y: o.y,
              fromPoint: o.type === 'connector' && o.from?.point ? { ...o.from.point } : null,
              toPoint: o.type === 'connector' && o.to?.point ? { ...o.to.point } : null
            };
          }
        }
        this.render();
      } else {
        // Clicked empty space
        if (!e.shiftKey) {
          this.selectedIds = [];
        }
        this.isMarquee = true;
        this.marquee = { startX: worldPt.x, startY: worldPt.y, currentX: worldPt.x, currentY: worldPt.y };
        this.render();
      }
      return;
    }

    // Creation tools
    if (['rectangle', 'ellipse', 'diamond', 'triangle', 'text', 'connector', 'draw'].includes(this.activeTool)) {
      clearTimeout(this.longPressTimer);
      this.isCreating = true;
      this.dragStart = { ...worldPt };

      const doc = this.callbacks.getDocument();
      const type = this.activeTool === 'draw' ? 'path' : this.activeTool;

      this.draftObject = createDefaultObject(type, {
        x: worldPt.x,
        y: worldPt.y,
        width: 1,
        height: 1,
        routing: type === 'connector' ? (this.connectorRouting || 'straight') : undefined
      }, doc.theme);

      if (type === 'path') {
        this.draftObject.points = [[0, 0]];
      } else if (type === 'connector') {
        const startHit = this.findObjectAt(worldPt);
        this.draftObject.from = startHit ? { id: startHit.id } : { point: { ...worldPt } };
        this.draftObject.to = { point: { ...worldPt } };
      }
    }
  }

  onPointerMove(e) {
    // If pointer moved more than 5px, cancel long-press timer
    if (this.longPressTimer) {
      const dist = Math.hypot(e.clientX - this.pointerStartScreen.x, e.clientY - this.pointerStartScreen.y);
      if (dist > 6) {
        clearTimeout(this.longPressTimer);
        this.longPressTimer = null;
      }
    }

    if (this.isPanning) {
      if (this.pointerStartScreen && Math.hypot(e.clientX - this.pointerStartScreen.x, e.clientY - this.pointerStartScreen.y) > 3) {
        this.panMoved = true;
      }
      this.camera.x = e.clientX - this.dragStart.x;
      this.camera.y = e.clientY - this.dragStart.y;
      this.render();
      return;
    }

    const worldPt = this.screenToWorld(e.clientX, e.clientY);

    if (this.isMarquee) {
      this.marquee.currentX = worldPt.x;
      this.marquee.currentY = worldPt.y;

      // Update selection based on marquee intersection
      const mx = Math.min(this.marquee.startX, this.marquee.currentX);
      const my = Math.min(this.marquee.startY, this.marquee.currentY);
      const mr = Math.max(this.marquee.startX, this.marquee.currentX);
      const mb = Math.max(this.marquee.startY, this.marquee.currentY);

      const doc = this.callbacks.getDocument();
      const hits = [];
      for (const obj of Object.values(doc.objects)) {
        const b = getBoundingBox(obj);
        if (b.x < mr && b.right > mx && b.y < mb && b.bottom > my) {
          hits.push(obj.id);
        }
      }
      this.selectedIds = hits;
      this.render();
      return;
    }

    if (this.isDraggingSelection && this.selectedIds.length > 0 && this.dragInitialPositions) {
      const doc = this.callbacks.getDocument();

      // Holding plain D while dragging: drag out a copy!
      if (this.isDHeld && !this.isDDragging) {
        this.isDDragging = true;
        // Restore originals to pristine initial positions
        for (const [id, pos] of Object.entries(this.dragInitialPositions)) {
          const orig = doc.objects[id];
          if (orig) {
            orig.x = pos.x;
            orig.y = pos.y;
            if (orig.type === 'connector') {
              if (pos.fromPoint && orig.from) orig.from.point = { ...pos.fromPoint };
              if (pos.toPoint && orig.to) orig.to.point = { ...pos.toPoint };
            }
          }
        }
      }

      const selectedObjects = this.selectedIds.map(id => doc.objects[id]).filter(Boolean);
      const union = getUnionBoundingBox(selectedObjects);
      if (!union) return;

      let dx = worldPt.x - this.dragStart.x;
      let dy = worldPt.y - this.dragStart.y;

      // Snapping against non-selected objects & grid (unless Alt/Option is held)
      if (!e.altKey && !e.metaKey) {
        const otherObjects = Object.values(doc.objects).filter(o => !this.selectedIds.includes(o.id));
        const testBox = {
          x: union.x + dx,
          y: union.y + dy,
          width: union.width,
          height: union.height
        };
        const snap = calculateSnapping(testBox, otherObjects, {
          tolerance: 8 / this.camera.zoom,
          snapGrid: this.snapGrid,
          gridSize: this.gridSize
        });

        dx += (snap.x - testBox.x);
        dy += (snap.y - testBox.y);
        this.snapGuides = snap.guides;
      } else {
        this.snapGuides = [];
      }

      this.dragAccumulatedDelta = { dx, dy };

      if (this.isDDragging) {
        // In D-drag mode, originals are never touched! We simply re-render with preview clones.
        this.render();
        return;
      }

      for (const id of this.selectedIds) {
        const obj = doc.objects[id];
        const initial = this.dragInitialPositions[id];
        if (obj && initial) {
          obj.x = initial.x + dx;
          obj.y = initial.y + dy;
          if (obj.type === 'connector') {
            if (initial.fromPoint && obj.from) obj.from.point = { x: initial.fromPoint.x + dx, y: initial.fromPoint.y + dy };
            if (initial.toPoint && obj.to) obj.to.point = { x: initial.toPoint.x + dx, y: initial.toPoint.y + dy };
          }
        }
      }
      this.render();
      return;
    }

    if (this.isResizing && this.selectedIds.length === 1 && this.resizeOriginalBounds) {
      const dx = worldPt.x - this.dragStart.x;
      const dy = worldPt.y - this.dragStart.y;
      const keepAspect = e.shiftKey;
      const fromCenter = e.altKey;

      const newBounds = calculateResize(this.activeHandle, this.resizeOriginalBounds, dx, dy, {
        keepAspect,
        fromCenter
      });

      const doc = this.callbacks.getDocument();
      const obj = doc.objects[this.selectedIds[0]];
      if (obj) {
        obj.x = newBounds.x;
        obj.y = newBounds.y;
        obj.width = newBounds.width;
        obj.height = newBounds.height;
        if (obj.textStyle && this.resizeOriginalBounds.width > 0 && this.resizeOriginalBounds.height > 0) {
          const scale = (newBounds.width / this.resizeOriginalBounds.width + newBounds.height / this.resizeOriginalBounds.height) / 2;
          obj.textStyle.resolvedSize = Math.max(10, Math.min(120, Math.round((this.resizeOriginalBounds.resolvedSize || 20) * scale)));
        }
        this.latestResizeBounds = newBounds;
        this.render();
      }
      return;
    }

    if (this.isReconnecting && this.reconnectingData) {
      const doc = this.callbacks.getDocument();
      const connId = this.reconnectingData.connectorId;
      const conn = doc.objects[connId];
      const attachedId = this.reconnectOriginalTarget?.id;
      const attachedObj = attachedId ? doc.objects[attachedId] : null;

      let targetObj = null;
      const hit = this.findObjectAt(worldPt);

      // Direct hit on an object (excluding the connector itself)
      if (hit && hit.id !== connId && hit.type !== 'connector') {
        targetObj = hit;
      } else if (attachedObj) {
        // Generous buffer (24px screen-space) around currently attached object to prevent accidental detachment
        const b = getBoundingBox(attachedObj);
        const buf = 24 / this.camera.zoom;
        if (worldPt.x >= b.x - buf && worldPt.x <= b.right + buf &&
            worldPt.y >= b.y - buf && worldPt.y <= b.bottom + buf) {
          targetObj = attachedObj;
        }
      }

      // If still no target, check if within gentle buffer of any other non-connector shape
      if (!targetObj) {
        const buf = 14 / this.camera.zoom;
        for (const o of Object.values(doc.objects)) {
          if (o.id !== connId && o.type !== 'connector') {
            const b = getBoundingBox(o);
            if (worldPt.x >= b.x - buf && worldPt.x <= b.right + buf &&
                worldPt.y >= b.y - buf && worldPt.y <= b.bottom + buf) {
              targetObj = o;
              break;
            }
          }
        }
      }

      let target;
      if (targetObj) {
        const closest = getClosestBoundaryPoint(targetObj, worldPt, 14 / this.camera.zoom);
        target = {
          id: targetObj.id,
          anchor: closest.anchor
        };
        this.reconnectSnapIndicator = closest.snapped ? {
          point: closest.point,
          snapName: closest.snapName,
          objectId: targetObj.id
        } : null;
      } else {
        target = { point: { x: worldPt.x, y: worldPt.y } };
        this.reconnectSnapIndicator = null;
      }

      if (conn) {
        conn[this.reconnectingData.endpoint] = target;
        this.latestReconnectTarget = target;
        this.render();
      }
      return;
    }

    if (this.isCreating && this.draftObject) {
      if (this.draftObject.type === 'path') {
        const relX = worldPt.x - this.draftObject.x;
        const relY = worldPt.y - this.draftObject.y;
        this.draftObject.points.push([relX, relY]);
        this.render();
      } else if (this.draftObject.type === 'connector') {
        const hit = this.findObjectAt(worldPt);
        this.draftObject.to = hit && hit.id !== this.draftObject.from?.id ? { id: hit.id } : { point: { ...worldPt } };
        this.draftObject.width = worldPt.x - this.draftObject.x;
        this.draftObject.height = worldPt.y - this.draftObject.y;
        this.render();
      } else {
        // Shapes: Rect, Ellipse, Diamond, Triangle
        let w = worldPt.x - this.dragStart.x;
        let h = worldPt.y - this.dragStart.y;

        if (e.shiftKey) {
          // Constrain to equal sides (square / circle)
          const side = Math.max(Math.abs(w), Math.abs(h));
          w = w < 0 ? -side : side;
          h = h < 0 ? -side : side;
        }

        this.draftObject.x = Math.min(this.dragStart.x, this.dragStart.x + w);
        this.draftObject.y = Math.min(this.dragStart.y, this.dragStart.y + h);
        this.draftObject.width = Math.abs(w);
        this.draftObject.height = Math.abs(h);
        this.render();
      }
    }
  }

  onPointerUp(e) {
    if (this.longPressTimer) {
      clearTimeout(this.longPressTimer);
      this.longPressTimer = null;
    }

    if (this.isPanning) {
      this.isPanning = false;
      this.updateCursor();
      if (!this.panMoved && e.button === 0 && !this.spaceHeld) {
        // Static click while in Hand mode: if clicked an object, select it and switch to select tool!
        const hit = this.findObjectAt(worldPt);
        if (hit) {
          this.selectedIds = [hit.id];
          this.setTool('select');
          this.render();
          return;
        } else if (this.selectedIds.length > 0) {
          this.selectedIds = [];
          this.render();
        }
      }
    }

    if (this.isMarquee) {
      this.isMarquee = false;
      this.marquee = null;
      this.render();
    }

    if (this.isDraggingSelection) {
      this.isDraggingSelection = false;
      this.snapGuides = [];
      const doc = this.callbacks.getDocument();

      if (this.isDDragging) {
        this.isDDragging = false;
        if (this.dragAccumulatedDelta && (this.dragAccumulatedDelta.dx !== 0 || this.dragAccumulatedDelta.dy !== 0)) {
          const origIds = [...this.selectedIds];
          this.callbacks.onCommand({
            type: 'duplicate_objects',
            ids: origIds,
            offset: { x: this.dragAccumulatedDelta.dx, y: this.dragAccumulatedDelta.dy }
          });
          const updatedDoc = this.callbacks.getDocument();
          this.selectedIds = updatedDoc.order.slice(-origIds.length);
        }
        this.dragInitialPositions = null;
        this.dragAccumulatedDelta = null;
        this.render();
        return;
      }

      // Restore initial positions first so dispatchCommand applies clean delta
      if (this.dragInitialPositions) {
        for (const [id, pos] of Object.entries(this.dragInitialPositions)) {
          const obj = doc.objects[id];
          if (obj) {
            obj.x = pos.x;
            obj.y = pos.y;
            if (obj.type === 'connector') {
              if (pos.fromPoint && obj.from) obj.from.point = { ...pos.fromPoint };
              if (pos.toPoint && obj.to) obj.to.point = { ...pos.toPoint };
            }
          }
        }
      }

      if (this.dragAccumulatedDelta && (this.dragAccumulatedDelta.dx !== 0 || this.dragAccumulatedDelta.dy !== 0)) {
        this.callbacks.onCommand({
          type: 'move_objects',
          ids: this.selectedIds,
          dx: this.dragAccumulatedDelta.dx,
          dy: this.dragAccumulatedDelta.dy
        });
      }

      this.dragInitialPositions = null;
      this.dragAccumulatedDelta = null;
      this.render();
    }

    if (this.isResizing) {
      this.isResizing = false;
      const doc = this.callbacks.getDocument();

      if (this.resizeOriginalBounds && this.selectedIds.length > 0) {
        const obj = doc.objects[this.selectedIds[0]];
        if (obj) {
          obj.x = this.resizeOriginalBounds.x;
          obj.y = this.resizeOriginalBounds.y;
          obj.width = this.resizeOriginalBounds.width;
          obj.height = this.resizeOriginalBounds.height;
        }
      }

      if (this.latestResizeBounds && this.selectedIds.length > 0) {
        this.callbacks.onCommand({
          type: 'resize_object',
          id: this.selectedIds[0],
          bounds: this.latestResizeBounds,
          scaleText: true
        });
      }

      this.activeHandle = null;
      this.resizeOriginalBounds = null;
      this.latestResizeBounds = null;
      this.render();
    }

    if (this.isReconnecting) {
      this.isReconnecting = false;
      this.reconnectSnapIndicator = null;
      const doc = this.callbacks.getDocument();

      if (this.reconnectOriginalTarget && this.reconnectingData) {
        const conn = doc.objects[this.reconnectingData.connectorId];
        if (conn) {
          conn[this.reconnectingData.endpoint] = JSON.parse(JSON.stringify(this.reconnectOriginalTarget));
        }
      }

      if (this.latestReconnectTarget && this.reconnectingData) {
        this.callbacks.onCommand({
          type: 'reconnect_connector',
          id: this.reconnectingData.connectorId,
          endpoint: this.reconnectingData.endpoint,
          target: this.latestReconnectTarget
        });
      }

      this.reconnectingData = null;
      this.reconnectOriginalTarget = null;
      this.latestReconnectTarget = null;
      this.render();
    }

    if (this.isCreating && this.draftObject) {
      this.isCreating = false;
      const obj = this.draftObject;
      this.draftObject = null;

      const worldPt = this.screenToWorld(e.clientX, e.clientY);

      if (obj.type === 'path') {
        if (obj.points && obj.points.length > 1) {
          this.callbacks.onCommand({
            type: 'create_object',
            object: obj
          });
          this.selectedIds = [obj.id];
        }
      } else if (obj.type === 'connector') {
        const hit = this.findObjectAt(worldPt);
        if (hit && (!obj.from.id || hit.id !== obj.from.id)) {
          obj.to = { id: hit.id };
        } else {
          const dist = Math.hypot((obj.to?.point?.x || worldPt.x) - obj.x, (obj.to?.point?.y || worldPt.y) - obj.y);
          if (dist < 15) {
            obj.to = { point: { x: obj.x + 140, y: obj.y + 70 } };
          }
        }
        this.callbacks.onCommand({
          type: 'create_object',
          object: obj
        });
        this.selectedIds = [obj.id];
      } else {
        // Shapes: Rectangle, Ellipse, Diamond, Triangle, Text
        // If clicked or barely dragged (<= 25px), spawn comfortable default size centered at click
        if (obj.width <= 25 && obj.height <= 25) {
          if (obj.type === 'text') {
            obj.width = 80;
            obj.height = 32;
            obj.x = Math.round(worldPt.x);
            obj.y = Math.round(worldPt.y - 16);
          } else {
            obj.width = 140;
            obj.height = 80;
            obj.x = Math.round(worldPt.x - 70);
            obj.y = Math.round(worldPt.y - 40);
          }
        }

        this.callbacks.onCommand({
          type: 'create_object',
          object: obj
        });
        this.selectedIds = [obj.id];

        // If text tool, immediately open inline editor
        if (obj.type === 'text') {
          setTimeout(() => {
            this.callbacks.onDoubleClickedObject(obj);
          }, 50);
        }
      }

      // Revert tool back to select
      this.setTool('select');
      this.render();
    }
  }

  onWheel(e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      // Pinch to zoom or ctrl-wheel
      const zoomFactor = Math.pow(0.992, e.deltaY);
      this.zoomAt(e.clientX, e.clientY, zoomFactor);
    } else {
      // Two finger pan or standard wheel
      this.camera.x -= e.deltaX;
      this.camera.y -= e.deltaY;
      this.render();
    }
  }

  render() {
    const doc = this.callbacks.getDocument();
    const runtime = {
      camera: this.camera,
      selectedIds: this.selectedIds,
      marquee: this.marquee,
      snapGuides: this.snapGuides,
      showGrid: this.showGrid !== false,
      reconnectSnapIndicator: this.isReconnecting ? this.reconnectSnapIndicator : null,
      connectorDraft: this.draftObject?.type === 'connector' ? {
        start: this.draftObject.from?.point || { x: this.draftObject.x, y: this.draftObject.y },
        end: this.draftObject.to?.point || { x: this.draftObject.x + this.draftObject.width, y: this.draftObject.y + this.draftObject.height }
      } : null
    };

    let sceneSvg = renderSvgScene(doc, runtime);

    // If D-drag is in progress, insert duplicate preview clones before world-layer closing
    if (this.isDDragging && this.dragAccumulatedDelta && this.selectedIds.length > 0) {
      const dx = this.dragAccumulatedDelta.dx;
      const dy = this.dragAccumulatedDelta.dy;
      const previews = this.selectedIds.map(id => {
        const orig = doc.objects[id];
        if (!orig) return null;
        const p = cloneDocument(orig);
        p.id = 'preview-' + p.id;
        p.x += dx;
        p.y += dy;
        if (p.type === 'connector') {
          if (p.from?.point) { p.from.point.x += dx; p.from.point.y += dy; }
          if (p.to?.point) { p.to.point.x += dx; p.to.point.y += dy; }
        }
        return p;
      }).filter(Boolean);

      const previewMarkup = previews.map(p => renderObject(doc, p, false)).join('\n');
      const worldCloseIndex = sceneSvg.lastIndexOf('</g>');
      if (worldCloseIndex !== -1) {
        sceneSvg = sceneSvg.slice(0, worldCloseIndex) + '\n' + previewMarkup + '\n' + sceneSvg.slice(worldCloseIndex);
      }
    }

    // If a creation draft is in progress, insert it before world-layer closing
    if (this.draftObject) {
      const draftSvg = renderObject(doc, this.draftObject, false);
      const worldCloseIndex = sceneSvg.lastIndexOf('</g>');
      if (worldCloseIndex !== -1) {
        sceneSvg = sceneSvg.slice(0, worldCloseIndex) + '\n' + draftSvg + '\n' + sceneSvg.slice(worldCloseIndex);
      }
    }

    this.container.innerHTML = sceneSvg;
    this.callbacks.onZoomChange?.(this.camera.zoom);
  }

  setSnapGrid(enabled) {
    this.snapGrid = Boolean(enabled);
  }

  setShowGrid(visible) {
    this.showGrid = Boolean(visible);
    this.render();
  }

  setDHold(held) {
    this.isDHeld = Boolean(held);
  }
}

/**
 * Sabura Main Application Entrypoint.
 * 
 * Coordinates the functional core, SVG renderer, contextual circular tool wheel,
 * top bar, keyboard shortcuts, presentation mode, and offline file persistence.
 */














class SaburaApp {
  constructor() {
    this.doc = null;
    this.status = 'Clean'; // 'Clean' | 'Changed' | 'Preparing copy' | 'Copy requested' | 'Error'
    this.interfaceTheme = localStorage.getItem('sabura_ui_theme') || 'system';
    this.undoStack = [];
    this.redoStack = [];
    this.subscribers = new Set();
    this.inPresentation = false;

    this.initDocument();
    this.initDOM();
    this.initServices();
    this.applyInterfaceTheme(this.interfaceTheme);
    this.exposeApi();
  }

  initDocument() {
    const seamScript = document.getElementById('sabura-document');
    if (seamScript && seamScript.textContent.trim()) {
      try {
        const parsed = JSON.parse(seamScript.textContent);
        const val = validateDocument(parsed);
        if (val.valid) {
          this.doc = parsed;
          return;
        }
        console.warn('Embedded document validation failed:', val.errors);
      } catch (err) {
        console.error('Failed to parse embedded document seam:', err);
      }
    }
    // Fallback to initial default board
    this.doc = createDefaultDocument({ title: 'Sabura Board' });
  }

  initDOM() {
    const app = document.getElementById('app');
    app.innerHTML = `
      <div id="canvas-container"></div>
      <canvas id="laser-canvas"></canvas>
      <button class="wheel-trigger-fab" id="btn-wheel-fab" title="Open Tool Wheel (Shortcut: Q or Right-Click)">
        <span>Wheel</span>
        <span class="fab-key">Q</span>
      </button>
    `;

    this.canvasContainer = document.getElementById('canvas-container');
    this.laserCanvas = document.getElementById('laser-canvas');
    this.wheelFab = document.getElementById('btn-wheel-fab');
  }

  initServices() {
    // Laser pointer
    this.laser = new LaserPointer(this.laserCanvas);

    // Workspace
    this.workspace = new Workspace(this.canvasContainer, {
      getDocument: () => this.doc,
      onCommand: (cmd) => this.dispatchCommand(cmd),
      onCommandBatch: (cmds) => this.dispatchCommandBatch(cmds),
      onOpenWheel: (x, y, context, selectedObj) => {
        this.wheel.open(x, y, context, selectedObj, this.doc.theme.palette, this.workspace.selectedIds.length);
      },
      onDoubleClickedObject: (obj) => {
        if (!obj.locked && obj.type !== 'connector') {
          this.textEditor.open(obj, this.workspace.camera);
        }
      },
      onZoomChange: (zoom) => {
        this.zoomToolbar?.setZoom(zoom);
      }
    });

    // In-place text editor
    this.textEditor = new TextEditor(document.getElementById('app'), (objId, newText) => {
      const obj = this.doc.objects[objId];
      if (!newText || !newText.trim()) {
        if (obj && obj.type === 'text') {
          this.dispatchCommand({
            type: 'delete_objects',
            ids: [objId]
          });
          this.workspace.selectedIds = [];
          this.workspace.render();
          return;
        }
      }
      this.dispatchCommand({
        type: 'set_text',
        id: objId,
        text: newText
      });
    });

    // Contextual circular tool wheel
    this.wheel = new ToolWheel(document.getElementById('app'), (actionId, payload) => {
      this.handleWheelAction(actionId, payload);
    });

    // Top Bar
    this.topbar = new TopBar(document.getElementById('app'), {
      onSetBoardTheme: (themeId) => this.setBoardTheme(themeId),
      onSetInterfaceTheme: (uiTheme) => this.setInterfaceTheme(uiTheme),
      onToggleGridVisible: () => this.toggleGridVisible(),
      onToggleGridSnap: () => this.toggleGridSnap(),
      onToggleFullscreen: () => this.toggleFullscreen(),
      onPresent: () => this.enterPresentation(),
      onUndo: () => this.undo(),
      onRedo: () => this.redo(),
      onSaveCopy: () => this.saveCopy()
    });

    // Help Modal
    this.helpModal = new HelpModal(document.getElementById('app'));

    // Zoom Toolbar
    this.zoomToolbar = new ZoomToolbar(document.getElementById('app'), {
      onZoomOut: () => this.workspace.zoomOut(),
      onZoomIn: () => this.workspace.zoomIn(),
      onResetZoom: () => this.workspace.resetZoom(),
      onFit: () => this.workspace.fitToContent(60),
      onOpenHelp: () => this.helpModal.toggle()
    });

    // Shortcuts coordinator
    this.shortcuts = new ShortcutsCoordinator({
      isTextEditing: () => Boolean(this.textEditor?.activeEditor),
      onTriggerWheel: (x, y) => {
        if (this.wheel.isOpen) {
          this.wheel.close();
          return;
        }
        let hit = null;
        let context = 'canvas';
        if (this.workspace.selectedIds.length === 1) {
          hit = this.doc.objects[this.workspace.selectedIds[0]];
          context = 'object';
        } else if (this.workspace.selectedIds.length > 1) {
          context = 'multi';
        } else {
          const worldPt = this.workspace.screenToWorld(x, y);
          hit = this.workspace.findObjectAt(worldPt);
          if (hit) {
            this.workspace.selectedIds = [hit.id];
            this.workspace.render();
            context = 'object';
          }
        }
        this.wheel.open(x, y, context, hit, this.doc.theme.palette, this.workspace.selectedIds.length);
      },
      onSelectTool: (tool) => this.workspace.setTool(tool),
      onSpaceHold: (held) => {
        this.workspace.spaceHeld = held;
        this.workspace.updateCursor();
      },
      onEditText: () => {
        if (this.workspace.selectedIds.length === 1) {
          const obj = this.doc.objects[this.workspace.selectedIds[0]];
          if (obj && !obj.locked && obj.type !== 'connector') {
            this.textEditor.open(obj, this.workspace.camera);
          }
        }
      },
      onDHold: (held) => {
        this.workspace.setDHold(held);
      },
      onUndo: () => this.undo(),
      onRedo: () => this.redo(),
      onDuplicate: () => {
        if (this.workspace.selectedIds.length > 0) {
          this.dispatchCommand({
            type: 'duplicate_objects',
            ids: this.workspace.selectedIds
          });
        }
      },
      onDelete: () => {
        if (this.workspace.selectedIds.length > 0) {
          this.dispatchCommand({
            type: 'delete_objects',
            ids: this.workspace.selectedIds
          });
          this.workspace.selectedIds = [];
        }
      },
      onSelectAll: () => {
        this.workspace.selectedIds = Object.keys(this.doc.objects);
        this.workspace.render();
      },
      onNudge: (dx, dy) => {
        if (this.workspace.selectedIds.length > 0) {
          this.dispatchCommand({
            type: 'move_objects',
            ids: this.workspace.selectedIds,
            dx,
            dy
          });
        }
      },
      onZoomIn: () => this.workspace.zoomIn(),
      onZoomOut: () => this.workspace.zoomOut(),
      onResetZoom: () => this.workspace.resetZoom(),
      onFitContent: () => this.workspace.fitToContent(60),
      onToggleHelp: () => this.helpModal.toggle(),
      onEscape: () => {
        if (this.helpModal?.isOpen) {
          this.helpModal.close();
        } else if (this.inPresentation) {
          this.exitPresentation();
        } else if (this.wheel.isOpen) {
          this.wheel.close();
        } else if (this.textEditor?.activeEditor) {
          this.textEditor.close(true);
        } else if (this.workspace.isDraggingSelection || this.workspace.isResizing || this.workspace.isReconnecting || this.workspace.isCreating) {
          this.workspace.cancelGesture();
        } else if (this.workspace.selectedIds.length > 0) {
          this.workspace.selectedIds = [];
          this.workspace.render();
        } else if (this.workspace.activeTool !== 'hand') {
          this.workspace.setTool('hand');
        }
      }
    });

    // FAB trigger
    this.wheelFab.addEventListener('click', (e) => {
      e.stopPropagation();
      this.wheel.open(window.innerWidth / 2, window.innerHeight / 2, 'canvas', null, this.doc.theme.palette, this.workspace.selectedIds.length);
    });

    // Track presentation laser pointer
    window.addEventListener('pointermove', (e) => {
      if (this.inPresentation) {
        this.laser.addPoint(e.clientX, e.clientY);
      }
    });

    // Fullscreen change listener to sync presentation exit and re-sync canvas size
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && this.inPresentation) {
        this.exitPresentation();
      } else if (this.inPresentation) {
        this.laser.resize();
        this.workspace.fitToContent(80);
      }
    });

    // Unsaved changes warning
    window.addEventListener('beforeunload', (e) => {
      if (this.status === 'Changed') {
        e.preventDefault();
        e.returnValue = 'You have unsaved whiteboard changes. Download a copy to save them.';
        return e.returnValue;
      }
    });

    // Initial render
    this.updateUI();
  }

  dispatchCommand(cmd) {
    const { doc: newDoc, inverseCmd } = applyCommand(this.doc, cmd);
    this.doc = newDoc;
    if (inverseCmd && inverseCmd.type !== 'noop') {
      this.undoStack.push(inverseCmd);
      this.redoStack = []; // Clear redo on new action
    }
    this.status = 'Changed';
    this.updateUI();
    this.notifySubscribers();
  }

  dispatchCommandBatch(cmds) {
    const { doc: newDoc, inverseCmd } = applyCommandBatch(this.doc, cmds);
    this.doc = newDoc;
    if (inverseCmd && inverseCmd.type !== 'noop') {
      this.undoStack.push(inverseCmd);
      this.redoStack = [];
    }
    this.status = 'Changed';
    this.updateUI();
    this.notifySubscribers();
  }

  undo() {
    if (this.undoStack.length === 0) return false;
    const inv = this.undoStack.pop();
    const { doc: newDoc, inverseCmd: redoCmd } = applyCommand(this.doc, inv);
    this.doc = newDoc;
    if (redoCmd && redoCmd.type !== 'noop') {
      this.redoStack.push(redoCmd);
    }
    this.status = 'Changed';
    this.updateUI();
    this.notifySubscribers();
    return true;
  }

  redo() {
    if (this.redoStack.length === 0) return false;
    const redoCmd = this.redoStack.pop();
    const { doc: newDoc, inverseCmd: undoCmd } = applyCommand(this.doc, redoCmd);
    this.doc = newDoc;
    if (undoCmd && undoCmd.type !== 'noop') {
      this.undoStack.push(undoCmd);
    }
    this.status = 'Changed';
    this.updateUI();
    this.notifySubscribers();
    return true;
  }

  handleWheelAction(actionId, payload) {
    const selectedIds = this.workspace.selectedIds;

    // Creation & Mode Tools
    if (actionId === 'tool_select') this.workspace.setTool('select');
    else if (actionId === 'tool_hand') this.workspace.setTool('hand');
    else if (actionId === 'tool_draw') this.workspace.setTool('draw');
    else if (actionId === 'tool_text') this.workspace.setTool('text');
    else if (actionId.startsWith('shape_')) {
      const type = actionId.replace('shape_', '');
      this.workspace.setTool(type);
    } else if (actionId === 'conn_straight') {
      this.workspace.setConnectorRouting('straight');
      this.workspace.setTool('connector');
    } else if (actionId === 'conn_elbow') {
      this.workspace.setConnectorRouting('elbow');
      this.workspace.setTool('connector');
    } else if (actionId === 'conn_curved') {
      this.workspace.setConnectorRouting('curved');
      this.workspace.setTool('connector');
    } else if (actionId === 'action_undo') {
      this.undo();
    } else if (actionId === 'action_redo') {
      this.redo();
    } else if (actionId === 'action_delete') {
      if (selectedIds.length > 0) {
        this.dispatchCommand({ type: 'delete_objects', ids: selectedIds });
        this.workspace.selectedIds = [];
      }
    } else if (actionId === 'action_duplicate') {
      if (selectedIds.length > 0) {
        this.dispatchCommand({ type: 'duplicate_objects', ids: selectedIds });
      }
    } else if (actionId === 'action_lock' || actionId === 'action_unlock') {
      const lock = actionId === 'action_lock';
      this.dispatchCommand({ type: 'lock_objects', ids: selectedIds, locked: lock });
    } else if (actionId === 'action_group') {
      this.dispatchCommand({ type: 'group_objects', ids: selectedIds });
    } else if (actionId === 'action_ungroup') {
      const groupIds = Array.from(new Set(selectedIds.map(id => this.doc.objects[id]?.groupId).filter(Boolean)));
      this.dispatchCommand({ type: 'ungroup_objects', groupIds });
    } else if (actionId === 'action_connect') {
      this.workspace.setTool('connector');
    } else if (actionId.startsWith('order_')) {
      const action = actionId.replace('order_', ''); // 'forward'|'backward'|'front'|'back'
      this.dispatchCommand({ type: 'reorder_objects', ids: selectedIds, action });
    } else if (actionId.startsWith('fill_')) {
      const col = payload.color;
      this.dispatchCommand({ type: 'set_style', ids: selectedIds, updates: { fill: col } });
    } else if (actionId.startsWith('ink_')) {
      const col = payload.color;
      this.dispatchCommand({ type: 'set_style', ids: selectedIds, updates: { stroke: col } });
    } else if (actionId.startsWith('opacity_')) {
      const val = payload.value;
      this.dispatchCommand({ type: 'set_style', ids: selectedIds, updates: { opacity: val } });
    } else if (actionId.startsWith('type_')) {
      if (payload.size) {
        this.dispatchCommand({ type: 'set_typography', ids: selectedIds, updates: { size: payload.size } });
      } else if (payload.toggleBold) {
        const anyBold = selectedIds.some(id => this.doc.objects[id]?.textStyle?.bold);
        this.dispatchCommand({ type: 'set_typography', ids: selectedIds, updates: { bold: !anyBold } });
      } else if (payload.cycleAlign) {
        const firstAlign = this.doc.objects[selectedIds[0]]?.textStyle?.align || 'center';
        const nextAlign = firstAlign === 'left' ? 'center' : (firstAlign === 'center' ? 'right' : 'left');
        this.dispatchCommand({ type: 'set_typography', ids: selectedIds, updates: { align: nextAlign } });
      }
    } else if (actionId.startsWith('font_')) {
      const family = payload.fontFamily || actionId.replace('font_', '');
      this.dispatchCommand({ type: 'set_typography', ids: selectedIds, updates: { fontFamily: family } });
    } else if (actionId.startsWith('conn_route_')) {
      const routing = payload.routing || actionId.replace('conn_route_', '');
      for (const id of selectedIds) {
        this.dispatchCommand({ type: 'configure_connector', id, routing });
      }
    } else if (actionId.startsWith('conn_arrows_')) {
      for (const id of selectedIds) {
        this.dispatchCommand({
          type: 'configure_connector',
          id,
          startArrow: payload.startArrow,
          endArrow: payload.endArrow
        });
      }
    } else if (actionId === 'conn_points_auto') {
      const cmds = [];
      for (const id of selectedIds) {
        const conn = this.doc.objects[id];
        if (conn && conn.type === 'connector') {
          if (conn.from?.id && conn.from.anchor) {
            cmds.push({ type: 'reconnect_connector', id, endpoint: 'from', target: { id: conn.from.id } });
          }
          if (conn.to?.id && conn.to.anchor) {
            cmds.push({ type: 'reconnect_connector', id, endpoint: 'to', target: { id: conn.to.id } });
          }
        }
      }
      if (cmds.length > 0) {
        this.dispatchCommandBatch(cmds);
      }
    } else if (actionId === 'conn_points_auto_from') {
      const cmds = [];
      for (const id of selectedIds) {
        const conn = this.doc.objects[id];
        if (conn && conn.type === 'connector' && conn.from?.id && conn.from.anchor) {
          cmds.push({ type: 'reconnect_connector', id, endpoint: 'from', target: { id: conn.from.id } });
        }
      }
      if (cmds.length > 0) {
        this.dispatchCommandBatch(cmds);
      }
    } else if (actionId === 'conn_points_auto_to') {
      const cmds = [];
      for (const id of selectedIds) {
        const conn = this.doc.objects[id];
        if (conn && conn.type === 'connector' && conn.to?.id && conn.to.anchor) {
          cmds.push({ type: 'reconnect_connector', id, endpoint: 'to', target: { id: conn.to.id } });
        }
      }
      if (cmds.length > 0) {
        this.dispatchCommandBatch(cmds);
      }
    } else if (actionId === 'action_reconnect') {
      if (selectedIds.length === 1 && this.doc.objects[selectedIds[0]]?.type === 'connector') {
        this.workspace.render();
      }
    } else if (actionId.startsWith('to_')) {
      if (actionId === 'to_equal_sides') {
        for (const id of selectedIds) {
          const obj = this.doc.objects[id];
          if (!obj) continue;
          const maxDim = Math.max(obj.width, obj.height);
          this.dispatchCommand({
            type: 'resize_object',
            id,
            bounds: { x: obj.x, y: obj.y, width: maxDim, height: maxDim }
          });
        }
      } else {
        const newType = actionId.replace('to_', '');
        for (const id of selectedIds) {
          this.dispatchCommand({ type: 'change_shape', id, newType });
        }
      }
    } else if (actionId === 'style_sketch') {
      this.dispatchCommand({ type: 'set_style', ids: selectedIds, updates: { roughness: 1 } });
    } else if (actionId === 'style_clean') {
      this.dispatchCommand({ type: 'set_style', ids: selectedIds, updates: { roughness: 0 } });
    } else if (actionId === 'stroke_solid') {
      this.dispatchCommand({ type: 'set_style', ids: selectedIds, updates: { strokeStyle: 'solid' } });
    } else if (actionId === 'stroke_dashed') {
      this.dispatchCommand({ type: 'set_style', ids: selectedIds, updates: { strokeStyle: 'dashed' } });
    } else if (actionId === 'stroke_dotted') {
      this.dispatchCommand({ type: 'set_style', ids: selectedIds, updates: { strokeStyle: 'dotted' } });
    } else if (actionId.startsWith('align_')) {
      const alignment = actionId.replace('align_', '');
      this.dispatchCommand({ type: 'align_objects', ids: selectedIds, alignment });
    } else if (actionId === 'dist_h') {
      this.dispatchCommand({ type: 'distribute_objects', ids: selectedIds, direction: 'horizontal' });
    } else if (actionId === 'dist_v') {
      this.dispatchCommand({ type: 'distribute_objects', ids: selectedIds, direction: 'vertical' });
    }
  }

  setBoardTheme(themeId) {
    if (!THEME_PRESETS[themeId]) return;
    const preset = THEME_PRESETS[themeId];
    this.dispatchCommand({
      type: 'set_board_theme',
      theme: {
        id: preset.id,
        background: preset.background,
        gridColor: preset.gridColor,
        palette: [...preset.palette],
        defaultFill: preset.defaultFill,
        defaultStroke: preset.defaultStroke,
        defaultStrokeWidth: preset.defaultStrokeWidth,
        defaultOpacity: preset.defaultOpacity,
        defaultRoughness: preset.defaultRoughness,
        defaultFontFamily: preset.defaultFontFamily,
        defaultFontSize: preset.defaultFontSize
      }
    });
  }

  setInterfaceTheme(theme) {
    this.interfaceTheme = theme;
    localStorage.setItem('sabura_ui_theme', theme);
    this.applyInterfaceTheme(theme);
    this.updateUI();
  }

  applyInterfaceTheme(theme) {
    document.documentElement.setAttribute('data-ui-theme', theme);
  }

  toggleGridVisible() {
    this.workspace.setShowGrid(!this.workspace.showGrid);
    this.updateUI();
  }

  toggleGridSnap() {
    this.workspace.setSnapGrid(!this.workspace.snapGrid);
    this.updateUI();
  }

  toggleFullscreen() {
    if (!document.fullscreenElement) {
      try {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      } catch (_) {}
    } else {
      try {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      } catch (_) {}
    }
  }

  enterPresentation() {
    this.prePresentationCamera = { ...this.workspace.camera };
    this.textEditor.close(true);
    this.workspace.selectedIds = [];
    this.wheel.close();
    this.helpModal?.close();
    this.inPresentation = true;
    document.body.classList.add('in-presentation');

    this.workspace.fitToContent(80);
    this.laser.start();

    // Request fullscreen (gracefully degrades inside tab if disallowed)
    try {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().then(() => {
          if (this.inPresentation) {
            this.laser.resize();
            this.workspace.fitToContent(80);
          }
        }).catch(() => {});
      }
    } catch (_) {}

    setTimeout(() => {
      if (this.inPresentation) {
        this.laser.resize();
      }
    }, 120);
  }

  exitPresentation() {
    this.inPresentation = false;
    document.body.classList.remove('in-presentation');
    this.laser.stop();
    if (document.fullscreenElement) {
      document.exitFullscreen?.().catch(() => {});
    }
    // Restore previous zoom and viewport
    if (this.prePresentationCamera) {
      this.workspace.camera = { ...this.prePresentationCamera };
      this.prePresentationCamera = null;
    }
    // Return to Hand/Pan mode
    this.workspace.setTool('hand');
    this.workspace.render();
  }

  getCleanHtmlShell() {
    const clone = document.documentElement.cloneNode(true);
    clone.removeAttribute('class');
    const body = clone.querySelector('body');
    if (body) {
      body.removeAttribute('class');
      const appEl = body.querySelector('#app');
      if (appEl) appEl.innerHTML = '';
    }
    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  saveCopy() {
    this.status = 'Preparing copy';
    this.updateUI();

    try {
      // Reconstruct self-contained HTML from clean application shell
      const cleanShell = this.getCleanHtmlShell();
      const packResult = packageHtmlWithDocument(cleanShell, this.doc);

      if (!packResult.success) {
        alert('Failed to package document: ' + packResult.error);
        this.status = 'Error';
        this.updateUI();
        return;
      }

      this.status = 'Copy requested';
      this.updateUI();

      const safeTitle = (this.doc.title || 'whiteboard').toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const filename = `sabura-${safeTitle}-${Date.now().toString(36)}.html`;

      triggerFileDownload(filename, packResult.html);

      setTimeout(() => {
        this.status = 'Clean';
        this.updateUI();
      }, 500);
    } catch (err) {
      console.error('Save Copy failed:', err);
      this.status = 'Error';
      this.updateUI();
    }
  }

  updateUI() {
    this.topbar.update(this.doc, this.status, this.interfaceTheme, this.workspace.snapGrid, this.workspace.showGrid);
    this.workspace.render();
  }

  notifySubscribers() {
    for (const sub of this.subscribers) {
      try {
        sub(this.doc, this.status);
      } catch (err) {
        console.error('Subscriber error:', err);
      }
    }
  }

  exposeApi() {
    window.sabura = {
      getDocument: () => cloneDocument(this.doc),
      applyCommands: (commands) => {
        if (!Array.isArray(commands)) {
          return { success: false, errors: ['Commands must be an array'] };
        }
        // 1. Validate commands upfront
        const validationErrors = [];
        for (let i = 0; i < commands.length; i++) {
          const val = validateCommand(commands[i]);
          if (!val.valid) {
            validationErrors.push(`Command [${i}] (${commands[i]?.type || 'unknown'}): ${val.errors.join(', ')}`);
          }
        }
        if (validationErrors.length > 0) {
          return { success: false, errors: validationErrors };
        }

        // 2. Apply batch atomically on a test copy first
        try {
          const testDoc = cloneDocument(this.doc);
          const { doc: finalDoc, inverseCmd } = applyCommandBatch(testDoc, commands);
          this.doc = finalDoc;
          if (inverseCmd && inverseCmd.type !== 'noop') {
            this.undoStack.push(inverseCmd);
            this.redoStack = [];
          }
          this.status = 'Changed';
          this.updateUI();
          this.notifySubscribers();
          return { success: true, document: cloneDocument(this.doc) };
        } catch (err) {
          return { success: false, errors: [err.message] };
        }
      },
      exportCanonicalJson: () => canonicalJson(this.doc),
      undo: () => this.undo(),
      redo: () => this.redo(),
      subscribe: (listener) => {
        this.subscribers.add(listener);
        return () => this.subscribers.delete(listener);
      }
    };
  }
}

// Auto-bootstrap when loaded in browser
if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  const startApp = () => {
    if (!window.saburaApp) {
      try {
        window.saburaApp = new SaburaApp();
      } catch (err) {
        console.error('Fatal startup error in SaburaApp:', err);
        document.body.innerHTML = '<div style="color: #c92a2a; font-family: monospace; font-size: 16px; padding: 24px; background: #fff5f5; border: 2px solid #ffc9c9; margin: 20px; border-radius: 8px;"><strong>Fatal Sabura Startup Error:</strong><pre style="white-space: pre-wrap; margin-top: 12px;">' + (err.stack || err.message || err) + '</pre></div>';
      }
    }
  };
  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', startApp);
  } else {
    startApp();
  }
}
})();
  </script>
