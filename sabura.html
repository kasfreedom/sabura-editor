<!DOCTYPE html>
<html lang="en" data-ui-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sabura - AI-First Offline Whiteboard</title>
  <style>
/**
 * Sabura Complete Styling: Modern Glassmorphism, Responsive Workspace, Radial Wheel, and Presentation.
 */

:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "SF Mono", Menlo, Monaco, Consolas, monospace;
  --font-hand: "Caveat", "Comic Sans MS", "Chalkboard SE", "Segoe Print", cursive, sans-serif;

  /* UI Chrome Theme - Concepts / Excalidraw Warm Default */
  --ui-bg: rgba(252, 250, 246, 0.92);
  --ui-bg-solid: #fcfaf6;
  --ui-text: #212529;
  --ui-text-muted: #6c757d;
  --ui-border: rgba(0, 0, 0, 0.22);
  --ui-hover: rgba(0, 0, 0, 0.05);
  --ui-active: rgba(0, 0, 0, 0.1);
  --ui-accent: #1971c2;
  --ui-accent-hover: #1864ab;
  --ui-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
  --ui-wheel-bg: #fffefc;
  --ui-wheel-hover: #fff3bf;
  --ui-wheel-active: #d0ebff;
  --ui-wheel-danger: #ffe3e3;
  --ui-wheel-text: #1e1e1e;
  --ui-wheel-stroke: #1e1e1e;
}

[data-ui-theme="dark"] {
  --ui-bg: rgba(26, 27, 38, 0.92);
  --ui-bg-solid: #1a1b26;
  --ui-text: #c0caf5;
  --ui-text-muted: #7982a9;
  --ui-border: rgba(255, 255, 255, 0.18);
  --ui-hover: rgba(255, 255, 255, 0.08);
  --ui-active: rgba(255, 255, 255, 0.15);
  --ui-accent: #7aa2f7;
  --ui-accent-hover: #89b4fa;
  --ui-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  --ui-wheel-bg: #1e202e;
  --ui-wheel-hover: #2e344e;
  --ui-wheel-active: #3b4261;
  --ui-wheel-danger: #442b36;
  --ui-wheel-text: #c0caf5;
  --ui-wheel-stroke: #c0caf5;
}

@media (prefers-color-scheme: dark) {
  [data-ui-theme="system"] {
    --ui-bg: rgba(26, 27, 38, 0.92);
    --ui-bg-solid: #1a1b26;
    --ui-text: #c0caf5;
    --ui-text-muted: #7982a9;
    --ui-border: rgba(255, 255, 255, 0.18);
    --ui-hover: rgba(255, 255, 255, 0.08);
    --ui-active: rgba(255, 255, 255, 0.15);
    --ui-accent: #7aa2f7;
    --ui-accent-hover: #89b4fa;
    --ui-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    --ui-wheel-bg: #1e202e;
    --ui-wheel-hover: #2e344e;
    --ui-wheel-active: #3b4261;
    --ui-wheel-danger: #442b36;
    --ui-wheel-text: #c0caf5;
    --ui-wheel-stroke: #c0caf5;
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: var(--font-sans);
  background: #fdfbf7;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* Canvas SVG container */
#canvas-container {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#canvas-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Top Bar - Excalidraw Sketchy Island Style */
.sabura-topbar {
  position: absolute;
  top: 14px;
  left: 16px;
  right: 16px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: var(--ui-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 2px solid var(--ui-border);
  border-radius: 255px 25px 225px 25px/25px 225px 25px 255px;
  box-shadow: 2px 4px 0 rgba(0, 0, 0, 0.08);
  z-index: 50;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.topbar-left, .topbar-center, .topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-name {
  font-family: var(--font-hand);
  font-size: 25px;
  font-weight: 700;
  color: var(--ui-accent);
  letter-spacing: -0.5px;
}

.doc-title {
  font-family: var(--font-hand);
  font-size: 17px;
  font-weight: 600;
  color: var(--ui-text);
  max-width: 180px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  background: var(--ui-hover);
  border: 1.5px solid var(--ui-border);
  border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
  font-family: var(--font-hand);
  font-size: 14px;
  font-weight: 600;
  color: var(--ui-text);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

.control-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-hand);
  font-size: 15px;
  font-weight: 600;
  color: var(--ui-text);
}

.grid-controls-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.topbar-select {
  padding: 4px 10px;
  background: var(--ui-bg-solid);
  color: var(--ui-text);
  border: 1.6px solid var(--ui-border);
  border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
  font-family: var(--font-hand);
  font-size: 14px;
  font-weight: 600;
  outline: none;
  cursor: pointer;
  transition: all 0.12s ease;
}

.topbar-select:hover {
  border-color: var(--ui-accent);
  background: #fff3bf;
}

.topbar-btn {
  padding: 5px 14px;
  background: var(--ui-bg-solid);
  color: var(--ui-text);
  border: 1.8px solid var(--ui-border);
  border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
  box-shadow: 1px 2px 0 rgba(0, 0, 0, 0.08);
  font-family: var(--font-hand);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.12s ease;
}

.topbar-btn:hover {
  background: #fff3bf;
  transform: translateY(-1px);
  box-shadow: 1px 3px 0 rgba(0, 0, 0, 0.12);
}

.topbar-btn:active {
  transform: translate(1px, 1px);
  box-shadow: none;
}

.topbar-btn.active {
  background: #d0ebff;
  color: #1971c2;
  border-color: #1971c2;
}

.topbar-btn.primary {
  background: #d0ebff;
  color: #1864ab;
  border-color: #1971c2;
  border-width: 2px;
}

.topbar-btn.primary:hover {
  background: #a5d8ff;
}

.topbar-btn.save-btn {
  background: #d3f9d8;
  color: #2b8a3e;
  border-color: #2f9e44;
  border-width: 2px;
}

.topbar-btn.save-btn:hover {
  background: #b2f2bb;
}

.topbar-divider {
  width: 1px;
  height: 24px;
  background: var(--ui-border);
}

/* Accessible on-screen Wheel Trigger Button - Excalidraw Sketchy FAB */
.wheel-trigger-fab {
  position: absolute;
  bottom: 66px;
  left: 16px;
  padding: 8px 16px;
  background: var(--ui-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 2px solid var(--ui-border);
  border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
  box-shadow: 2px 4px 0 rgba(0, 0, 0, 0.1);
  color: var(--ui-text);
  font-family: var(--font-hand);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.15s ease, background 0.15s ease;
}

.wheel-trigger-fab:hover {
  background: #fff3bf;
  transform: translateY(-2px);
}

.wheel-trigger-fab .fab-key {
  padding: 2px 6px;
  background: rgba(0, 0, 0, 0.06);
  border: 1px solid var(--ui-border);
  border-radius: 4px;
  font-size: 12px;
  font-family: var(--font-mono);
}

/* Circular Tool Wheel - Excalidraw Sketchy Compass Dial */
.sabura-wheel {
  position: absolute;
  transform: translate(-50%, -50%);
  z-index: 1000;
  filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.22));
  pointer-events: auto;
}

.sabura-wheel-svg {
  display: block;
}

.wheel-bezel-rim {
  fill: none;
  stroke: var(--ui-wheel-stroke, #1e1e1e);
  stroke-width: 1.2px;
  opacity: 0.35;
  stroke-linecap: round;
}

.wheel-hub {
  fill: var(--ui-wheel-bg, #ffffff);
  stroke: none;
  cursor: pointer;
  transition: fill 0.15s ease;
}

.wheel-hub:hover {
  fill: var(--ui-wheel-hover, #fff3bf);
}

.wheel-hub-sketch {
  fill: none;
  stroke: var(--ui-wheel-stroke, #1e1e1e);
  stroke-width: 1.8px;
  stroke-linecap: round;
}

.wheel-hub-x {
  fill: none;
  stroke: var(--ui-wheel-stroke, #1e1e1e);
  stroke-width: 2px;
  stroke-linecap: round;
}

.wheel-wedge {
  fill: var(--ui-wheel-bg, #ffffff);
  stroke: none;
  cursor: pointer;
  pointer-events: all;
  transition: fill 0.12s ease;
}

.wheel-wedge:hover, .wheel-wedge.active {
  fill: var(--ui-wheel-hover, #fff3bf);
}

.wheel-wedge.danger:hover {
  fill: var(--ui-wheel-danger, #ffe3e3);
}

.wheel-wedge.disabled {
  opacity: 0.32;
  cursor: not-allowed;
  pointer-events: none;
}

.wheel-wedge-sketch.disabled {
  opacity: 0.32;
  stroke: #adb5bd;
}

.wheel-label-group.disabled {
  opacity: 0.32;
  pointer-events: none;
}

.wheel-wedge-sketch {
  fill: none;
  stroke: var(--ui-wheel-stroke, #1e1e1e);
  stroke-width: 1.5px;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke 0.12s ease, stroke-width 0.12s ease;
}

.wheel-wedge-sketch.active {
  stroke: var(--ui-accent, #1971c2);
  stroke-width: 2.2px;
}

.wheel-sub-wedge {
  fill: var(--ui-wheel-bg, #ffffff);
  stroke: none;
  cursor: pointer;
  pointer-events: all;
  transition: filter 0.12s ease;
}

.wheel-sub-wedge:hover {
  filter: brightness(0.94);
}

.wheel-sub-wedge.active-choice {
  fill: #d0ebff !important;
}

.wheel-wedge:focus-visible, .wheel-sub-wedge:focus-visible, .wheel-hub:focus-visible {
  outline: 2.5px solid var(--ui-accent, #1971c2);
  outline-offset: -2px;
}

.wheel-icon {
  font-size: 15px;
  fill: var(--ui-wheel-text, #1e1e1e);
  font-weight: 700;
  font-family: var(--font-hand);
}

.wheel-text {
  font-size: 11.5px;
  fill: var(--ui-wheel-text, #1e1e1e);
  font-weight: 700;
  font-family: var(--font-hand);
  letter-spacing: 0.15px;
}

.wheel-sub-text {
  font-size: 11px;
  fill: var(--ui-wheel-text, #1e1e1e);
  font-weight: 700;
  font-family: var(--font-hand);
  letter-spacing: 0;
}

.wheel-third-wedge {
  fill: var(--ui-wheel-bg, #ffffff);
  stroke: none;
  cursor: pointer;
  pointer-events: all;
  transition: filter 0.12s ease;
}

.wheel-third-wedge:hover {
  filter: brightness(0.94);
}

.wheel-third-wedge.active-choice {
  fill: #d0ebff !important;
}

.wheel-color-check {
  pointer-events: none;
  font-family: system-ui, -apple-system, sans-serif;
  user-select: none;
}

/* In-place Text Editor - Excalidraw Handwriting Feel */
.sabura-inline-text-editor {
  position: absolute;
  font-family: var(--font-hand);
  background: rgba(255, 255, 255, 0.9);
  border: 1.5px dashed var(--ui-accent);
  border-radius: 4px;
  line-height: 1.3;
  overflow: hidden;
  resize: none;
  outline: none;
  padding: 2px 6px;
  z-index: 200;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

/* Laser overlay canvas for presentation mode */
#laser-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 100;
  display: none;
}

/* Presentation Mode states */
body.in-presentation .sabura-topbar,
body.in-presentation .wheel-trigger-fab,
body.in-presentation .sabura-wheel,
body.in-presentation .zoom-help-toolbar {
  display: none !important;
}

body.in-presentation #laser-canvas {
  display: block;
}

body.in-presentation {
  cursor: none;
}

/* Compact Bottom-Left Zoom & Help Toolbar */
.zoom-help-toolbar {
  position: fixed;
  bottom: 16px;
  left: 16px;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 4px 6px;
  background: var(--ui-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 2px solid var(--ui-border);
  border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
  box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.12);
  z-index: 40;
  user-select: none;
  -webkit-user-select: none;
}

.zoom-btn {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--ui-text);
  font-family: var(--font-hand);
  font-size: 15px;
  font-weight: 700;
  padding: 4px 8px;
  min-width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
}

.zoom-btn:hover {
  background: var(--ui-surface);
  border-color: var(--ui-border);
}

.zoom-btn:active {
  transform: scale(0.94);
}

.zoom-btn.zoom-percent {
  font-family: var(--font-mono);
  font-size: 13px;
  min-width: 52px;
}

.zoom-btn.zoom-fit {
  font-size: 13px;
  padding: 4px 6px;
}

.zoom-btn.zoom-help {
  font-size: 14px;
  border-radius: 50%;
  width: 26px;
  height: 26px;
  min-width: 26px;
  border: 1px dashed var(--ui-border);
}

/* Accessible Help & Shortcuts Modal Backdrop */
.sabura-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.15s ease-out;
}

.sabura-modal-backdrop.visible {
  display: flex;
  opacity: 1;
}

/* Modal Dialog Window */
.sabura-modal-dialog {
  background: var(--ui-bg);
  color: var(--ui-text);
  border: 2.5px solid var(--ui-border);
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
  max-width: 720px;
  width: 92%;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: var(--font-hand);
  animation: modalPop 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes modalPop {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.help-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  border-bottom: 2px solid var(--ui-border);
  background: var(--ui-surface);
}

.help-title-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.help-logo {
  font-size: 18px;
  font-weight: 800;
  color: #1971c2;
  border: 1.5px solid #1971c2;
  padding: 2px 8px;
  border-radius: 6px;
}

.help-header h2 {
  font-size: 18px;
  margin: 0;
  font-weight: 700;
}

.help-close-btn {
  background: transparent;
  border: 1.5px solid var(--ui-border);
  border-radius: 6px;
  font-size: 14px;
  font-weight: 700;
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ui-text);
  transition: background 0.15s ease;
}

.help-close-btn:hover {
  background: #ffe3e3;
  color: #c92a2a;
}

.help-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  padding: 18px 24px;
  overflow-y: auto;
}

@media (max-width: 620px) {
  .help-body {
    grid-template-columns: 1fr;
  }
}

.help-section {
  margin-bottom: 18px;
}

.help-section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 8px 0;
  color: #1971c2;
  border-bottom: 1px dashed var(--ui-border);
  padding-bottom: 4px;
}

[data-ui-theme="dark"] .help-section-title {
  color: #74c0fc;
}

.help-list {
  list-style: none;
  margin: 0;
  padding: 0;
  font-size: 13.5px;
}

.help-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
  gap: 12px;
}

.help-desc {
  font-weight: 500;
}

.kbd-badge {
  display: inline-block;
  padding: 2px 6px;
  font-size: 11px;
  font-family: var(--font-mono);
  background: var(--ui-surface);
  border: 1px solid var(--ui-border);
  border-radius: 4px;
  box-shadow: 0 1px 1px rgba(0, 0, 0, 0.15);
  font-weight: 600;
  color: var(--ui-text);
  white-space: nowrap;
}

.help-footer {
  padding: 10px 20px;
  border-top: 1px solid var(--ui-border);
  font-size: 12px;
  color: var(--ui-text-muted);
  background: var(--ui-surface);
  text-align: center;
}

        type: 'delete_objects',
        ids: [obj.id]
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'delete_objects': {

      const savedObjects = [];
      for (const id of idsToDelete) {
        const index = newDoc.order.indexOf(id);
        savedObjects.push({
          object: cloneDocument(newDoc.objects[id]),
          orderIndex: index
        });
        delete newDoc.objects[id];

      newDoc.order = newDoc.order.filter(id => !idsToDelete.includes(id));

      if (Array.isArray(cmd.removeGroups)) {
        for (const gId of cmd.removeGroups) {

      }

      const affectedConnectors = [];
      for (const [cId, conn] of Object.entries(newDoc.objects)) {
        if (conn.type !== 'connector') continue;
        let modified = false;
        const prevFrom = cloneDocument(conn.from);
        const prevTo = cloneDocument(conn.to);

        if (conn.from && conn.from.id && idsToDelete.includes(conn.from.id)) {

          modified = true;
        }
        if (conn.to && conn.to.id && idsToDelete.includes(conn.to.id)) {
          conn.to = { point: conn.to.point || { x: conn.x + conn.width, y: conn.y + conn.height } };
          modified = true;
        }
        if (modified) {

        }
      }

      const inverseCmd = {
        type: 'batch',
        commands: [
          ...savedObjects.map(item => ({
            type: 'create_object',
            object: item.object,
            atIndex: item.orderIndex

            from: ac.prevFrom,
            to: ac.prevTo

        newDoc.order.push(newId);
        duplicatedIds.push(newId);

              const resolved = resolveConnectorGeometry(doc, origConn);

                  x: resolved.end.x + offset.x,
                  y: resolved.end.y + offset.y

        if (typeof obj.y === 'number') obj.y += dy;

        dx: -dx,
        dy: -dy

    if (this.active) {

    this.active = true;

    const y = clientY - rect.top;

function hexToLuminance(hex) {

function createWedgePath(cx, cy, rInner, rOuter, startAngle, endAngle, gapAngle = 0.025) {
  const span = endAngle - startAngle;
  const actualGap = Math.min(gapAngle, span * 0.25);
  const actualStart = startAngle + actualGap / 2;
  const actualEnd = endAngle - actualGap / 2;

  const x1 = cx + rOuter * Math.cos(actualStart);
  const y1 = cy + rOuter * Math.sin(actualStart);
  const x2 = cx + rOuter * Math.cos(actualEnd);
  const y2 = cy + rOuter * Math.sin(actualEnd);

  const x3 = cx + rInner * Math.cos(actualEnd);
  const y3 = cy + rInner * Math.sin(actualEnd);
  const x4 = cx + rInner * Math.cos(actualStart);
  const y4 = cy + rInner * Math.sin(actualStart);

  const largeArc = actualEnd - actualStart > Math.PI ? 1 : 0;

  if (rInner <= 0) {
    return `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
  }

  return `M ${x4.toFixed(2)} ${y4.toFixed(2)} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L ${x3.toFixed(2)} ${y3.toFixed(2)} A ${rInner} ${rInner} 0 ${largeArc} 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
}

function isDarkColor(hex) {
  if (!hex || hex === 'none' || hex[0] !== '#') return false;
  const num = parseInt(hex.slice(1), 16);
  if (isNaN(num)) return false;
  const r = (num >> 16) & 255;
  const g = (num >> 8) & 255;
  const b = num & 255;
  const luma = 0.299 * r + 0.587 * g + 0.114 * b;
  return luma < 140;
}

}

      label: 'Align',
      icon: '⫿',
      disabled: spatialCount < 2,
      subItems: [
        { id: 'align_left', label: 'Left', icon: '⇤' },
        { id: 'align_center', label: 'Center H', icon: '⫿' },
        { id: 'align_right', label: 'Right', icon: '⇥' },
        { id: 'align_top', label: 'Top', icon: '⤒' },
        { id: 'align_middle', label: 'Middle V', icon: '⁼' },
        { id: 'align_bottom', label: 'Bottom', icon: '⤓' }
      ]
    };

    const distItem = {
      id: 'menu_distribute',
      label: 'Distribute',
      icon: '↔',
      disabled: spatialCount < 3,
      subItems: [
        { id: 'dist_h', label: 'Horizontal', icon: '↔' },
        { id: 'dist_v', label: 'Vertical', icon: '↕' }
      ]
    };

    const groupItem = isGrouped
      ? { id: 'action_ungroup', label: 'Ungroup', icon: '⧉' }
      : { id: 'action_group', label: 'Group', icon: '⧉' };

    const dupItem = { id: 'action_duplicate', label: 'Duplicate', icon: '❐' };

    const orderSub = [
      { id: 'order_front', label: 'Front', icon: '⇈' },
      { id: 'order_forward', label: 'Forward', icon: '↑' },
      { id: 'order_backward', label: 'Backward', icon: '↓' },
      { id: 'order_back', label: 'Back', icon: '⇊' },
      { id: anyUnlocked ? 'action_lock' : 'action_unlock', label: anyUnlocked ? 'Lock' : 'Unlock', icon: anyUnlocked ? '🔒' : '🔓' }
    ];

    const firstObj = this.selectedObjects?.[0];
    const curStrokeWidth = firstObj?.strokeWidth !== undefined ? firstObj.strokeWidth : 2;
    const styleSub = [
      { id: 'style_sketch', label: 'Sketch', icon: '✎' },
      { id: 'style_clean', label: 'Clean', icon: '◻' },
      { id: 'stroke_solid', label: 'Solid', icon: '—' },
      { id: 'stroke_dashed', label: 'Dashed', icon: '╌' },
      { id: 'stroke_dotted', label: 'Dotted', icon: '···' }
    ];

    const inkSub = this.themePalette.map((col, idx) => ({ id: `ink_${idx}`, label: col, color: col }));

    const delItem = { id: 'action_delete', label: 'Delete', icon: '🗑' };

    return [
      alignItem,
      distItem,
      groupItem,
      dupItem,
      { id: 'menu_order', label: 'Arrange', icon: '≡', subItems: orderSub },
      { id: 'menu_style', label: 'Style', icon: '✎', subItems: styleSub, thirdItems: getStrokeWidthItems(curStrokeWidth) },
      { id: 'menu_ink', label: 'Ink', icon: '●', subItems: inkSub },
      delItem
    ];
  }

  getItems() {
    if (this.context === 'canvas') {
      return this.getCanvasItems();
    }

    const isLocked = Boolean(this.selectedObject?.locked);
    const isMulti = this.selectedCount > 1;

    if (isMulti) {
      const spatialObjects = this.selectedObjects.filter(o => o && o.type !== 'connector' && !o.locked);
      const isGrouped = Boolean(this.selectedObject?.groupId) || this.selectedObjects.some(o => o?.groupId);
      const anyUnlocked = this.selectedObjects.length > 0 ? this.selectedObjects.some(o => !o.locked) : true;
      return this.getMultiItems(spatialObjects.length, isGrouped, anyUnlocked);
    }

    if (this.selectedObject?.type === 'path') {
      return this.getPathItems(this.selectedObject, isLocked);
    }

    if (this.selectedObject?.type === 'connector') {
      return this.getConnectorItems(this.selectedObject, isLocked);
    }

    return this.getShapeItems(this.selectedObject, isLocked);
  }

  handleItemClick(item) {
    if (item.disabled) return;
    if (item.subItems && item.subItems.length > 0) {
      this.activeSubMenu = this.activeSubMenu === item.id ? null : item.id;
      this.render();
      return;
    }
    this.onAction(item.id, item);
    this.close();
  }

  render() {
    const items = this.getItems();
    const count = items.length;
    const rInner = 38;
    const rOuter = 112;
    const rSubOuter = 172;
    const rThirdOuter = 216;

    let svgParts = [];
    const size = (rThirdOuter + 20) * 2;
    const center = size / 2;

    svgParts.push(`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="sabura-wheel-svg">`);

    const prng = createPRNG(4242);

    const rimSketch = sketchEllipse(center, center, rOuter + 2, rOuter + 2, prng, 1);
    svgParts.push(`<path d="${rimSketch}" class="wheel-bezel-rim" pointer-events="none" />`);

    if (this.activeSubMenu) {
      const subRimSketch = sketchEllipse(center, center, rSubOuter + 2, rSubOuter + 2, prng, 1);
      svgParts.push(`<path d="${subRimSketch}" class="wheel-bezel-rim sub" pointer-events="none" />`);
    }

    svgParts.push(`<circle cx="${center}" cy="${center}" r="${rInner - 3}" class="wheel-hub" tabindex="0" role="button" aria-label="Close Wheel" />`);

    const hubSketch = sketchEllipse(center, center, rInner - 3, rInner - 3, prng, 1);
    svgParts.push(`<path d="${hubSketch}" class="wheel-hub-sketch" pointer-events="none" />`);

    const x1 = sketchLine(center - 5, center - 5, center + 5, center + 5, prng, 1);
    const x2 = sketchLine(center + 5, center - 5, center - 5, center + 5, prng, 1);
    svgParts.push(`<path d="${x1} ${x2}" class="wheel-hub-x" pointer-events="none" />`);

    const angleStep = (Math.PI * 2) / count;

    const angleOffset = -Math.PI / 2 - angleStep / 2;

    let subMenuToRender = null;
    let thirdMenuToRender = null;
    let subMenuStartAngle = 0;
    let subMenuEndAngle = 0;

    for (let i = 0; i < count; i++) {
      const item = items[i];
      const startAngle = angleOffset + i * angleStep;
      const endAngle = startAngle + angleStep;
      const midAngle = (startAngle + endAngle) / 2;

      const isDisabled = Boolean(item.disabled);
      const pathD = createWedgePath(center, center, rInner, rOuter, startAngle, endAngle);
      const isSubActive = this.activeSubMenu === item.id;
      const wedgeClass = `wheel-wedge ${isSubActive ? 'active' : ''} ${item.id.includes('delete') ? 'danger' : ''} ${isDisabled ? 'disabled' : ''}`;

      svgParts.push(`<path d="${pathD}" class="${wedgeClass}" data-item-id="${item.id}" ${isDisabled ? 'aria-disabled="true"' : 'tabindex="0" role="button"'} aria-label="${item.label}" />`);

      const sketchD = sketchWedge(center, center, rInner, rOuter, startAngle, endAngle, prng, 1);
      svgParts.push(`<path d="${sketchD}" class="wheel-wedge-sketch ${isSubActive ? 'active' : ''} ${isDisabled ? 'disabled' : ''}" pointer-events="none" />`);

      const textR = (rInner + rOuter) / 2;
      const iconX = center + textR * Math.cos(midAngle);
      const iconY = center + textR * Math.sin(midAngle) - 7;
      const labelX = center + textR * Math.cos(midAngle);
      const labelY = center + textR * Math.sin(midAngle) + 12;

      svgParts.push(`<g class="wheel-label-group ${isDisabled ? 'disabled' : ''}" pointer-events="none">
        <text x="${iconX}" y="${iconY}" text-anchor="middle" class="wheel-icon">${item.icon || ''}</text>
        <text x="${labelX}" y="${labelY}" text-anchor="middle" class="wheel-text">${item.label}</text>
      </g>`);

      if (isSubActive && item.subItems && !isDisabled) {
        subMenuToRender = item.subItems;
        thirdMenuToRender = item.thirdItems || null;
        subMenuStartAngle = startAngle - 0.2;
        subMenuEndAngle = endAngle + 0.2;
      }
    }

    if (subMenuToRender && subMenuToRender.length > 0) {
      const subCount = subMenuToRender.length;
      const spanPerItem = 0.28;
      const totalSpan = Math.min(Math.PI * 1.15, Math.max(0.5, subCount * spanPerItem));
      const midParent = (subMenuStartAngle + subMenuEndAngle) / 2;
      const subStartBase = midParent - totalSpan / 2;
      const subStep = totalSpan / subCount;

      for (let j = 0; j < subCount; j++) {
        const sub = subMenuToRender[j];
        const sStart = subStartBase + j * subStep;
        const sEnd = sStart + subStep;
        const sMid = (sStart + sEnd) / 2;

        const subPath = createWedgePath(center, center, rOuter + 4, rSubOuter, sStart, sEnd);
        const colorStyle = (sub.color && sub.color !== 'none') ? `fill: ${sub.color}; stroke: #dee2e6;` : '';
        const isSubActive = Boolean(sub.isActive);

        svgParts.push(`<path d="${subPath}" class="wheel-sub-wedge ${isSubActive ? 'active-choice' : ''}" data-sub-id="${sub.id}" tabindex="0" role="button" aria-label="${sub.label}" style="${colorStyle}" />`);
        const subSketchD = sketchWedge(center, center, rOuter + 4, rSubOuter, sStart, sEnd, prng, 1);
        svgParts.push(`<path d="${subSketchD}" class="wheel-wedge-sketch ${isSubActive ? 'active' : ''}" pointer-events="none" />`);

        const sTextR = (rOuter + 4 + rSubOuter) / 2;
        const sX = center + sTextR * Math.cos(sMid);
        const sY = center + sTextR * Math.sin(sMid);

        if (sub.color && sub.color !== 'none') {

          if (isSubActive) {
            const checkFill = isDarkColor(sub.color) ? '#ffffff' : '#1e1e1e';
            svgParts.push(`<g class="wheel-label-group" pointer-events="none">
              <text x="${sX}" y="${sY + 5}" text-anchor="middle" class="wheel-color-check" style="fill: ${checkFill}; font-size: 15px; font-weight: bold;">✓</text>
            </g>`);
          }
        } else {

          svgParts.push(`<g class="wheel-label-group" pointer-events="none">
            <text x="${sX}" y="${sY - 6}" text-anchor="middle" class="wheel-icon">${sub.icon || ''}</text>
            <text x="${sX}" y="${sY + 11}" text-anchor="middle" class="wheel-sub-text">${sub.label}${isSubActive ? ' ✓' : ''}</text>
          </g>`);
        }
      }

      if (thirdMenuToRender && thirdMenuToRender.length > 0) {
        const thirdRimSketch = sketchEllipse(center, center, rThirdOuter + 2, rThirdOuter + 2, prng, 1);
        svgParts.push(`<path d="${thirdRimSketch}" class="wheel-bezel-rim sub" pointer-events="none" />`);

        const thirdCount = thirdMenuToRender.length;
        const spanPerThird = thirdCount <= 3 ? 0.42 : 0.28;
        const totalThirdSpan = Math.max(0.7, thirdCount * spanPerThird);
        const thirdStartBase = midParent - totalThirdSpan / 2;
        const thirdStep = totalThirdSpan / thirdCount;

        for (let k = 0; k < thirdCount; k++) {
          const third = thirdMenuToRender[k];
          const tStart = thirdStartBase + k * thirdStep;
          const tEnd = tStart + thirdStep;
          const tMid = (tStart + tEnd) / 2;

          const tPath = createWedgePath(center, center, rSubOuter + 4, rThirdOuter, tStart, tEnd);
          const isThirdActive = Boolean(third.isActive);

          svgParts.push(`<path d="${tPath}" class="wheel-sub-wedge wheel-third-wedge ${isThirdActive ? 'active-choice' : ''}" data-sub-id="${third.id}" tabindex="0" role="button" aria-label="${third.label}" />`);
          const tSketchD = sketchWedge(center, center, rSubOuter + 4, rThirdOuter, tStart, tEnd, prng, 1);
          svgParts.push(`<path d="${tSketchD}" class="wheel-wedge-sketch ${isThirdActive ? 'active' : ''}" pointer-events="none" />`);

          const tTextR = (rSubOuter + 4 + rThirdOuter) / 2;
          const tX = center + tTextR * Math.cos(tMid);
          const tY = center + tTextR * Math.sin(tMid);

          if (third.icon) {
            svgParts.push(`<g class="wheel-label-group" pointer-events="none">
              <text x="${tX}" y="${tY - 2}" text-anchor="middle" class="wheel-sub-icon">${third.icon}</text>
              <text x="${tX}" y="${tY + 12}" text-anchor="middle" class="wheel-sub-text" style="font-weight: 700;">${third.label}${isThirdActive ? ' ✓' : ''}</text>
            </g>`);
          } else {
            svgParts.push(`<g class="wheel-label-group" pointer-events="none">
              <text x="${tX}" y="${tY + 4}" text-anchor="middle" class="wheel-sub-text" style="font-weight: 700;">${third.label}${isThirdActive ? ' ✓' : ''}</text>
            </g>`);
          }
        }
      }
    }

    svgParts.push('</svg>');
    this.wheelEl.innerHTML = svgParts.join('\n');

    const allWedges = this.wheelEl.querySelectorAll('.wheel-wedge');
    allWedges.forEach(w => {
      const id = w.getAttribute('data-item-id');
      const item = items.find(it => it.id === id);
      if (!item || item.disabled) return;

      w.addEventListener('mouseenter', () => {
        if (item.subItems && item.subItems.length > 0 && this.activeSubMenu !== item.id) {
          this.activeSubMenu = item.id;
          this.render();
        }
      });

      const activate = (e) => {
        e.stopPropagation();
        this.handleItemClick(item);
      };

      w.addEventListener('click', activate);
      w.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activate(e);
        }
      });
    });

    const subWedges = this.wheelEl.querySelectorAll('.wheel-sub-wedge');
    subWedges.forEach(sw => {
      const subId = sw.getAttribute('data-sub-id');
      const subItem = (subMenuToRender || []).find(s => s.id === subId) || (thirdMenuToRender || []).find(s => s.id === subId);
      if (!subItem) return;

      const activateSub = (e) => {
        e.stopPropagation();
        this.onAction(subItem.id, subItem);
        this.close();
      };

      sw.addEventListener('click', activateSub);
      sw.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activateSub(e);
        }
      });
    });

    const hub = this.wheelEl.querySelector('.wheel-hub');
    if (hub) {
      const closeHub = (e) => {
        e.stopPropagation();
        this.close();
      };
      hub.addEventListener('click', closeHub);
      hub.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          closeHub(e);
        }
      });
    }
  }
}

class TextEditor {
  constructor(containerElement, onCommit) {
    this.container = containerElement;
    this.onCommit = onCommit;
    this.targetObject = null;
    this.initialText = '';

    this.textarea = document.createElement('textarea');
    this.textarea.className = 'sabura-inline-text-editor';
    this.textarea.style.display = 'none';
    this.container.appendChild(this.textarea);

    this.onBlur = this.onBlur.bind(this);
    this.onKeyDown = this.onKeyDown.bind(this);

    this.textarea.addEventListener('blur', this.onBlur);
    this.textarea.addEventListener('keydown', this.onKeyDown);
  }

  open(object, camera) {
    this.targetObject = object;
    this.initialText = object.text || '';

    const textStyle = object.textStyle || {};
    const fontSize = (textStyle.resolvedSize || 20) * camera.zoom;
    const fontFamily = FONT_FAMILIES[textStyle.fontFamily] || FONT_FAMILIES.sans;
    const fontWeight = textStyle.bold ? 'bold' : 'normal';
    const align = textStyle.align || (object.type === 'text' ? 'left' : 'center');
    const color = textStyle.color || object.stroke || '#1e1e1e';

    const screenX = object.x * camera.zoom + camera.x;
    const screenY = object.y * camera.zoom + camera.y;
    const screenW = Math.max(120, object.width * camera.zoom);
    const screenH = Math.max(40, object.height * camera.zoom);

    this.textarea.style.display = 'block';
    this.textarea.style.left = `${screenX}px`;
    this.textarea.style.top = `${screenY}px`;
    this.textarea.style.width = `${screenW}px`;
    this.textarea.style.height = `${screenH}px`;
    this.textarea.style.fontSize = `${fontSize}px`;
    this.textarea.style.fontFamily = fontFamily;
    this.textarea.style.fontWeight = fontWeight;
    this.textarea.style.textAlign = align;
    this.textarea.style.color = color;

    this.textarea.value = this.initialText;
    this.textarea.focus();
    this.textarea.select();
  }

  close(commit = true) {
    if (this.textarea.style.display === 'none') return;
    const newText = this.textarea.value;
    const objId = this.targetObject?.id;
    this.textarea.style.display = 'none';

    if (commit && objId && newText !== this.initialText) {
      this.onCommit(objId, newText);
    }
    this.targetObject = null;
  }

  onBlur() {
    this.close(true);
  }

  onKeyDown(e) {
    if (e.key === 'Escape') {
      e.stopPropagation();
      this.close(false);
    } else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey || this.targetObject?.type !== 'text')) {

      e.preventDefault();
      this.close(true);
    }
  }
}

class TopBar {
  constructor(containerElement, callbacks) {
    this.container = containerElement;
    this.callbacks = callbacks;

    this.barEl = document.createElement('header');
    this.barEl.className = 'sabura-topbar';
    this.container.appendChild(this.barEl);

    this.render();
  }

  update(doc, status = 'Saved', interfaceTheme = 'system', snapGrid = true, showGrid = true) {
    this.doc = doc;
    this.status = status;
    this.interfaceTheme = interfaceTheme;
    this.snapGrid = snapGrid;
    this.showGrid = showGrid;
    this.render();
  }

  render() {
    const docThemeId = this.doc?.theme?.id || 'paper';
    const ifaceTheme = this.interfaceTheme || 'system';
    const status = this.status || 'Clean';
    const snapGrid = Boolean(this.snapGrid);
    const showGrid = this.showGrid !== false;

    let statusColor = '#2f9e44';
    if (status === 'Changed') statusColor = '#f08c00';
    else if (status === 'Error') statusColor = '#e03131';
    else if (status.includes('copy') || status.includes('Copy')) statusColor = '#1971c2';

    this.barEl.innerHTML = `
      <div class="topbar-left">
        <div class="brand-title">
          <span class="brand-name">Sabura</span>
          <span class="doc-title" title="Board Title">${this.doc?.title || 'Untitled'}</span>
        </div>
        <div class="status-badge" title="Document State: ${status}">
          <span class="status-dot" style="background-color: ${statusColor};"></span>
          <span class="status-text">${status}</span>
        </div>
      </div>

      <div class="topbar-center">
        <!-- Board Theme -->
        <label class="control-label" title="Board Theme (persisted with document)">
          <span>Board:</span>
          <select id="select-board-theme" class="topbar-select">
            <option value="paper" ${docThemeId === 'paper' ? 'selected' : ''}>Paper</option>
            <option value="blueprint" ${docThemeId === 'blueprint' ? 'selected' : ''}>Blueprint</option>
            <option value="night" ${docThemeId === 'night' ? 'selected' : ''}>Night</option>
            <option value="high-contrast" ${docThemeId === 'high-contrast' ? 'selected' : ''}>High Contrast</option>
          </select>
        </label>

        <!-- Interface Appearance -->
        <label class="control-label" title="Interface Appearance (local preference, never dirties board)">
          <span>UI:</span>
          <select id="select-ui-theme" class="topbar-select">
            <option value="system" ${ifaceTheme === 'system' ? 'selected' : ''}>System</option>
            <option value="light" ${ifaceTheme === 'light' ? 'selected' : ''}>Light</option>
            <option value="dark" ${ifaceTheme === 'dark' ? 'selected' : ''}>Dark</option>
          </select>
        </label>

        <!-- Grid visibility and snapping (explicit controls) -->
        <div class="grid-controls-group">
          <button id="btn-grid-visible" class="topbar-btn ${showGrid ? 'active' : ''}" title="Toggle Grid Visibility (Currently ${showGrid ? 'On' : 'Off'})">
            Grid ${showGrid ? 'On' : 'Off'}
          </button>
          <button id="btn-grid-snap" class="topbar-btn ${snapGrid ? 'active' : ''}" title="Toggle Object & Grid Snapping (Currently ${snapGrid ? 'On' : 'Off'})">
            Snap ${snapGrid ? 'On' : 'Off'}
          </button>
        </div>
      </div>

      <div class="topbar-right">
        <!-- Undo / Redo -->
        <button id="btn-undo" class="topbar-btn" title="Undo (Cmd+Z)">↶</button>
        <button id="btn-redo" class="topbar-btn" title="Redo (Cmd+Shift+Z)">↷</button>

        <div class="topbar-divider"></div>

        <!-- Fullscreen Editing -->
        <button id="btn-fullscreen" class="topbar-btn" title="Toggle Full-Screen Editing (retraining controls)">
          ⛶ Fullscreen
        </button>

        <!-- Present -->
        <button id="btn-present" class="topbar-btn primary" title="Enter Presentation Mode (Laser pointer)">
          ▶ Present
        </button>

        <!-- Save Copy -->
        <button id="btn-save" class="topbar-btn save-btn" title="Download self-contained offline HTML copy">
          ↓ Save Copy
        </button>
      </div>
    `;

    this.barEl.querySelector('#select-board-theme')?.addEventListener('change', (e) => {
      this.callbacks.onSetBoardTheme(e.target.value);
    });

    this.barEl.querySelector('#select-ui-theme')?.addEventListener('change', (e) => {
      this.callbacks.onSetInterfaceTheme(e.target.value);
    });

    this.barEl.querySelector('#btn-grid-visible')?.addEventListener('click', () => {
      this.callbacks.onToggleGridVisible();
    });

    this.barEl.querySelector('#btn-grid-snap')?.addEventListener('click', () => {
      this.callbacks.onToggleGridSnap();
    });

    this.barEl.querySelector('#btn-undo')?.addEventListener('click', () => {
      this.callbacks.onUndo();
    });

    this.barEl.querySelector('#btn-redo')?.addEventListener('click', () => {
      this.callbacks.onRedo();
    });

    this.barEl.querySelector('#btn-fullscreen')?.addEventListener('click', () => {
      this.callbacks.onToggleFullscreen();
    });

    this.barEl.querySelector('#btn-present')?.addEventListener('click', () => {
      this.callbacks.onPresent();
    });

    this.barEl.querySelector('#btn-save')?.addEventListener('click', () => {
      this.callbacks.onSaveCopy();
    });
  }
}

// --- Module: src/ui/shortcuts.js ---
function getPlatform() {
  if (typeof navigator === 'undefined') return { isMac: false, modKey: 'Ctrl', modSymbol: 'Ctrl' };
  const isMac = (navigator.platform || '').toUpperCase().indexOf('MAC') >= 0 ||
                (navigator.userAgent || '').toUpperCase().indexOf('MAC') >= 0;
  return {
    isMac,
    modKey: isMac ? 'Cmd' : 'Ctrl',
    modSymbol: isMac ? '⌘' : 'Ctrl'
  };
}

class ShortcutsCoordinator {
  constructor(handlers) {
    this.handlers = handlers;
    this.isSpacePressed = false;
    this.lastPointerPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

    this.onKeyDown = this.onKeyDown.bind(this);
    this.onKeyUp = this.onKeyUp.bind(this);
    this.onPointerMove = this.onPointerMove.bind(this);

    window.addEventListener('keydown', this.onKeyDown);
    window.addEventListener('keyup', this.onKeyUp);
    window.addEventListener('pointermove', this.onPointerMove);
  }

  destroy() {
    window.removeEventListener('keydown', this.onKeyDown);
    window.removeEventListener('keyup', this.onKeyUp);
    window.removeEventListener('pointermove', this.onPointerMove);
  }

  onPointerMove(e) {
    this.lastPointerPos = { x: e.clientX, y: e.clientY };
  }

  onKeyDown(e) {

    const activeEl = document.activeElement;
    const isTyping = ['INPUT', 'TEXTAREA'].includes(activeEl?.tagName) ||
      Boolean(activeEl?.isContentEditable) ||
      Boolean(this.handlers.isTextEditing?.());

    if (isTyping) {

      if (e.key === 'Escape') {
        this.handlers.onEscape?.();
      }
      return;
    }

    const { isMac } = getPlatform();
    const mod = isMac ? e.metaKey : e.ctrlKey;

    if (e.key === ' ' && !this.isSpacePressed && !mod) {
      this.isSpacePressed = true;
      this.handlers.onSpaceHold?.(true);
      return;
    }

    if (e.key.toLowerCase() === 'q' && !mod && !e.altKey) {
      e.preventDefault();

class ZoomToolbar {
  constructor(parentEl, handlers) {
    this.parentEl = parentEl;
    this.handlers = handlers || {};
    this.zoom = 1.0;

    this.toolbarEl = document.createElement('div');
    this.toolbarEl.className = 'zoom-help-toolbar';
    this.toolbarEl.id = 'zoom-help-toolbar';
    this.parentEl.appendChild(this.toolbarEl);

    this.render();
  }

  setZoom(zoom) {
    if (typeof zoom === 'number' && !isNaN(zoom)) {
      this.zoom = zoom;
      const pctEl = this.toolbarEl.querySelector('#btn-zoom-reset');
      if (pctEl) {
        pctEl.textContent = `${Math.round(this.zoom * 100)}%`;
      }
    }
  }

  render() {
    const pct = `${Math.round(this.zoom * 100)}%`;
    this.toolbarEl.innerHTML = `
      <button class="zoom-btn" id="btn-zoom-out" title="Zoom Out (-)" aria-label="Zoom Out">−</button>

      e.stopPropagation();
      this.handlers.onZoomOut?.();
    });

      e.stopPropagation();
      this.handlers.onResetZoom?.();

      this.handlers.onZoomIn?.();
    });

    this.toolbarEl.querySelector('#btn-zoom-fit').addEventListener('click', (e) => {

class Workspace {
  constructor(svgContainer, callbacks) {
    this.container = svgContainer;
    this.callbacks = callbacks;

    this.camera = { x: 0, y: 0, zoom: 1.0 };
    this.activeTool = 'hand';
    this.previousTool = 'select';
    this.connectorRouting = 'straight';
    this.selectedIds = [];
    this.activeGroupId = null;
    this.snapGrid = true;
    this.showGrid = true;
    this.gridSize = 20;

    this.isPanning = false;
    this.isDraggingSelection = false;
    this.isDHeld = false;
    this.isDDragging = false;
    this.isResizing = false;
    this.isCreating = false;
    this.isReconnecting = false;
    this.reconnectSnapIndicator = null;
    this.isCurvingConnector = false;
    this.curvingConnectorData = null;
    this.isMarquee = false;
    this.spaceHeld = false;

    this.dragStart = { x: 0, y: 0 };
    this.pointerStartScreen = { x: 0, y: 0 };
    this.activeHandle = null;
    this.resizeOriginalBounds = null;
    this.snapGuides = [];
    this.marquee = null;
    this.draftObject = null;
    this.reconnectingData = null;

    this.longPressTimer = null;

    this.bindEvents();
  }

  setTool(tool) {
    if (this.isDrawingLine && tool !== 'line') {
      this.cancelLine();
    }
    this.activeTool = tool;
    this.updateCursor();
    this.render();
  }

  setConnectorRouting(routing) {
    this.connectorRouting = routing || 'straight';
  }

  setSnapGrid(enabled) {
    this.snapGrid = enabled;
  }

  updateCursor() {
    if (this.spaceHeld || this.activeTool === 'hand') {
      this.container.style.cursor = this.isPanning ? 'grabbing' : 'grab';
    } else if (this.activeTool === 'select') {
      this.container.style.cursor = 'default';
    } else if (['rectangle', 'ellipse', 'diamond', 'triangle', 'text', 'connector', 'line'].includes(this.activeTool)) {
      this.container.style.cursor = 'crosshair';
    } else {
      this.container.style.cursor = 'default';
    }
  }

  screenToWorld(screenX, screenY) {
    return {
      x: (screenX - this.camera.x) / this.camera.zoom,
      y: (screenY - this.camera.y) / this.camera.zoom
    };
  }

  worldToScreen(worldX, worldY) {
    return {
      x: worldX * this.camera.zoom + this.camera.x,
      y: worldY * this.camera.zoom + this.camera.y
    };
  }

  zoomAt(screenX, screenY, deltaFactor) {
    const minZoom = 0.1;
    const maxZoom = 5.0;
    const oldZoom = this.camera.zoom;
    const newZoom = Math.max(minZoom, Math.min(maxZoom, oldZoom * deltaFactor));

    this.camera.x = screenX - (screenX - this.camera.x) * (newZoom / oldZoom);
    this.camera.y = screenY - (screenY - this.camera.y) * (newZoom / oldZoom);
    this.camera.zoom = newZoom;

    this.render();
  }

  zoomIn() {
    const center = this.getViewportCenter();
    this.zoomAt(center.x, center.y, 1.2);
  }

  zoomOut() {
    const center = this.getViewportCenter();
    this.zoomAt(center.x, center.y, 1 / 1.2);
  }

  resetZoom() {
    if (this.camera.zoom === 1.0) return;
    const center = this.getViewportCenter();
    this.zoomAt(center.x, center.y, 1.0 / this.camera.zoom);
  }

  getViewportCenter() {
    const rect = this.container.getBoundingClientRect();
    return {
      x: rect.left + rect.width / 2,
      y: rect.top + rect.height / 2
    };
  }

  fitToContent(padding = 60) {
    const doc = this.callbacks.getDocument();
    const allObjects = Object.values(doc.objects || {});
    if (allObjects.length === 0) {
      this.camera = { x: 0, y: 0, zoom: 1.0 };
      this.render();
      return;
    }

    const union = getUnionBoundingBox(allObjects);
    if (!union) return;

    const w = window.innerWidth;
    const h = window.innerHeight;
    const scaleX = (w - padding * 2) / union.width;
    const scaleY = (h - padding * 2) / union.height;
    const targetZoom = Math.max(0.2, Math.min(2.0, Math.min(scaleX, scaleY)));

    this.camera.zoom = targetZoom;
    this.camera.x = (w - union.width * targetZoom) / 2 - union.x * targetZoom;
    this.camera.y = (h - union.height * targetZoom) / 2 - union.y * targetZoom;
    this.render();
  }

  bindEvents() {
    this.onPointerDown = this.onPointerDown.bind(this);
    this.onPointerMove = this.onPointerMove.bind(this);
    this.onPointerUp = this.onPointerUp.bind(this);
    this.onWheel = this.onWheel.bind(this);
    this.onContextMenu = this.onContextMenu.bind(this);
    this.onDblClick = this.onDblClick.bind(this);

    this.onPointerCancel = this.onPointerCancel.bind(this);

    this.container.addEventListener('pointerdown', this.onPointerDown);
    window.addEventListener('pointermove', this.onPointerMove);
    window.addEventListener('pointerup', this.onPointerUp);
    window.addEventListener('pointercancel', this.onPointerCancel);
    this.container.addEventListener('wheel', this.onWheel, { passive: false });
    this.container.addEventListener('contextmenu', this.onContextMenu);
    this.container.addEventListener('dblclick', this.onDblClick);
  }

  destroy() {
    this.container.removeEventListener('pointerdown', this.onPointerDown);
    window.removeEventListener('pointermove', this.onPointerMove);
    window.removeEventListener('pointerup', this.onPointerUp);
    window.removeEventListener('pointercancel', this.onPointerCancel);
    this.container.removeEventListener('wheel', this.onWheel);
    this.container.removeEventListener('contextmenu', this.onContextMenu);
    this.container.removeEventListener('dblclick', this.onDblClick);
  }

  onPointerCancel(e) {
    this.cancelGesture();
  }

  cancelGesture() {
    if (this.longPressTimer) {
      clearTimeout(this.longPressTimer);
      this.longPressTimer = null;
    }

    const doc = this.callbacks.getDocument();

    if (this.isDraggingSelection && this.dragInitialPositions) {
      for (const [id, pos] of Object.entries(this.dragInitialPositions)) {
        const obj = doc.objects[id];
        if (obj) {
          obj.x = pos.x;
          obj.y = pos.y;
          if (obj.type === 'connector') {
            if (pos.fromPoint && obj.from) obj.from.point = { ...pos.fromPoint };
            if (pos.toPoint && obj.to) obj.to.point = { ...pos.toPoint };
          }
        }
      }
    }

    if (this.isResizing && this.resizeOriginalBounds && this.selectedIds.length > 0) {
      const obj = doc.objects[this.selectedIds[0]];
      if (obj) {
        obj.x = this.resizeOriginalBounds.x;
        obj.y = this.resizeOriginalBounds.y;
        obj.width = this.resizeOriginalBounds.width;
        obj.height = this.resizeOriginalBounds.height;
      }
    }

    if (this.isReconnecting && this.reconnectingData && this.reconnectOriginalTarget) {
      const conn = doc.objects[this.reconnectingData.connectorId];
      if (conn) {
        conn[this.reconnectingData.endpoint] = JSON.parse(JSON.stringify(this.reconnectOriginalTarget));
      }
    }

    if (this.isCurvingConnector && this.curvingConnectorData) {
      const conn = doc.objects[this.curvingConnectorData.connectorId];
      if (conn) {
        if (this.curvingConnectorData.type === 'curve') {
          conn.curveSide = this.curvingConnectorData.initialSide;
          if (this.curvingConnectorData.initialDistance === null) delete conn.curveDistance;
          else conn.curveDistance = this.curvingConnectorData.initialDistance;
        } else if (this.curvingConnectorData.type === 'elbow') {
          if (this.curvingConnectorData.initialOffset === null) delete conn.elbowOffset;
          else conn.elbowOffset = this.curvingConnectorData.initialOffset;
        }
      }
    }

    if (this.isDrawingLine) {
      this.cancelLine();
    }

    if (this.isDraggingVertex && this.draggingVertexData) {
      const doc = this.callbacks.getDocument();
      const obj = doc.objects[this.draggingVertexData.objId];
      if (obj) {
        obj.points = cloneDocument(this.draggingVertexData.initialPoints);
      }
      this.isDraggingVertex = false;
      this.draggingVertexData = null;
    }

    this.isPanning = false;
    this.isDraggingSelection = false;
    this.isResizing = false;
    this.isCreating = false;
    this.isReconnecting = false;
    this.isCurvingConnector = false;
    this.curvingConnectorData = null;
    this.isMarquee = false;
    this.activeHandle = null;
    this.resizeOriginalBounds = null;
    this.latestResizeBounds = null;
    this.reconnectOriginalTarget = null;
    this.latestReconnectTarget = null;
    this.dragInitialPositions = null;
    this.dragAccumulatedDelta = null;
    this.snapGuides = [];
    this.marquee = null;
    this.draftObject = null;
    this.setTool('select');
    this.updateCursor();
    this.render();
  }

  finishLine(closed = false) {
    if (!this.isDrawingLine || !this.linePoints || this.linePoints.length < 2) {
      this.cancelLine();
      return;
    }

    const rawPts = [...this.linePoints];
    if (closed && rawPts.length > 2) {
      const p0 = rawPts[0];
      const pLast = rawPts[rawPts.length - 1];
      if (Math.hypot(pLast.x - p0.x, pLast.y - p0.y) < 16) {
        rawPts.pop();
      }
    }

    if (rawPts.length < 2) {
      this.cancelLine();
      return;
    }

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of rawPts) {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    }

    const width = Math.max(16, maxX - minX);
    const height = Math.max(16, maxY - minY);
    const points = rawPts.map(p => [Math.round(p.x - minX), Math.round(p.y - minY)]);

    const doc = this.callbacks.getDocument();
    const newObj = createDefaultObject('path', {
      x: minX,
      y: minY,
      width,
      height,
      points,
      closed,
      curveStyle: 'sharp'
    }, doc.theme);

    this.isDrawingLine = false;
    this.linePoints = null;
    this.lineRubberband = null;
    this.lineCloseSnapped = false;

    this.callbacks.onCommand({
      type: 'create_object',
      object: newObj
    });

    this.selectedIds = [newObj.id];
    this.setTool('select');
    this.render();
  }

  cancelLine() {
    this.isDrawingLine = false;
    this.linePoints = null;
    this.lineRubberband = null;
    this.lineCloseSnapped = false;
    this.render();
  }

  findObjectAt(worldPoint) {
    const doc = this.callbacks.getDocument();

    for (let i = doc.order.length - 1; i >= 0; i--) {
      const objId = doc.order[i];
      const obj = doc.objects[objId];
      if (!obj) continue;

      if (obj.type === 'connector') {

        const dist = distanceToConnector(worldPoint, obj, doc);
        const hitThreshold = Math.max(12, 14 / this.camera.zoom);
        if (dist <= hitThreshold) {
          return obj;
        }
      } else if (obj.type === 'path' && !obj.closed) {

        const dist = distanceToPath(worldPoint, obj);
        const hitThreshold = Math.max(12, 14 / this.camera.zoom);
        if (dist <= hitThreshold) {
          return obj;
        }
      } else {
        const box = getBoundingBox(obj);
        if (worldPoint.x >= box.x && worldPoint.x <= box.right &&
            worldPoint.y >= box.y && worldPoint.y <= box.bottom) {
          return obj;
        }
      }
    }
    return null;
  }

  onContextMenu(e) {
    e.preventDefault();
    const worldPt = this.screenToWorld(e.clientX, e.clientY);
    const hitObj = this.findObjectAt(worldPt);

    if (hitObj) {
      if (!this.selectedIds.includes(hitObj.id)) {
        if (hitObj.groupId && this.activeGroupId !== hitObj.groupId) {
          const doc = this.callbacks.getDocument();
          this.selectedIds = Object.values(doc.objects)
            .filter(o => o.groupId === hitObj.groupId && !o.locked)
            .map(o => o.id);
        } else {
          this.selectedIds = [hitObj.id];
        }
      }
      this.callbacks.onOpenWheel(e.clientX, e.clientY, 'object', hitObj);
    } else {
      this.callbacks.onOpenWheel(e.clientX, e.clientY, 'canvas', null);
    }
  }

  onDblClick(e) {
    if (this.isDrawingLine && this.linePoints && this.linePoints.length >= 2) {
      this.finishLine(false);
      return;
    }
    const worldPt = this.screenToWorld(e.clientX, e.clientY);
    const hitObj = this.findObjectAt(worldPt);
    if (hitObj) {
      if (hitObj.groupId) {
        this.activeGroupId = hitObj.groupId;
        this.selectedIds = [hitObj.id];
        this.render();
      }
      this.callbacks.onDoubleClickedObject(hitObj);
    }
  }

  onPointerDown(e) {
    if (e.button !== 0 && e.button !== 1) return;

    const worldPt = this.screenToWorld(e.clientX, e.clientY);
    this.pointerStartScreen = { x: e.clientX, y: e.clientY };

    const handleEl = e.button === 0 ? e.target?.closest?.('[data-handle]') : null;
    if (handleEl) {
      clearTimeout(this.longPressTimer);
      const handleId = handleEl.getAttribute('data-handle');
      if (handleId === 'conn-curve') {
        this.isCurvingConnector = true;
        const doc = this.callbacks.getDocument();
        const conn = doc.objects[this.selectedIds[0]];
        this.curvingConnectorData = {
          type: 'curve',
          connectorId: this.selectedIds[0],
          initialSide: conn?.curveSide !== undefined ? conn.curveSide : 1,
          currentSide: conn?.curveSide !== undefined ? conn.curveSide : 1,
          initialDistance: conn?.curveDistance !== undefined ? conn.curveDistance : null,
          currentDistance: conn?.curveDistance !== undefined ? conn.curveDistance : null,
          startPt: { ...worldPt }
        };
        return;
      } else if (handleId === 'conn-elbow') {
        this.isCurvingConnector = true;
        const doc = this.callbacks.getDocument();
        const conn = doc.objects[this.selectedIds[0]];
        this.curvingConnectorData = {
          type: 'elbow',
          connectorId: this.selectedIds[0],
          initialOffset: conn?.elbowOffset !== undefined ? conn.elbowOffset : null,
          currentOffset: conn?.elbowOffset !== undefined ? conn.elbowOffset : null,
          startPt: { ...worldPt }
        };
        return;
      } else if (handleId.startsWith('conn-')) {
        this.isReconnecting = true;
        this.reconnectingData = {
          connectorId: this.selectedIds[0],
          endpoint: handleId === 'conn-from' ? 'from' : 'to'
        };
        const doc = this.callbacks.getDocument();
        const conn = doc.objects[this.selectedIds[0]];
        this.reconnectOriginalTarget = conn ? JSON.parse(JSON.stringify(conn[this.reconnectingData.endpoint])) : null;
        this.latestReconnectTarget = null;
        this.reconnectSnapIndicator = null;
      } else if (handleId.startsWith('vertex-')) {
        const vertexIndex = parseInt(handleId.replace('vertex-', ''), 10);
        const doc = this.callbacks.getDocument();
        const obj = doc.objects[this.selectedIds[0]];
        if (obj && obj.type === 'path' && Array.isArray(obj.points) && !obj.locked) {
          this.isDraggingVertex = true;
          this.draggingVertexData = {
            objId: obj.id,
            vertexIndex,
            initialPoints: cloneDocument(obj.points),
            startPt: { ...worldPt }
          };
          return;
        }
      } else {
        this.isResizing = true;
        this.activeHandle = handleId;
        const doc = this.callbacks.getDocument();
        const obj = doc.objects[this.selectedIds[0]];
        this.resizeOriginalBounds = {
          x: obj.x,
          y: obj.y,
          width: obj.width,
          height: obj.height,
          resolvedSize: obj.textStyle?.resolvedSize || 20
        };
        this.latestResizeBounds = null;
        this.dragStart = { ...worldPt };
      }
      return;
    }

    if (e.button === 1 || this.spaceHeld || this.activeTool === 'hand') {
      this.isPanning = true;
      this.panMoved = false;
      this.dragStart = { x: e.clientX - this.camera.x, y: e.clientY - this.camera.y };
      this.updateCursor();
      return;
    }

    this.longPressTimer = setTimeout(() => {
      this.longPressTimer = null;
      const hit = this.findObjectAt(worldPt);
      this.callbacks.onOpenWheel(e.clientX, e.clientY, hit ? 'object' : 'canvas', hit);
    }, 500);

    const hitObj = this.findObjectAt(worldPt);

    if (this.activeTool === 'select') {
      if (hitObj) {
        clearTimeout(this.longPressTimer);
        let targetId = hitObj.id;
        const doc = this.callbacks.getDocument();

        if (hitObj.locked) {
          if (!e.shiftKey) {
            this.selectedIds = [targetId];
            this.activeGroupId = null;
          }
          this.render();
          return;
        }

        if (hitObj.groupId) {
          const groupMembers = Object.values(doc.objects)
            .filter(o => o.groupId === hitObj.groupId && !o.locked)
            .map(o => o.id);

          if (e.shiftKey) {
            const allIn = groupMembers.every(id => this.selectedIds.includes(id));
            if (allIn) {
              this.selectedIds = this.selectedIds.filter(id => !groupMembers.includes(id));
            } else {
              this.selectedIds = Array.from(new Set([...this.selectedIds, ...groupMembers]));
            }
          } else if (this.activeGroupId === hitObj.groupId) {

            this.selectedIds = [targetId];
          } else if (this.selectedIds.includes(targetId)) {

            this.activeGroupId = null;
            const allIn = groupMembers.every(id => this.selectedIds.includes(id));
            if (!allIn) {
              this.selectedIds = Array.from(new Set([...this.selectedIds, ...groupMembers]));
            }
          } else {

            this.activeGroupId = null;
            this.selectedIds = groupMembers;
          }
        } else {
          if (e.shiftKey) {
            if (this.selectedIds.includes(targetId)) {
              this.selectedIds = this.selectedIds.filter(id => id !== targetId);
            } else {
              this.selectedIds.push(targetId);
            }
          } else if (!this.selectedIds.includes(targetId)) {
            this.activeGroupId = null;
            this.selectedIds = [targetId];
          }
        }

        this.isDraggingSelection = true;
        this.isDDragging = Boolean(this.isDHeld);
        this.dragStart = { ...worldPt };
        this.dragInitialPositions = {};
        this.dragAccumulatedDelta = { dx: 0, dy: 0 };
        for (const id of this.selectedIds) {
          const o = doc.objects[id];
          if (o) {
            this.dragInitialPositions[id] = {
              x: o.x,
              y: o.y,
              fromPoint: o.type === 'connector' && o.from?.point ? { ...o.from.point } : null,
              toPoint: o.type === 'connector' && o.to?.point ? { ...o.to.point } : null
            };
          }
        }
        this.render();
      } else {

        if (!e.shiftKey) {
          this.selectedIds = [];
          this.activeGroupId = null;
        }
        this.isMarquee = true;
        this.marquee = { startX: worldPt.x, startY: worldPt.y, currentX: worldPt.x, currentY: worldPt.y };
        this.render();
      }
      return;
    }

    if (this.activeTool === 'line') {
      clearTimeout(this.longPressTimer);
      if (!this.isDrawingLine) {
        this.isDrawingLine = true;
        this.linePoints = [{ x: worldPt.x, y: worldPt.y }];
        this.lineRubberband = { x: worldPt.x, y: worldPt.y };
        this.lineCloseSnapped = false;
        this.render();
      } else {
        const p0 = this.linePoints[0];
        const distToStart = Math.hypot(worldPt.x - p0.x, worldPt.y - p0.y);
        const snapDist = Math.max(14, 16 / this.camera.zoom);
        if (this.linePoints.length >= 3 && (this.lineCloseSnapped || distToStart <= snapDist)) {
          this.finishLine(true);
        } else {
          const lastPt = this.linePoints[this.linePoints.length - 1];
          if (Math.hypot(worldPt.x - lastPt.x, worldPt.y - lastPt.y) > 3) {
            this.linePoints.push({ x: worldPt.x, y: worldPt.y });
            this.lineRubberband = { x: worldPt.x, y: worldPt.y };
            this.render();
          }
        }
      }
      return;
    }

    if (['rectangle', 'ellipse', 'diamond', 'triangle', 'text', 'connector'].includes(this.activeTool)) {
      clearTimeout(this.longPressTimer);
      this.isCreating = true;
      this.dragStart = { ...worldPt };

      const doc = this.callbacks.getDocument();
      const type = this.activeTool;

      this.draftObject = createDefaultObject(type, {
        x: worldPt.x,
        y: worldPt.y,
        width: 1,
        height: 1,
        routing: type === 'connector' ? (this.connectorRouting || 'straight') : undefined
      }, doc.theme);

      if (type === 'connector') {
        const startHit = this.findObjectAt(worldPt);
        this.draftObject.from = startHit ? { id: startHit.id } : { point: { ...worldPt } };
        this.draftObject.to = { point: { ...worldPt } };
      }
    }
  }

  onPointerMove(e) {

    if (this.longPressTimer) {
      const dist = Math.hypot(e.clientX - this.pointerStartScreen.x, e.clientY - this.pointerStartScreen.y);
      if (dist > 6) {
        clearTimeout(this.longPressTimer);
        this.longPressTimer = null;
      }
    }

    if (this.isPanning) {
      if (this.pointerStartScreen && Math.hypot(e.clientX - this.pointerStartScreen.x, e.clientY - this.pointerStartScreen.y) > 3) {
        this.panMoved = true;
      }
      this.camera.x = e.clientX - this.dragStart.x;
      this.camera.y = e.clientY - this.dragStart.y;
      this.render();
      return;
    }

    const worldPt = this.screenToWorld(e.clientX, e.clientY);

    if (this.isMarquee) {
      this.marquee.currentX = worldPt.x;
      this.marquee.currentY = worldPt.y;

      const mx = Math.min(this.marquee.startX, this.marquee.currentX);
      const my = Math.min(this.marquee.startY, this.marquee.currentY);
      const mr = Math.max(this.marquee.startX, this.marquee.currentX);
      const mb = Math.max(this.marquee.startY, this.marquee.currentY);

      const doc = this.callbacks.getDocument();
      const hits = [];
      const includedGroups = new Set();

      for (const obj of Object.values(doc.objects)) {
        if (obj.locked) continue;
        const b = getBoundingBox(obj, doc);
        if (!b) continue;
        if (b.x < mr && b.right > mx && b.y < mb && b.bottom > my) {
          hits.push(obj.id);
          if (obj.groupId) includedGroups.add(obj.groupId);
        }
      }

      if (includedGroups.size > 0) {
        for (const obj of Object.values(doc.objects)) {
          if (!obj.locked && obj.groupId && includedGroups.has(obj.groupId)) {
            if (!hits.includes(obj.id)) {
              hits.push(obj.id);
            }
          }
        }
      }

      this.selectedIds = hits;
      this.render();
      return;
    }

    if (this.isDraggingSelection && this.selectedIds.length > 0 && this.dragInitialPositions) {
      const doc = this.callbacks.getDocument();

      if (this.isDHeld && !this.isDDragging) {
        this.isDDragging = true;

        for (const [id, pos] of Object.entries(this.dragInitialPositions)) {
          const orig = doc.objects[id];
          if (orig) {
            orig.x = pos.x;
            orig.y = pos.y;
            if (orig.type === 'connector') {
              if (pos.fromPoint && orig.from) orig.from.point = { ...pos.fromPoint };
              if (pos.toPoint && orig.to) orig.to.point = { ...pos.toPoint };
            }
          }
        }
      }

      const selectedObjects = this.selectedIds.map(id => doc.objects[id]).filter(Boolean);
      const union = getUnionBoundingBox(selectedObjects, doc);
      if (!union) return;

      let dx = worldPt.x - this.dragStart.x;
      let dy = worldPt.y - this.dragStart.y;

      if (!e.altKey && !e.metaKey) {
        const otherObjects = Object.values(doc.objects).filter(o => !this.selectedIds.includes(o.id));
        const testBox = {
          x: union.x + dx,
          y: union.y + dy,
          width: union.width,
          height: union.height
        };
        const snap = calculateSnapping(testBox, otherObjects, {
          tolerance: 8 / this.camera.zoom,
          snapGrid: this.snapGrid,
          gridSize: this.gridSize,
          doc
        });

        dx += (snap.x - testBox.x);
        dy += (snap.y - testBox.y);
        this.snapGuides = snap.guides;
      } else {
        this.snapGuides = [];
      }

      this.dragAccumulatedDelta = { dx, dy };

      if (this.isDDragging) {

        this.render();
        return;
      }

      for (const id of this.selectedIds) {
        const obj = doc.objects[id];
        const initial = this.dragInitialPositions[id];
        if (obj && initial) {
          if (obj.x !== undefined && initial.x !== undefined) {
            obj.x = initial.x + dx;
            obj.y = initial.y + dy;
          }
          if (obj.type === 'connector') {
            if (initial.fromPoint && obj.from) obj.from.point = { x: initial.fromPoint.x + dx, y: initial.fromPoint.y + dy };
            if (initial.toPoint && obj.to) obj.to.point = { x: initial.toPoint.x + dx, y: initial.toPoint.y + dy };
          }
        }
      }
      this.render();
      return;
    }

    if (this.isResizing && this.selectedIds.length === 1 && this.resizeOriginalBounds) {
      const dx = worldPt.x - this.dragStart.x;
      const dy = worldPt.y - this.dragStart.y;
      const keepAspect = e.shiftKey;
      const fromCenter = e.altKey;

      const newBounds = calculateResize(this.activeHandle, this.resizeOriginalBounds, dx, dy, {
        keepAspect,
        fromCenter
      });

      const doc = this.callbacks.getDocument();
      const obj = doc.objects[this.selectedIds[0]];
      if (obj) {
        obj.x = newBounds.x;
        obj.y = newBounds.y;
        obj.width = newBounds.width;
        obj.height = newBounds.height;
        if (obj.textStyle && this.resizeOriginalBounds.width > 0 && this.resizeOriginalBounds.height > 0) {
          const scale = (newBounds.width / this.resizeOriginalBounds.width + newBounds.height / this.resizeOriginalBounds.height) / 2;
          obj.textStyle.resolvedSize = Math.max(10, Math.min(120, Math.round((this.resizeOriginalBounds.resolvedSize || 20) * scale)));
        }
        this.latestResizeBounds = newBounds;
        this.render();
      }
      return;
    }

    if (this.isCurvingConnector && this.curvingConnectorData) {
      const doc = this.callbacks.getDocument();
      const conn = doc.objects[this.curvingConnectorData.connectorId];
      if (conn && conn.routing === 'curved') {
        const geom = resolveConnectorGeometry(doc, conn);
        const dx = geom.end.x - geom.start.x;
        const dy = geom.end.y - geom.start.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0) {
          const normal = { x: -dy / dist, y: dx / dist };
          const midX = (geom.start.x + geom.end.x) / 2;
          const midY = (geom.start.y + geom.end.y) / 2;
          const dot = (worldPt.x - midX) * normal.x + (worldPt.y - midY) * normal.y;
          const newSide = dot >= 0 ? 1 : -1;
          const chordDist = Math.abs(dot);
          const newDistance = Math.round(Math.max(10, chordDist * 2));
          conn.curveSide = newSide;
          conn.curveDistance = newDistance;
          this.curvingConnectorData.currentSide = newSide;
          this.curvingConnectorData.currentDistance = newDistance;
          this.render();
        }
      } else if (conn && conn.routing === 'elbow') {
        const geom = resolveConnectorGeometry(doc, conn);
        const dx = geom.end.x - geom.start.x;
        const dy = geom.end.y - geom.start.y;
        let newOffset;
        if (Math.abs(dx) >= Math.abs(dy)) {
          const midY = (geom.start.y + geom.end.y) / 2;
          const baseY = worldPt.y >= midY ? Math.max(geom.start.y, geom.end.y) : Math.min(geom.start.y, geom.end.y);
          newOffset = Math.round(worldPt.y - baseY);
          if (Math.abs(newOffset) < 15) newOffset = newOffset >= 0 ? 20 : -20;
        } else {
          const midX = (geom.start.x + geom.end.x) / 2;
          const baseX = worldPt.x >= midX ? Math.max(geom.start.x, geom.end.x) : Math.min(geom.start.x, geom.end.x);
          newOffset = Math.round(worldPt.x - baseX);
          if (Math.abs(newOffset) < 15) newOffset = newOffset >= 0 ? 20 : -20;
        }
        conn.elbowOffset = newOffset;
        this.curvingConnectorData.currentOffset = newOffset;
        this.render();
      }
      return;
    }

    if (this.isReconnecting && this.reconnectingData) {
      const doc = this.callbacks.getDocument();
      const connId = this.reconnectingData.connectorId;
      const conn = doc.objects[connId];
      const attachedId = this.reconnectOriginalTarget?.id;
      const attachedObj = attachedId ? doc.objects[attachedId] : null;

      let targetObj = null;
      const hit = this.findObjectAt(worldPt);

      if (hit && hit.id !== connId && hit.type !== 'connector') {
        targetObj = hit;
      } else if (attachedObj) {

        const b = getBoundingBox(attachedObj);
        const buf = 24 / this.camera.zoom;
        if (worldPt.x >= b.x - buf && worldPt.x <= b.right + buf &&
            worldPt.y >= b.y - buf && worldPt.y <= b.bottom + buf) {
          targetObj = attachedObj;
        }
      }

      if (!targetObj) {
        const buf = 14 / this.camera.zoom;
        for (const o of Object.values(doc.objects)) {
          if (o.id !== connId && o.type !== 'connector') {
            const b = getBoundingBox(o);
            if (worldPt.x >= b.x - buf && worldPt.x <= b.right + buf &&
                worldPt.y >= b.y - buf && worldPt.y <= b.bottom + buf) {
              targetObj = o;
              break;
            }
          }
        }
      }

      let target;
      if (targetObj) {
        const closest = getClosestBoundaryPoint(targetObj, worldPt, 14 / this.camera.zoom);
        target = {
          id: targetObj.id,
          anchor: closest.anchor
        };
        this.reconnectSnapIndicator = closest.snapped ? {
          point: closest.point,
          snapName: closest.snapName,
          objectId: targetObj.id
        } : null;
      } else {
        target = { point: { x: worldPt.x, y: worldPt.y } };
        this.reconnectSnapIndicator = null;
      }

      if (conn) {
        conn[this.reconnectingData.endpoint] = target;
        this.latestReconnectTarget = target;
        this.render();
      }
      return;
    }

    if (this.isDraggingVertex && this.draggingVertexData) {
      const doc = this.callbacks.getDocument();
      const obj = doc.objects[this.draggingVertexData.objId];
      if (obj && obj.type === 'path' && Array.isArray(obj.points)) {
        const idx = this.draggingVertexData.vertexIndex;
        const relX = worldPt.x - obj.x;
        const relY = worldPt.y - obj.y;
        obj.points[idx] = [Math.round(relX), Math.round(relY)];
        this.render();
      }
      return;
    }

    if (this.isDrawingLine && this.linePoints && this.linePoints.length > 0) {
      const p0 = this.linePoints[0];

      console.error('Fatal document error: empty #sabura-document seam');
