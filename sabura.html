<!DOCTYPE html>
<html lang="en" data-ui-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sabura - AI-First Offline Whiteboard</title>
  <style>
/**
 * Sabura Complete Styling: Modern Glassmorphism, Responsive Workspace, Radial Wheel, and Presentation.
 */

:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "SF Mono", Menlo, Monaco, Consolas, monospace;
  --font-hand: "Caveat", "Comic Sans MS", "Chalkboard SE", "Segoe Print", cursive, sans-serif;

  /* UI Chrome Theme - Concepts / Excalidraw Warm Default */
  --ui-bg: rgba(252, 250, 246, 0.92);
  --ui-bg-solid: #fcfaf6;
  --ui-text: #212529;
  --ui-text-muted: #6c757d;
  --ui-border: rgba(0, 0, 0, 0.22);
  --ui-hover: rgba(0, 0, 0, 0.05);
  --ui-active: rgba(0, 0, 0, 0.1);
  --ui-accent: #1971c2;
  --ui-accent-hover: #1864ab;
  --ui-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
  --ui-wheel-bg: #fffefc;
  --ui-wheel-hover: #fff3bf;
  --ui-wheel-active: #d0ebff;
  --ui-wheel-danger: #ffe3e3;
  --ui-wheel-text: #1e1e1e;
  --ui-wheel-stroke: #1e1e1e;
}

[data-ui-theme="dark"] {
  --ui-bg: rgba(26, 27, 38, 0.92);
  --ui-bg-solid: #1a1b26;
  --ui-text: #c0caf5;
  --ui-text-muted: #7982a9;
  --ui-border: rgba(255, 255, 255, 0.18);
  --ui-hover: rgba(255, 255, 255, 0.08);
  --ui-active: rgba(255, 255, 255, 0.15);
  --ui-accent: #7aa2f7;
  --ui-accent-hover: #89b4fa;
  --ui-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  --ui-wheel-bg: #1e202e;
  --ui-wheel-hover: #2e344e;
  --ui-wheel-active: #3b4261;
  --ui-wheel-danger: #442b36;
  --ui-wheel-text: #c0caf5;
  --ui-wheel-stroke: #c0caf5;
}

@media (prefers-color-scheme: dark) {
  [data-ui-theme="system"] {
    --ui-bg: rgba(26, 27, 38, 0.92);
    --ui-bg-solid: #1a1b26;
    --ui-text: #c0caf5;
    --ui-text-muted: #7982a9;
    --ui-border: rgba(255, 255, 255, 0.18);
    --ui-hover: rgba(255, 255, 255, 0.08);
    --ui-active: rgba(255, 255, 255, 0.15);
    --ui-accent: #7aa2f7;
    --ui-accent-hover: #89b4fa;
    --ui-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    --ui-wheel-bg: #1e202e;
    --ui-wheel-hover: #2e344e;
    --ui-wheel-active: #3b4261;
    --ui-wheel-danger: #442b36;
    --ui-wheel-text: #c0caf5;
    --ui-wheel-stroke: #c0caf5;
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: var(--font-sans);
  background: #fdfbf7;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* Canvas SVG container */
#canvas-container {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#canvas-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Top Bar - Excalidraw Sketchy Island Style */
.sabura-topbar {
  position: absolute;
  top: 14px;
  left: 16px;
  right: 16px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: var(--ui-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 2px solid var(--ui-border);
  border-radius: 255px 25px 225px 25px/25px 225px 25px 255px;
  box-shadow: 2px 4px 0 rgba(0, 0, 0, 0.08);
  z-index: 50;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.topbar-left, .topbar-center, .topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-name {
  font-family: var(--font-hand);
  font-size: 25px;
  font-weight: 700;
  color: var(--ui-accent);
  letter-spacing: -0.5px;
}

.doc-title {
  font-family: var(--font-hand);
  font-size: 17px;
  font-weight: 600;
  color: var(--ui-text);
  max-width: 180px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  background: var(--ui-hover);
  border: 1.5px solid var(--ui-border);
  border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
  font-family: var(--font-hand);
  font-size: 14px;
  font-weight: 600;
  color: var(--ui-text);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

.control-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-hand);
  font-size: 15px;
  font-weight: 600;
  color: var(--ui-text);
}

.grid-controls-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.topbar-select {
  padding: 4px 10px;
  background: var(--ui-bg-solid);
  color: var(--ui-text);
  border: 1.6px solid var(--ui-border);
  border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
  font-family: var(--font-hand);
  font-size: 14px;
  font-weight: 600;
  outline: none;
  cursor: pointer;
  transition: all 0.12s ease;
}

.topbar-select:hover {
  border-color: var(--ui-accent);
  background: #fff3bf;
}

.topbar-btn {
  padding: 5px 14px;
  background: var(--ui-bg-solid);
  color: var(--ui-text);
  border: 1.8px solid var(--ui-border);
  border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
  box-shadow: 1px 2px 0 rgba(0, 0, 0, 0.08);
  font-family: var(--font-hand);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.12s ease;
}

.topbar-btn:hover {
  background: #fff3bf;
  transform: translateY(-1px);
  box-shadow: 1px 3px 0 rgba(0, 0, 0, 0.12);
}

.topbar-btn:active {
  transform: translate(1px, 1px);
  box-shadow: none;
}

.topbar-btn.active {
  background: #d0ebff;
  color: #1971c2;
  border-color: #1971c2;
}

.topbar-btn.primary {
  background: #d0ebff;
  color: #1864ab;
  border-color: #1971c2;
  border-width: 2px;
}

.topbar-btn.primary:hover {
  background: #a5d8ff;
}

.topbar-btn.save-btn {
  background: #d3f9d8;
  color: #2b8a3e;
  border-color: #2f9e44;
  border-width: 2px;
}

.topbar-btn.save-btn:hover {
  background: #b2f2bb;
}

.topbar-divider {
  width: 1px;
  height: 24px;
  background: var(--ui-border);
}

/* Accessible on-screen Wheel Trigger Button - Excalidraw Sketchy FAB */
.wheel-trigger-fab {
  position: absolute;
  bottom: 66px;
  left: 16px;
  padding: 8px 16px;
  background: var(--ui-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 2px solid var(--ui-border);
  border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
  box-shadow: 2px 4px 0 rgba(0, 0, 0, 0.1);
  color: var(--ui-text);
  font-family: var(--font-hand);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.15s ease, background 0.15s ease;
}

.wheel-trigger-fab:hover {
  background: #fff3bf;
  transform: translateY(-2px);
}

.wheel-trigger-fab .fab-key {
  padding: 2px 6px;
  background: rgba(0, 0, 0, 0.06);
  border: 1px solid var(--ui-border);
  border-radius: 4px;
  font-size: 12px;
  font-family: var(--font-mono);
}

/* Circular Tool Wheel - Excalidraw Sketchy Compass Dial */
.sabura-wheel {
  position: absolute;
  transform: translate(-50%, -50%);
  z-index: 1000;
  filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.22));
  pointer-events: auto;
}

.sabura-wheel-svg {
  display: block;
}

.wheel-bezel-rim {
  fill: none;
  stroke: var(--ui-wheel-stroke, #1e1e1e);
  stroke-width: 1.2px;
  opacity: 0.35;
  stroke-linecap: round;
}

.wheel-hub {
  fill: var(--ui-wheel-bg, #ffffff);
  stroke: none;
  cursor: pointer;
  transition: fill 0.15s ease;
}

.wheel-hub:hover {
  fill: var(--ui-wheel-hover, #fff3bf);
}

.wheel-hub-sketch {
  fill: none;
  stroke: var(--ui-wheel-stroke, #1e1e1e);
  stroke-width: 1.8px;
  stroke-linecap: round;
}

.wheel-hub-x {
  fill: none;
  stroke: var(--ui-wheel-stroke, #1e1e1e);
  stroke-width: 2px;
  stroke-linecap: round;
}

.wheel-wedge {
  fill: var(--ui-wheel-bg, #ffffff);
  stroke: none;
  cursor: pointer;
  transition: fill 0.12s ease;
}

.wheel-wedge:hover, .wheel-wedge.active {
  fill: var(--ui-wheel-hover, #fff3bf);
}

.wheel-wedge.danger:hover {
  fill: var(--ui-wheel-danger, #ffe3e3);
}

.wheel-wedge-sketch {
  fill: none;
  stroke: var(--ui-wheel-stroke, #1e1e1e);
  stroke-width: 1.5px;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke 0.12s ease, stroke-width 0.12s ease;
}

.wheel-wedge-sketch.active {
  stroke: var(--ui-accent, #1971c2);
  stroke-width: 2.2px;
}

.wheel-sub-wedge {
  fill: var(--ui-wheel-bg, #ffffff);
  stroke: none;
  cursor: pointer;
  transition: filter 0.12s ease;
}

.wheel-sub-wedge:hover {
  filter: brightness(0.94);
}

.wheel-sub-wedge.active-choice {
  fill: #d0ebff !important;
}

.wheel-wedge:focus-visible, .wheel-sub-wedge:focus-visible, .wheel-hub:focus-visible {
  outline: 2.5px solid var(--ui-accent, #1971c2);
  outline-offset: -2px;
}

.wheel-icon {
  font-size: 16px;
  fill: var(--ui-wheel-text, #1e1e1e);
  font-weight: 700;
  font-family: var(--font-hand);
}

.wheel-text {
  font-size: 13px;
  fill: var(--ui-wheel-text, #1e1e1e);
  font-weight: 700;
  font-family: var(--font-hand);
  letter-spacing: 0;
}

.wheel-sub-text {
  font-size: 12.5px;
  fill: var(--ui-wheel-text, #1e1e1e);
  font-weight: 700;
  font-family: var(--font-hand);
  letter-spacing: 0;
}

/* In-place Text Editor - Excalidraw Handwriting Feel */
.sabura-inline-text-editor {
  position: absolute;
  font-family: var(--font-hand);
  background: rgba(255, 255, 255, 0.9);
  border: 1.5px dashed var(--ui-accent);
  border-radius: 4px;
  line-height: 1.3;
  overflow: hidden;
  resize: none;
  outline: none;
  padding: 2px 6px;
  z-index: 200;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

/* Laser overlay canvas for presentation mode */
#laser-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 100;
  display: none;
}

/* Presentation Mode states */
body.in-presentation .sabura-topbar,
body.in-presentation .wheel-trigger-fab,
body.in-presentation .sabura-wheel,
body.in-presentation .zoom-help-toolbar {
  display: none !important;
}

body.in-presentation #laser-canvas {
  display: block;
}

body.in-presentation {
  cursor: none;
}

/* Compact Bottom-Left Zoom & Help Toolbar */
.zoom-help-toolbar {
  position: fixed;
  bottom: 16px;
  left: 16px;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 4px 6px;
  background: var(--ui-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 2px solid var(--ui-border);
  border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
  box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.12);
  z-index: 40;
  user-select: none;
  -webkit-user-select: none;
}

.zoom-btn {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--ui-text);
  font-family: var(--font-hand);
  font-size: 15px;
  font-weight: 700;
  padding: 4px 8px;
  min-width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
}

.zoom-btn:hover {
  background: var(--ui-surface);
  border-color: var(--ui-border);
}

.zoom-btn:active {
  transform: scale(0.94);
}

.zoom-btn.zoom-percent {
  font-family: var(--font-mono);
  font-size: 13px;
  min-width: 52px;
}

.zoom-btn.zoom-fit {
  font-size: 13px;
  padding: 4px 6px;
}

.zoom-btn.zoom-help {
  font-size: 14px;
  border-radius: 50%;
  width: 26px;
  height: 26px;
  min-width: 26px;
  border: 1px dashed var(--ui-border);
}

/* Accessible Help & Shortcuts Modal Backdrop */
.sabura-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.15s ease-out;
}

.sabura-modal-backdrop.visible {
  display: flex;
  opacity: 1;
}

/* Modal Dialog Window */
.sabura-modal-dialog {
  background: var(--ui-bg);
  color: var(--ui-text);
  border: 2.5px solid var(--ui-border);
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
  max-width: 720px;
  width: 92%;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: var(--font-hand);
  animation: modalPop 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes modalPop {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.help-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  border-bottom: 2px solid var(--ui-border);
  background: var(--ui-surface);
}

.help-title-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.help-logo {
  font-size: 18px;
  font-weight: 800;
  color: #1971c2;
  border: 1.5px solid #1971c2;
  padding: 2px 8px;
  border-radius: 6px;
}

.help-header h2 {
  font-size: 18px;
  margin: 0;
  font-weight: 700;
}

.help-close-btn {
  background: transparent;
  border: 1.5px solid var(--ui-border);
  border-radius: 6px;
  font-size: 14px;
  font-weight: 700;
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ui-text);
  transition: background 0.15s ease;
}

.help-close-btn:hover {
  background: #ffe3e3;
  color: #c92a2a;
}

.help-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  padding: 18px 24px;
  overflow-y: auto;
}

@media (max-width: 620px) {
  .help-body {
    grid-template-columns: 1fr;
  }
}

.help-section {
  margin-bottom: 18px;
}

.help-section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 8px 0;
  color: #1971c2;
  border-bottom: 1px dashed var(--ui-border);
  padding-bottom: 4px;
}

[data-ui-theme="dark"] .help-section-title {
  color: #74c0fc;
}

.help-list {
  list-style: none;
  margin: 0;
  padding: 0;
  font-size: 13.5px;
}

.help-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
  gap: 12px;
}

.help-desc {
  font-weight: 500;
}

.kbd-badge {
  display: inline-block;
  padding: 2px 6px;
  font-size: 11px;
  font-family: var(--font-mono);
  background: var(--ui-surface);
  border: 1px solid var(--ui-border);
  border-radius: 4px;
  box-shadow: 0 1px 1px rgba(0, 0, 0, 0.15);
  font-weight: 600;
  color: var(--ui-text);
  white-space: nowrap;
}

.help-footer {
  padding: 10px 20px;
  border-top: 1px solid var(--ui-border);
  font-size: 12px;
  color: var(--ui-text-muted);
  background: var(--ui-surface);
  text-align: center;
}


  </style>

function validateCommand(cmd) {
  const errors = [];
  if (!cmd || typeof cmd !== 'object' || Array.isArray(cmd)) {
    return { valid: false, errors: ['Command must be an object'] };
  }
  if (typeof cmd.type !== 'string' || !cmd.type.trim()) {
    errors.push('Command must have a non-empty type string');
    return { valid: false, errors };
  }
  if (!SUPPORTED_COMMAND_TYPES.has(cmd.type)) {
    errors.push(`Unknown command type: "${cmd.type}". Supported command types are: ${Array.from(SUPPORTED_COMMAND_TYPES).join(', ')}`);
    return { valid: false, errors };
  }

  // Type-specific field validations
  if (cmd.type === 'create_object') {
    if (!cmd.object || typeof cmd.object !== 'object' || Array.isArray(cmd.object)) {
      errors.push('create_object requires a valid object payload');
    }
  } else if (cmd.type === 'delete_objects') {
    if (!Array.isArray(cmd.ids)) {
      errors.push('delete_objects requires an array of ids');
    }
  } else if (cmd.type === 'move_objects') {
    if (!Array.isArray(cmd.ids)) errors.push('move_objects requires an array of ids');
    if (typeof cmd.dx !== 'number' || typeof cmd.dy !== 'number') {
      errors.push('move_objects requires numeric dx and dy deltas');
    }
  } else if (cmd.type === 'resize_object') {
    if (typeof cmd.id !== 'string' || !cmd.id.trim()) errors.push('resize_object requires a string id');
    if (!cmd.bounds || typeof cmd.bounds !== 'object') errors.push('resize_object requires a bounds object');
  } else if (cmd.type === 'set_text') {
    if (typeof cmd.id !== 'string' || !cmd.id.trim()) errors.push('set_text requires a string id');
    if (typeof cmd.text !== 'string') errors.push('set_text requires string text');
  } else if (cmd.type === 'configure_connector') {
    if (typeof cmd.id !== 'string' || !cmd.id.trim()) errors.push('configure_connector requires a string id');
  } else if (cmd.type === 'reconnect_connector') {
    if (typeof cmd.id !== 'string' || !cmd.id.trim()) errors.push('reconnect_connector requires a string id');
    if (cmd.endpoint !== 'from' && cmd.endpoint !== 'to') errors.push('reconnect_connector endpoint must be "from" or "to"');
    if (!cmd.target || typeof cmd.target !== 'object') errors.push('reconnect_connector requires a target object');
    else if (!cmd.target.id && !cmd.target.point) errors.push('reconnect_connector target must specify an id or point');
    if (cmd.target?.anchor && (typeof cmd.target.anchor.x !== 'number' || typeof cmd.target.anchor.y !== 'number')) {
      errors.push('reconnect_connector target.anchor must have numeric x and y');
    }
  } else if (cmd.type === 'set_board_theme') {
    if (!cmd.theme && !cmd.themeId) errors.push('set_board_theme requires theme or themeId');
  } else if (cmd.type === 'batch') {
    if (!Array.isArray(cmd.commands)) {
      errors.push('batch requires an array of commands');
    } else {
      for (let i = 0; i < cmd.commands.length; i++) {
        const sub = validateCommand(cmd.commands[i]);
        if (!sub.valid) {
          errors.push(`batch command [${i}]: ${sub.errors.join(', ')}`);
        }
      }
    }
  }

  return { valid: errors.length === 0, errors };
}

function hexToLuminance(hex) {
  if (!hex || typeof hex !== 'string' || !hex.startsWith('#')) return 0.5;
  let c = hex.slice(1);
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const num = parseInt(c, 16);
  if (isNaN(num)) return 0.5;
  const r = ((num >> 16) & 255) / 255;
  const g = ((num >> 8) & 255) / 255;
  const b = (num & 255) / 255;
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

function contrastRatio(hex1, hex2) {
  const l1 = hexToLuminance(hex1);
  const l2 = hexToLuminance(hex2);
  const bright = Math.max(l1, l2);
  const dark = Math.min(l1, l2);
  return (bright + 0.05) / (dark + 0.05);
}

/**
 * Applies an individual command to a Sabura document immutably, returning the updated document
 * and the exact inverse command to undo the operation.
 * 
 * @param {Object} doc - Current Sabura document
 * @param {Object} cmd - Command to apply
 * @returns {{ doc: Object, inverseCmd: Object }}
 */
function applyCommand(doc, cmd) {
  const newDoc = cloneDocument(doc);

  switch (cmd.type) {
    case 'create_object': {
      const obj = cloneDocument(cmd.object);
      if (!obj.id) obj.id = generateId(obj.type || 'obj');
      if (obj.seed === undefined) obj.seed = generateSeed();

      newDoc.objects[obj.id] = obj;
      const atIndex = typeof cmd.atIndex === 'number' ? Math.max(0, Math.min(newDoc.order.length, cmd.atIndex)) : newDoc.order.length;
      newDoc.order.splice(atIndex, 0, obj.id);

      const inverseCmd = {
        type: 'delete_objects',
        ids: [obj.id]
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'delete_objects': {
      const idsToDelete = (cmd.ids || []).filter(id => Boolean(newDoc.objects[id]));
      if (idsToDelete.length === 0) {
        return { doc: newDoc, inverseCmd: { type: 'noop' } };
      }

      const savedObjects = [];
      for (const id of idsToDelete) {
        const index = newDoc.order.indexOf(id);
        savedObjects.push({
          object: cloneDocument(newDoc.objects[id]),
          orderIndex: index
        });
        delete newDoc.objects[id];
      }

      newDoc.order = newDoc.order.filter(id => !idsToDelete.includes(id));

      // Reconnect connectors that referenced deleted objects to static points
      const affectedConnectors = [];
      for (const [cId, conn] of Object.entries(newDoc.objects)) {
        if (conn.type !== 'connector') continue;
        let modified = false;
        const prevFrom = cloneDocument(conn.from);
        const prevTo = cloneDocument(conn.to);

        if (conn.from && conn.from.id && idsToDelete.includes(conn.from.id)) {
          // Disconnect from object
          conn.from = { point: conn.from.point || { x: conn.x, y: conn.y } };
          modified = true;
        }
        if (conn.to && conn.to.id && idsToDelete.includes(conn.to.id)) {
          conn.to = { point: conn.to.point || { x: conn.x + conn.width, y: conn.y + conn.height } };
          modified = true;
        }
        if (modified) {
          affectedConnectors.push({ id: cId, prevFrom, prevTo });
        }
      }

      const inverseCmd = {
        type: 'batch',
        commands: [
          ...savedObjects.map(item => ({
            type: 'create_object',
            object: item.object,
            atIndex: item.orderIndex
          })),
          ...affectedConnectors.map(ac => ({
            type: 'configure_connector_endpoints',
            id: ac.id,
            from: ac.prevFrom,
            to: ac.prevTo
          }))
        ]
      };

      return { doc: newDoc, inverseCmd };
    }

    case 'duplicate_objects': {
      const ids = (cmd.ids || []).filter(id => Boolean(newDoc.objects[id]));
      const offset = cmd.offset || { x: 24, y: 24 };
      const duplicatedIds = [];
      const newObjects = [];

      for (const id of ids) {
        const source = newDoc.objects[id];
        const newId = generateId(source.type || 'dup');
        const dup = cloneDocument(source);
        dup.id = newId;
        dup.x += offset.x;
        dup.y += offset.y;
        if (dup.type === 'connector') {
          if (dup.from?.point) {
            dup.from.point.x += offset.x;
            dup.from.point.y += offset.y;
          }
          if (dup.to?.point) {
            dup.to.point.x += offset.x;
            dup.to.point.y += offset.y;
          }
        }
        dup.seed = generateSeed();
        dup.locked = false; // Duplicated objects are unlocked by default
        newDoc.objects[newId] = dup;
        newDoc.order.push(newId);
        duplicatedIds.push(newId);
        newObjects.push(dup);
      }

      const inverseCmd = {
        type: 'delete_objects',
        ids: duplicatedIds
      };
      return { doc: newDoc, inverseCmd, duplicatedIds };
    }

    case 'move_objects': {
      const dx = Number(cmd.dx) || 0;
      const dy = Number(cmd.dy) || 0;
      const ids = (cmd.ids || []).filter(id => newDoc.objects[id] && !newDoc.objects[id].locked);

      for (const id of ids) {
        const obj = newDoc.objects[id];
        obj.x += dx;
        obj.y += dy;

        // If it's a connector with point endpoints, translate the points
        if (obj.type === 'connector') {
          if (obj.from && obj.from.point) {
            obj.from.point.x += dx;
            obj.from.point.y += dy;
          }
          if (obj.to && obj.to.point) {
            obj.to.point.x += dx;
            obj.to.point.y += dy;
          }
        }
      }

      const inverseCmd = {
        type: 'move_objects',
        ids,
        dx: -dx,
        dy: -dy
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'resize_object': {
      const obj = newDoc.objects[cmd.id];
      if (!obj || obj.locked) {
        return { doc: newDoc, inverseCmd: { type: 'noop' } };
      }

      const prevBounds = { x: obj.x, y: obj.y, width: obj.width, height: obj.height };
      const prevTextStyle = obj.textStyle ? cloneDocument(obj.textStyle) : null;

      obj.x = cmd.bounds.x !== undefined ? cmd.bounds.x : obj.x;
      obj.y = cmd.bounds.y !== undefined ? cmd.bounds.y : obj.y;
      obj.width = Math.max(MIN_OBJECT_SIZE, cmd.bounds.width !== undefined ? cmd.bounds.width : obj.width);
      obj.height = Math.max(MIN_OBJECT_SIZE, cmd.bounds.height !== undefined ? cmd.bounds.height : obj.height);

      if (cmd.restoreTextStyle) {
        obj.textStyle = cloneDocument(cmd.restoreTextStyle);
      } else if (cmd.scaleText && obj.textStyle && prevBounds.width > 0 && prevBounds.height > 0) {
        const scaleX = obj.width / prevBounds.width;
        const scaleY = obj.height / prevBounds.height;
        const scale = (scaleX + scaleY) / 2;
        const newSize = Math.max(10, Math.min(120, Math.round((obj.textStyle.resolvedSize || 20) * scale)));
        obj.textStyle.resolvedSize = newSize;

        if (obj.type === 'text') {
          const familyToken = obj.textStyle?.fontFamily || 'hand';
          const m = measureText(obj.text, newSize, familyToken);
          obj.width = m.width;
          obj.height = m.height;
        }
      }

      const inverseCmd = {
        type: 'resize_object',
        id: cmd.id,
        bounds: prevBounds,
        scaleText: false,
        restoreTextStyle: prevTextStyle
      };

      return { doc: newDoc, inverseCmd };
    }

    case 'align_objects': {
      const ids = (cmd.ids || []).filter(id => newDoc.objects[id] && !newDoc.objects[id].locked);
      if (ids.length < 2) return { doc: newDoc, inverseCmd: { type: 'noop' } };
      const objects = ids.map(id => newDoc.objects[id]);
      const deltas = alignObjects(objects, cmd.alignment);
      const prevPositions = {};
      for (const id of ids) {
        const d = deltas[id] || { dx: 0, dy: 0 };
        prevPositions[id] = { x: newDoc.objects[id].x, y: newDoc.objects[id].y };
        newDoc.objects[id].x += d.dx;
        newDoc.objects[id].y += d.dy;
      }
      const inverseCmd = {
        type: 'restore_positions',
        positions: prevPositions
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'distribute_objects': {
      const ids = (cmd.ids || []).filter(id => newDoc.objects[id] && !newDoc.objects[id].locked);
      if (ids.length < 3) return { doc: newDoc, inverseCmd: { type: 'noop' } };
      const objects = ids.map(id => newDoc.objects[id]);
      const deltas = distributeObjects(objects, cmd.direction);
      const prevPositions = {};
      for (const id of ids) {
        const d = deltas[id] || { dx: 0, dy: 0 };
        prevPositions[id] = { x: newDoc.objects[id].x, y: newDoc.objects[id].y };
        newDoc.objects[id].x += d.dx;
        newDoc.objects[id].y += d.dy;
      }
      const inverseCmd = {
        type: 'restore_positions',
        positions: prevPositions
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'restore_positions': {
      const prev = {};
      for (const [id, pos] of Object.entries(cmd.positions || {})) {
        if (!newDoc.objects[id]) continue;
        prev[id] = { x: newDoc.objects[id].x, y: newDoc.objects[id].y };
        newDoc.objects[id].x = pos.x;
        newDoc.objects[id].y = pos.y;
      }
      return { doc: newDoc, inverseCmd: { type: 'restore_positions', positions: prev } };
    }

    case 'set_text': {
      const obj = newDoc.objects[cmd.id];
      if (!obj || obj.locked) {
        return { doc: newDoc, inverseCmd: { type: 'noop' } };
      }
      const prevText = obj.text || '';
      const prevBounds = { x: obj.x, y: obj.y, width: obj.width, height: obj.height };
      obj.text = String(cmd.text !== undefined ? cmd.text : '');

      if (cmd.prevBounds) {
        // Restore bounds during undo
        obj.x = cmd.prevBounds.x;
        obj.y = cmd.prevBounds.y;
        obj.width = cmd.prevBounds.width;
        obj.height = cmd.prevBounds.height;
      } else if (obj.type === 'text') {
        // Auto-fit bounds to text content
        const fontSize = obj.textStyle?.resolvedSize || 20;
        const familyToken = obj.textStyle?.fontFamily || 'hand';
        const m = measureText(obj.text, fontSize, familyToken);
        obj.width = m.width;
        obj.height = m.height;
      }

      const inverseCmd = {
        type: 'set_text',
        id: cmd.id,
        text: prevText,
        prevBounds
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'set_style': {
      const ids = (cmd.ids || []).filter(id => newDoc.objects[id] && !newDoc.objects[id].locked);
      const prevStyles = {};

      for (const id of ids) {
        const obj = newDoc.objects[id];
        prevStyles[id] = {
          fill: obj.fill,
          stroke: obj.stroke,
          strokeWidth: obj.strokeWidth,
          strokeStyle: obj.strokeStyle,
          opacity: obj.opacity,
          roughness: obj.roughness
        };

        if (cmd.updates.fill !== undefined) obj.fill = cmd.updates.fill;
        if (cmd.updates.stroke !== undefined) obj.stroke = cmd.updates.stroke;
        if (cmd.updates.strokeWidth !== undefined) obj.strokeWidth = cmd.updates.strokeWidth;
        if (cmd.updates.strokeStyle !== undefined) obj.strokeStyle = cmd.updates.strokeStyle;
        if (cmd.updates.opacity !== undefined) obj.opacity = cmd.updates.opacity;
        if (cmd.updates.roughness !== undefined) obj.roughness = cmd.updates.roughness;

        // If stroke is changed and textStyle color matches previous stroke, update text color
        if (cmd.updates.stroke !== undefined && obj.textStyle && obj.textStyle.color === prevStyles[id].stroke) {
          obj.textStyle.color = cmd.updates.stroke;
        }
      }

      const inverseCmd = {
        type: 'restore_styles',
        styles: prevStyles
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'restore_styles': {
      const styles = cmd.styles || {};
      const prevStyles = {};
      for (const [id, style] of Object.entries(styles)) {
        const obj = newDoc.objects[id];
        if (!obj) continue;
        prevStyles[id] = {
          fill: obj.fill,
          stroke: obj.stroke,
          strokeWidth: obj.strokeWidth,
          strokeStyle: obj.strokeStyle,
          opacity: obj.opacity,
          roughness: obj.roughness
        };
        Object.assign(obj, style);
      }
      return { doc: newDoc, inverseCmd: { type: 'restore_styles', styles: prevStyles } };
    }

    case 'set_typography': {
      const ids = (cmd.ids || []).filter(id => newDoc.objects[id] && !newDoc.objects[id].locked);
      const prevTypography = {};

      for (const id of ids) {
        const obj = newDoc.objects[id];
        if (!obj.textStyle) continue;
        prevTypography[id] = cloneDocument(obj.textStyle);

        if (cmd.updates.size !== undefined) {
          obj.textStyle.size = cmd.updates.size;
          obj.textStyle.resolvedSize = FONT_SIZES[cmd.updates.size] || obj.textStyle.resolvedSize || 20;
        }
        if (cmd.updates.resolvedSize !== undefined) obj.textStyle.resolvedSize = cmd.updates.resolvedSize;
        if (cmd.updates.fontFamily !== undefined) obj.textStyle.fontFamily = cmd.updates.fontFamily;
        if (cmd.updates.bold !== undefined) obj.textStyle.bold = cmd.updates.bold;
        if (cmd.updates.align !== undefined) obj.textStyle.align = cmd.updates.align;
        if (cmd.updates.color !== undefined) obj.textStyle.color = cmd.updates.color;
      }

      const inverseCmd = {
        type: 'restore_typography',
        typography: prevTypography
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'restore_typography': {
      const prev = {};
      for (const [id, style] of Object.entries(cmd.typography || {})) {
        const obj = newDoc.objects[id];
        if (!obj) continue;
        prev[id] = cloneDocument(obj.textStyle);
        obj.textStyle = cloneDocument(style);
      }
      return { doc: newDoc, inverseCmd: { type: 'restore_typography', typography: prev } };
    }

    case 'change_shape': {
      const obj = newDoc.objects[cmd.id];
      if (!obj || obj.locked) {
        return { doc: newDoc, inverseCmd: { type: 'noop' } };
      }
      const prevType = obj.type;
      obj.type = cmd.newType;

      const inverseCmd = {
        type: 'change_shape',
        id: cmd.id,
        newType: prevType
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'lock_objects': {
      const ids = (cmd.ids || []).filter(id => Boolean(newDoc.objects[id]));
      const locked = Boolean(cmd.locked);
      for (const id of ids) {
        newDoc.objects[id].locked = locked;
      }
      const inverseCmd = {
        type: 'lock_objects',
        ids,
        locked: !locked
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'reorder_objects': {
      const ids = (cmd.ids || []).filter(id => newDoc.objects[id]);
      if (ids.length === 0) return { doc: newDoc, inverseCmd: { type: 'noop' } };

      const prevOrder = [...newDoc.order];
      const action = cmd.action; // 'front' | 'back' | 'forward' | 'backward'

      if (action === 'front') {
        newDoc.order = newDoc.order.filter(id => !ids.includes(id)).concat(ids);
      } else if (action === 'back') {
        newDoc.order = ids.concat(newDoc.order.filter(id => !ids.includes(id)));
      } else if (action === 'forward') {
        // Move each target forward by 1 index from top to bottom
        for (let i = newDoc.order.length - 2; i >= 0; i--) {
          const curr = newDoc.order[i];
          const next = newDoc.order[i + 1];
          if (ids.includes(curr) && !ids.includes(next)) {
            newDoc.order[i] = next;
            newDoc.order[i + 1] = curr;
          }
        }
      } else if (action === 'backward') {
        // Move each target backward by 1 index from bottom to top
        for (let i = 1; i < newDoc.order.length; i++) {
          const curr = newDoc.order[i];
          const prev = newDoc.order[i - 1];
          if (ids.includes(curr) && !ids.includes(prev)) {
            newDoc.order[i] = prev;
            newDoc.order[i - 1] = curr;
          }
        }
      }

      const inverseCmd = {
        type: 'restore_order',
        order: prevOrder
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'restore_order': {
      const prevOrder = [...newDoc.order];
      newDoc.order = [...cmd.order];
      return { doc: newDoc, inverseCmd: { type: 'restore_order', order: prevOrder } };
    }

    case 'group_objects': {
      const ids = (cmd.ids || []).filter(id => newDoc.objects[id] && !newDoc.objects[id].locked);
      if (ids.length < 2) return { doc: newDoc, inverseCmd: { type: 'noop' } };

      const groupId = cmd.groupId || generateId('grp');
      const prevGroupIds = {};

      for (const id of ids) {
        prevGroupIds[id] = newDoc.objects[id].groupId;
        newDoc.objects[id].groupId = groupId;
      }
      newDoc.groups[groupId] = { id: groupId, name: cmd.name || 'Group' };

      const inverseCmd = {
        type: 'restore_groups',
        groupIds: prevGroupIds,
        removeGroup: groupId
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'ungroup_objects': {
      const groupIds = cmd.groupIds || [];
      const restoredGroups = {};
      const restoredMembers = {};

      for (const gId of groupIds) {
        if (newDoc.groups[gId]) {
          restoredGroups[gId] = cloneDocument(newDoc.groups[gId]);
          delete newDoc.groups[gId];
        }
      }

      for (const [id, obj] of Object.entries(newDoc.objects)) {
        if (obj.groupId && groupIds.includes(obj.groupId)) {
          restoredMembers[id] = obj.groupId;
          obj.groupId = null;
        }
      }

      const inverseCmd = {
        type: 'restore_ungroup',
        groups: restoredGroups,
        members: restoredMembers
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'restore_groups': {
      for (const [id, gId] of Object.entries(cmd.groupIds || {})) {
        if (newDoc.objects[id]) newDoc.objects[id].groupId = gId;
      }
      if (cmd.removeGroup) {
        delete newDoc.groups[cmd.removeGroup];
      }
      return { doc: newDoc, inverseCmd: { type: 'noop' } };
    }

    case 'restore_ungroup': {
      for (const [gId, gData] of Object.entries(cmd.groups || {})) {
        newDoc.groups[gId] = gData;
      }
      for (const [id, gId] of Object.entries(cmd.members || {})) {
        if (newDoc.objects[id]) newDoc.objects[id].groupId = gId;
      }
      return { doc: newDoc, inverseCmd: { type: 'noop' } };
    }

    case 'connect_objects': {
      const cId = cmd.connectorId || generateId('conn');
      const prevConnector = newDoc.objects[cId] ? cloneDocument(newDoc.objects[cId]) : null;

      const connectorObj = {
        id: cId,
        type: 'connector',
        x: 0,
        y: 0,
        width: 100,
        height: 100,
        stroke: cmd.stroke || newDoc.theme.defaultStroke,
        strokeWidth: cmd.strokeWidth || newDoc.theme.defaultStrokeWidth,
        strokeStyle: cmd.strokeStyle || 'solid',
        opacity: cmd.opacity !== undefined ? cmd.opacity : 1.0,
        roughness: cmd.roughness !== undefined ? cmd.roughness : newDoc.theme.defaultRoughness,
        seed: generateSeed(),
        locked: false,
        from: { id: cmd.fromId, side: cmd.fromSide },
        to: { id: cmd.toId, side: cmd.toSide },
        routing: cmd.routing || 'straight',
        startArrow: cmd.startArrow || false,
        endArrow: cmd.endArrow !== undefined ? cmd.endArrow : true
      };

      newDoc.objects[cId] = connectorObj;
      if (!newDoc.order.includes(cId)) {
        newDoc.order.push(cId);
      }

      const inverseCmd = prevConnector
        ? { type: 'create_object', object: prevConnector }
        : { type: 'delete_objects', ids: [cId] };

      return { doc: newDoc, inverseCmd };
    }

    case 'reconnect_connector': {
      const conn = newDoc.objects[cmd.id];
      if (!conn || conn.type !== 'connector' || conn.locked) {
        return { doc: newDoc, inverseCmd: { type: 'noop' } };
      }
      const endpoint = cmd.endpoint; // 'from' | 'to'
      const prevTarget = cloneDocument(conn[endpoint]);
      conn[endpoint] = cloneDocument(cmd.target);

      const inverseCmd = {
        type: 'reconnect_connector',
        id: cmd.id,
        endpoint,
        target: prevTarget
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'configure_connector': {
      const conn = newDoc.objects[cmd.id];
      if (!conn || conn.type !== 'connector' || conn.locked) {
        return { doc: newDoc, inverseCmd: { type: 'noop' } };
      }
      const prevConfig = {
        routing: conn.routing,
        startArrow: conn.startArrow,
        endArrow: conn.endArrow,
        stacking: conn.stacking
      };

      if (cmd.routing !== undefined) conn.routing = cmd.routing;
      if (cmd.startArrow !== undefined) conn.startArrow = cmd.startArrow;
      if (cmd.endArrow !== undefined) conn.endArrow = cmd.endArrow;
      if (cmd.stacking !== undefined) conn.stacking = cmd.stacking;

      const inverseCmd = {
        type: 'configure_connector',
        id: cmd.id,
        ...prevConfig
      };
      return { doc: newDoc, inverseCmd };
    }

    case 'configure_connector_endpoints': {

  const initialClone = cloneDocument(doc);
  const inverseList = [];
  let currentDoc = initialClone;

  for (let i = 0; i < commands.length; i++) {
    try {
      const result = applyCommand(currentDoc, commands[i]);
      currentDoc = result.doc;
      if (result.inverseCmd && result.inverseCmd.type !== 'noop') {
        inverseList.push(result.inverseCmd);

  inverseList.reverse();
  const inverseCmd = {
    type: 'batch',
    commands: inverseList
  };
  return { doc: currentDoc, inverseCmd };
}

/**
 * Sabura Deterministic Sketch Generator.
 * 
 * Uses a seedable Mulberry32 PRNG to generate reproducible hand-drawn SVG paths

/**
 * Creates a fast, seedable 32-bit PRNG (Mulberry32).
 * @param {number} seed 
 * @returns {() => number} Returns float in [0, 1)
 */
function createPRNG(seed) {
  let s = Math.floor(Math.abs(seed)) || 1;
  return function next() {
    s |= 0;
    s = (s + 0x6D2B79F5) | 0;

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

/**

 * @param {number} y1 
 * @param {number} x2 
 * @param {number} y2

function sketchLine(x1, y1, x2, y2, prng, roughness = 1) {

  const length = Math.hypot(x2 - x1, y2 - y1);

    const endOffset = randomRange(prng, -overshoot * 0.8, overshoot);

    const sy = y1 - dy * startOffset + ny * randomRange(prng, -roughnessScale * 0.7, roughnessScale * 0.7);

    const ex = x2 + dx * endOffset + nx * randomRange(prng, -roughnessScale * 0.7, roughnessScale * 0.7);

/**
 * Sabura Laser Pointer: Canvas-based temporary laser pointer with glowing fading trail for Presentation mode.
 */

class LaserPointer {
  constructor(canvasElement) {
    this.canvas = canvasElement;
    this.ctx = this.canvas.getContext('2d');
    this.points = [];
    this.active = false;
    this.animId = null;
    this.decayMs = 600;

    this.render = this.render.bind(this);
    this.onResize = this.onResize.bind(this);
  }

  onResize() {
    if (this.active) {
      this.resize();
    }
  }

  start() {
    this.active = true;
    this.points = [];
    this.resize();
    window.addEventListener('resize', this.onResize);
    this.render();
  }

  stop() {
    this.active = false;
    window.removeEventListener('resize', this.onResize);
    if (this.animId) {
      cancelAnimationFrame(this.animId);
      this.animId = null;
    }
    if (this.ctx && this.canvas) {
      this.ctx.setTransform(1, 0, 0, 1, 0, 0);
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    }
    this.points = [];
  }

  resize() {
    if (!this.canvas || !this.ctx) return;
    const rect = this.canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const width = rect.width || window.innerWidth;
    const height = rect.height || window.innerHeight;

    this.canvas.width = Math.round(width * dpr);
    this.canvas.height = Math.round(height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  addPoint(clientX, clientY) {
    if (!this.active || !this.canvas) return;
    const rect = this.canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    const now = performance.now();
    this.points.push({ x, y, time: now });
  }

  render() {
    if (!this.active) return;
    const now = performance.now();
    const ctx = this.ctx;
    const rect = this.canvas.getBoundingClientRect();
    const w = rect.width || window.innerWidth;
    const h = rect.height || window.innerHeight;

    ctx.clearRect(0, 0, w, h);

    // Filter out expired points
    this.points = this.points.filter(p => now - p.time < this.decayMs);

    if (this.points.length > 1) {
      for (let i = 1; i < this.points.length; i++) {
        const p1 = this.points[i - 1];
        const p2 = this.points[i];
        const age = now - p2.time;
        const progress = Math.max(0, 1 - age / this.decayMs);

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = `rgba(255, 59, 48, ${progress * 0.7})`;
        ctx.lineWidth = 4 * progress;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Inner glowing core
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = `rgba(255, 255, 255, ${progress * 0.9})`;
        ctx.lineWidth = 1.5 * progress;
        ctx.stroke();
      }

      // Tip dot
      const tip = this.points[this.points.length - 1];
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 59, 48, 0.9)';
      ctx.shadowColor = '#ff3b30';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.arc(tip.x, tip.y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }

    this.animId = requestAnimationFrame(this.render);
  }
}

/**
 * Calculates perceived luminance of a hex color.
 */
function hexToLuminance(hex) {
  if (!hex || typeof hex !== 'string' || !hex.startsWith('#')) return 0.5;
  let c = hex.slice(1);
  if (c.length === 3) c = c.split('').map(x => x + x).join('');

  if (isNaN(num)) return 0.5;
  const r = ((num >> 16) & 255) / 255;

  return color;

  const unionBox = getUnionBoundingBox(selectedObjects);
  if (!unionBox) return '';

  const pad = 4;
  const bx = unionBox.x - pad;
  const by = unionBox.y - pad;
  const bw = unionBox.width + pad * 2;
  const bh = unionBox.height + pad * 2;

  // Bounding rect: Concepts precision hairline dash with subtle accent wash
  markup.push(`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="${selFill}" stroke="${selStroke}" stroke-width="1.2" stroke-dasharray="4,4" pointer-events="none" />`);

  // Only render 8 resize handles if single unlocked object or non-group selection
  const isSingle = selectedObjects.length === 1;
  const isLocked = selectedObjects.some(o => o.locked);

  if (!isLocked) {
    const handles = [
      { id: 'nw', x: bx, y: by, cursor: 'nwse-resize' },
      { id: 'n', x: bx + bw / 2, y: by, cursor: 'ns-resize' },
      { id: 'ne', x: bx + bw, y: by, cursor: 'nesw-resize' },
      { id: 'e', x: bx + bw, y: by + bh / 2, cursor: 'ew-resize' },
      { id: 'se', x: bx + bw, y: by + bh, cursor: 'nwse-resize' },
      { id: 's', x: bx + bw / 2, y: by + bh, cursor: 'ns-resize' },
      { id: 'sw', x: bx, y: by + bh, cursor: 'nesw-resize' },
      { id: 'w', x: bx, y: by + bh / 2, cursor: 'ew-resize' }
    ];

    for (const h of handles) {
      markup.push(`<circle cx="${h.x}" cy="${h.y}" r="4.5" fill="${handleFill}" stroke="${handleStroke}" stroke-width="1.8" data-handle="${h.id}" style="cursor: ${h.cursor};" />`);
    }
  }

  return markup.join('\n');
}

/**
 * Creates SVG path for an annular sector (pie wedge).
 * 
 * @param {number} cx - Center X
 * @param {number} cy - Center Y
 * @param {number} rInner - Inner radius
 * @param {number} rOuter - Outer radius
 * @param {number} startAngle - Start angle in radians
 * @param {number} endAngle - End angle in radians
 * @returns {string} SVG path 'd' attribute
 */
function createWedgePath(cx, cy, rInner, rOuter, startAngle, endAngle, gapAngle = 0.025) {
  const span = endAngle - startAngle;
  const actualGap = Math.min(gapAngle, span * 0.25);
  const actualStart = startAngle + actualGap / 2;
  const actualEnd = endAngle - actualGap / 2;

  const x1 = cx + rOuter * Math.cos(actualStart);
  const y1 = cy + rOuter * Math.sin(actualStart);
  const x2 = cx + rOuter * Math.cos(actualEnd);
  const y2 = cy + rOuter * Math.sin(actualEnd);

  const x3 = cx + rInner * Math.cos(actualEnd);
  const y3 = cy + rInner * Math.sin(actualEnd);
  const x4 = cx + rInner * Math.cos(actualStart);
  const y4 = cy + rInner * Math.sin(actualStart);

  const largeArc = actualEnd - actualStart > Math.PI ? 1 : 0;

  if (rInner <= 0) {
    return `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
  }

  return `M ${x4.toFixed(2)} ${y4.toFixed(2)} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L ${x3.toFixed(2)} ${y3.toFixed(2)} A ${rInner} ${rInner} 0 ${largeArc} 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
}

class ToolWheel {
  constructor(containerElement, onAction) {
    this.container = containerElement;
    this.onAction = onAction; // Callback (actionName, payload)
    this.isOpen = false;
    this.pos = { x: 0, y: 0 };
    this.context = 'canvas'; // 'canvas' | 'object'
    this.selectedObject = null;
    this.hoveredItem = null;
    this.activeSubMenu = null;
    this.themePalette = [];

    this.wheelEl = document.createElement('div');
    this.wheelEl.className = 'sabura-wheel';
    this.wheelEl.style.display = 'none';
    this.container.appendChild(this.wheelEl);

    this.onPointerDownOutside = this.onPointerDownOutside.bind(this);
    this.onKeyDown = this.onKeyDown.bind(this);
  }

  setThemePalette(palette) {
    this.themePalette = palette || [];
  }

  open(x, y, context = 'canvas', selectedObject = null, palette = [], selectedCount = 1) {
    if (palette && palette.length) this.themePalette = palette;
    this.context = context;
    this.selectedObject = selectedObject;
    this.selectedCount = selectedCount;
    this.activeSubMenu = null;
    this.hoveredItem = null;

    const clampedX = Math.max(pad, Math.min(window.innerWidth - pad, x));
    const clampedY = Math.max(pad, Math.min(window.innerHeight - pad, y));
    this.pos = { x: clampedX, y: clampedY };

    this.isOpen = true;
    this.wheelEl.style.display = 'block';
    this.wheelEl.style.left = `${this.pos.x}px`;
    this.wheelEl.style.top = `${this.pos.y}px`;

    window.addEventListener('keydown', this.onKeyDown, true);

  render() {

    const count = items.length;
    const rInner = 36;
    const rOuter = 100;
    const rSubOuter = 160;

    let svgParts = [];
    const size = (rSubOuter + 10) * 2;
    const center = size / 2;

    svgParts.push(`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="sabura-wheel-svg">`);

      svgParts.push(`<path d="${subRimSketch}" class="wheel-bezel-rim sub" pointer-events="none" />`);

    // Center hub: underlying clickable disc

    // Sketchy hand-drawn circle for center hub

    svgParts.push(`<path d="${hubSketch}" class="wheel-hub-sketch" pointer-events="none" />`);

    // Offset slightly so top slice is centered vertically
    const angleOffset = -Math.PI / 2 - angleStep / 2;

    let subMenuToRender = null;
    let subMenuStartAngle = 0;
    let subMenuEndAngle = 0;

    for (let i = 0; i < count; i++) {
      const item = items[i];

      const endAngle = startAngle + angleStep;

      const isSubActive = this.activeSubMenu === item.id;

      // Solid wedge fill layer with keyboard accessibility
      svgParts.push(`<path d="${pathD}" class="${wedgeClass}" data-item-id="${item.id}" tabindex="0" role="button" aria-label="${item.label}" />`);

      const sketchD = sketchWedge(center, center, rInner, rOuter, startAngle, endAngle, prng, 1);

      const totalSpan = Math.min(Math.PI * 1.15, Math.max(0.45, subCount * spanPerItem));
      const midParent = (subMenuStartAngle + subMenuEndAngle) / 2;
      const subStartBase = midParent - totalSpan / 2;

        const sEnd = sStart + subStep;
        const sMid = (sStart + sEnd) / 2;

        const subPath = createWedgePath(center, center, rOuter + 4, rSubOuter, sStart, sEnd);
        const colorStyle = sub.color ? `fill: ${sub.color}; stroke: #dee2e6;` : '';
        const isSubActive = Boolean(sub.isActive);

        svgParts.push(`<path d="${subPath}" class="wheel-sub-wedge ${isSubActive ? 'active-choice' : ''}" data-sub-id="${sub.id}" tabindex="0" role="button" aria-label="${sub.label}" style="${colorStyle}" />`);
        const subSketchD = sketchWedge(center, center, rOuter + 4, rSubOuter, sStart, sEnd, prng, 1);
        svgParts.push(`<path d="${subSketchD}" class="wheel-wedge-sketch ${isSubActive ? 'active' : ''}" pointer-events="none" />`);

        const sTextR = (rOuter + 4 + rSubOuter) / 2;
        const sX = center + sTextR * Math.cos(sMid);
        const sY = center + sTextR * Math.sin(sMid);

        svgParts.push(`<g class="wheel-label-group" pointer-events="none">
          <text x="${sX}" y="${sY - 2}" text-anchor="middle" class="wheel-icon">${sub.icon || ''}</text>
          <text x="${sX}" y="${sY + 10}" text-anchor="middle" class="wheel-sub-text">${sub.label}${isSubActive ? ' ✓' : ''}</text>
        </g>`);
      }
    }

    svgParts.push('</svg>');
    this.wheelEl.innerHTML = svgParts.join('\n');

    // Attach click and keyboard listeners to wedges
    const allWedges = this.wheelEl.querySelectorAll('.wheel-wedge');
    allWedges.forEach(w => {
      const id = w.getAttribute('data-item-id');
      const item = items.find(it => it.id === id);
      if (!item) return;

      // Mouseenter triggers sub-ring naturally
      w.addEventListener('mouseenter', () => {
        if (item.subItems && item.subItems.length > 0 && this.activeSubMenu !== item.id) {
          this.activeSubMenu = item.id;
          this.render();
        }
      });

      const activate = (e) => {
        e.stopPropagation();
        this.handleItemClick(item);
      };

      w.addEventListener('click', activate);
      w.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activate(e);
        }
      });
    });

    const subWedges = this.wheelEl.querySelectorAll('.wheel-sub-wedge');
    subWedges.forEach(sw => {
      const subId = sw.getAttribute('data-sub-id');
      const subItem = subMenuToRender?.find(s => s.id === subId);
      if (!subItem) return;

      const activateSub = (e) => {
        e.stopPropagation();
        this.onAction(subItem.id, subItem);
        this.close();
      };

      sw.addEventListener('click', activateSub);
      sw.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activateSub(e);
        }
      });
    });

    const hub = this.wheelEl.querySelector('.wheel-hub');
    if (hub) {
      const closeHub = (e) => {
        e.stopPropagation();
        this.close();
      };
      hub.addEventListener('click', closeHub);
      hub.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          closeHub(e);
        }
      });
    }
  }
}

/**
 * Sabura In-Place Text Editor: Floating textarea positioned over target object for inline text editing.
 */



class TextEditor {
  constructor(containerElement, onCommit) {
    this.container = containerElement;
    this.onCommit = onCommit; // Callback (objectId, newText)
    this.targetObject = null;
    this.initialText = '';

    this.textarea = document.createElement('textarea');
    this.textarea.className = 'sabura-inline-text-editor';
    this.textarea.style.display = 'none';
    this.container.appendChild(this.textarea);

    this.onBlur = this.onBlur.bind(this);
    this.onKeyDown = this.onKeyDown.bind(this);

    this.textarea.addEventListener('blur', this.onBlur);
    this.textarea.addEventListener('keydown', this.onKeyDown);
  }

  open(object, camera) {
    this.targetObject = object;
    this.initialText = object.text || '';

    const textStyle = object.textStyle || {};
    const fontSize = (textStyle.resolvedSize || 20) * camera.zoom;
    const fontFamily = FONT_FAMILIES[textStyle.fontFamily] || FONT_FAMILIES.sans;
    const fontWeight = textStyle.bold ? 'bold' : 'normal';
    const align = textStyle.align || (object.type === 'text' ? 'left' : 'center');
    const color = textStyle.color || object.stroke || '#1e1e1e';

    const screenX = object.x * camera.zoom + camera.x;
    const screenY = object.y * camera.zoom + camera.y;
    const screenW = Math.max(120, object.width * camera.zoom);
    const screenH = Math.max(40, object.height * camera.zoom);

    this.textarea.style.display = 'block';
    this.textarea.style.left = `${screenX}px`;
    this.textarea.style.top = `${screenY}px`;
    this.textarea.style.width = `${screenW}px`;
    this.textarea.style.height = `${screenH}px`;
    this.textarea.style.fontSize = `${fontSize}px`;
    this.textarea.style.fontFamily = fontFamily;
    this.textarea.style.fontWeight = fontWeight;
    this.textarea.style.textAlign = align;
    this.textarea.style.color = color;

    this.textarea.value = this.initialText;
    this.textarea.focus();
    this.textarea.select();
  }

  close(commit = true) {
    if (this.textarea.style.display === 'none') return;
    const newText = this.textarea.value;
    const objId = this.targetObject?.id;
    this.textarea.style.display = 'none';

    if (commit && objId && newText !== this.initialText) {
      this.onCommit(objId, newText);
    }
    this.targetObject = null;
  }

  onBlur() {
    this.close(true);
  }

  onKeyDown(e) {
    if (e.key === 'Escape') {
      e.stopPropagation();
      this.close(false); // Cancel without saving
    } else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey || this.targetObject?.type !== 'text')) {
      // Cmd+Enter or Enter inside shapes commits
      e.preventDefault();
      this.close(true);
    }
  }
}

/**
 * Sabura Keyboard Shortcuts Coordinator.
 */

function getPlatform() {
  if (typeof navigator === 'undefined') return { isMac: false, modKey: 'Ctrl', modSymbol: 'Ctrl' };
  const isMac = (navigator.platform || '').toUpperCase().indexOf('MAC') >= 0 ||
                (navigator.userAgent || '').toUpperCase().indexOf('MAC') >= 0;
  return {
    isMac,
    modKey: isMac ? 'Cmd' : 'Ctrl',
    modSymbol: isMac ? '⌘' : 'Ctrl'
  };
}

class ShortcutsCoordinator {
  constructor(handlers) {
    this.handlers = handlers;
    this.isSpacePressed = false;
    this.lastPointerPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

    this.onKeyDown = this.onKeyDown.bind(this);
    this.onKeyUp = this.onKeyUp.bind(this);
    this.onPointerMove = this.onPointerMove.bind(this);

    window.addEventListener('keydown', this.onKeyDown);
    window.addEventListener('keyup', this.onKeyUp);
    window.addEventListener('pointermove', this.onPointerMove);
  }

  destroy() {
    window.removeEventListener('keydown', this.onKeyDown);
    window.removeEventListener('keyup', this.onKeyUp);
    window.removeEventListener('pointermove', this.onPointerMove);
  }

  onPointerMove(e) {
    this.lastPointerPos = { x: e.clientX, y: e.clientY };
  }

  onKeyDown(e) {
    // Check if user is typing in input, textarea, contenteditable, or in-place text editor
    const activeEl = document.activeElement;
    const isTyping = ['INPUT', 'TEXTAREA'].includes(activeEl?.tagName) ||
      Boolean(activeEl?.isContentEditable) ||
      Boolean(this.handlers.isTextEditing?.());

    if (isTyping) {
      // In text editing, Escape commits/cancels the text editor
      if (e.key === 'Escape') {
        this.handlers.onEscape?.();
      }
      return;
    }

    const { isMac } = getPlatform();
    const mod = isMac ? e.metaKey : e.ctrlKey;

    // Temporary Space-to-Pan
    if (e.key === ' ' && !this.isSpacePressed && !mod) {
      this.isSpacePressed = true;
      this.handlers.onSpaceHold?.(true);
      return;
    }

    // --- Tools & Navigation ---
    if (e.key.toLowerCase() === 'q' && !mod && !e.altKey) {
      e.preventDefault();
      this.handlers.onTriggerWheel?.(this.lastPointerPos.x, this.lastPointerPos.y);
      return;
    }

    if (e.key.toLowerCase() === 'v' && !mod && !e.altKey) {
      e.preventDefault();
      this.handlers.onSelectTool?.('select');
      return;
    }

    if (e.key.toLowerCase() === 'h' && !mod && !e.altKey) {
      e.preventDefault();
      this.handlers.onSelectTool?.('hand');
      return;
    }

    if (e.key.toLowerCase() === 'r' && !mod && !e.altKey) {
      e.preventDefault();
      this.handlers.onSelectTool?.('rectangle');
      return;
    }

    if (e.key.toLowerCase() === 'e' && !mod && !e.altKey) {
      e.preventDefault();
      this.handlers.onSelectTool?.('ellipse');
      return;
    }

    if (e.key.toLowerCase() === 't' && !mod && !e.altKey) {
      e.preventDefault();
      this.handlers.onSelectTool?.('text');
      return;
    }

    if (e.key.toLowerCase() === 'c' && !mod && !e.altKey) {
      e.preventDefault();
      this.handlers.onSelectTool?.('connector');
      return;
    }

    if (e.key.toLowerCase() === 'p' && !mod && !e.altKey) {
      e.preventDefault();
      this.handlers.onSelectTool?.('draw');
      return;
    }

    // --- View Shortcuts ---
    if ((e.key === '+' || e.key === '=') && !mod && !e.altKey) {
      e.preventDefault();
      this.handlers.onZoomIn?.();
      return;
    }

    if ((e.key === '-' || e.key === '_') && !mod && !e.altKey) {
      e.preventDefault();
      this.handlers.onZoomOut?.();
      return;
    }

    if (e.key === '0' && !mod && !e.altKey) {
      e.preventDefault();
      this.handlers.onResetZoom?.();
      return;
    }

    if (e.key === '1' && !mod && !e.altKey) {
      e.preventDefault();
      this.handlers.onFitContent?.();
      return;
    }

    if (e.key === '?' && !mod && !e.altKey) {
      e.preventDefault();
      this.handlers.onToggleHelp?.();
      return;
    }

    // --- Editing Shortcuts ---
    if (mod && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      if (e.shiftKey) {
        this.handlers.onRedo?.();
      } else {
        this.handlers.onUndo?.();
      }
      return;
    }

    if (mod && e.key.toLowerCase() === 'y') {
      e.preventDefault();
      this.handlers.onRedo?.();
      return;
    }

    if ((e.key === 'Enter' || e.key === 'F2') && !mod) {
      e.preventDefault();
      this.handlers.onEditText?.();
      return;
    }

    if (e.key.toLowerCase() === 'd' && !mod && !e.altKey) {
      this.handlers.onDHold?.(true);
    }

    if (mod && e.key.toLowerCase() === 'd') {
      e.preventDefault();
      this.handlers.onDuplicate?.();
      return;
    }

    if (mod && e.key.toLowerCase() === 'a') {
      e.preventDefault();
      this.handlers.onSelectAll?.();
      return;
    }

    if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      this.handlers.onDelete?.();
      return;
    }

    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1;
      let dx = 0;
      let dy = 0;
      if (e.key === 'ArrowLeft') dx = -step;
      if (e.key === 'ArrowRight') dx = step;
      if (e.key === 'ArrowUp') dy = -step;
      if (e.key === 'ArrowDown') dy = step;
      this.handlers.onNudge?.(dx, dy);
      return;
    }

    if (e.key === 'Escape') {
      this.handlers.onEscape?.();
      return;
    }
  }

  onKeyUp(e) {
    if (e.key === ' ' && this.isSpacePressed) {
      this.isSpacePressed = false;
      this.handlers.onSpaceHold?.(false);
    }

    if (e.key.toLowerCase() === 'd') {
      this.handlers.onDHold?.(false);
    }
  }
}

/**
