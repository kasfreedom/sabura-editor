<!-- SABURA AI CONTRACT
OVERVIEW
  Sabura is a portable offline whiteboard with structured agent authoring. This file has two sections:
    1. A small, editable board document (sabura/canvas/v1 JSON) — readable and replaceable.
    2. An opaque application runtime (CSS + JS) — treat as a sealed black box.
  Stop reading at &lt;style&gt;. Do not read, reproduce, or modify anything from &lt;style&gt; onward.

BROWSER-AGENT WORKFLOW  (preferred)
  1. Open sabura.html in a browser.
  2. For live editing, discover window.sabura.agent.describe(), then call
     agent.read() and retain its live editToken.
  3. In Editing mode, call agent.apply({ requestId, expectedEditToken, commands }).
     Batches are atomic and use the same command/history engine as the UI.
  4. Inspect the structured result, then use agent.focusObjects(ids) or
     agent.fitBoard() to inspect the rendered result.
  5. Call agent.saveCopy(). A successful response means export was prepared and
     a browser download was requested; it does not confirm file delivery.
  6. For whole-document generation instead, validateDocument(doc), then call
     generateBoardFile(doc). The runtime is never returned through the API.

LIVE AGENT API  sabura/agent/v1
  agent.describe()       -> versions, capabilities, public commands and schemas
  agent.read()           -> copied document, selection, viewport, mode, editToken
  agent.apply(request)   -> atomic structured edit result; explicit create IDs required
  agent.undo(request) / agent.redo(request) -> token-checked history operations
  agent.focusObjects(ids[, options]) / agent.fitBoard() -> view-only operations
  agent.saveCopy()       -> exportPrepared, downloadRequested, deliveryConfirmed:false
  agent.subscribe(fn)    -> copied agent snapshots; returns unsubscribe function

  Mutating requests require a non-empty requestId and expectedEditToken. The token
  is session-local, advances only on real document changes (including Undo/Redo),
  and is never persisted. Repeating an identical requestId is idempotent; reusing
  it with a different payload fails. Agent edits reject stale tokens, Reading or
  Presentation mode, and active human edit/import/save interactions.

FILE-TOOL WORKFLOW  (fallback — no browser)
  1. Read only the contract and the document seam below. Stop before &lt;style&gt;.
  2. Locate the seam markers (angle brackets shown escaped for safety):
       &lt;script type="application/json" id="sabura-document"&gt;
       &lt;/script&gt;
  3. Replace only the JSON between those two markers with your new canonical JSON.
  4. Encode every literal < as \u003C inside the JSON.
  5. Copy the remainder of the file through your tools without loading it into context.
  6. Never inspect, reformat, or regenerate the runtime. Return the resulting HTML file.

SCHEMA  sabura/canvas/v1
  Required top-level fields:
    schemaVersion  "sabura/canvas/v1"
    id             non-empty string
    title          string
    theme          { background, gridColor, palette[], defaultFill, defaultStroke,
                     defaultStrokeWidth, defaultOpacity, defaultRoughness,
                     defaultFontSize ("s"|"m"|"l"|"xl"),
                     defaultFontFamily ("sans"|"serif"|"mono"|"hand") }
    objects        { [objectId]: object }  where key === object.id
    order          string[]  bottom-to-top paint order (z-index)
    groups         { [groupId]: { id, name } }
    assets         { [assetId]: asset }

  Supported types: rectangle, ellipse, diamond, triangle, text, connector, path, image

  Common object fields: id, type, x, y, width, height, rotation, opacity,
    locked, groupId, plus style/text fields as applicable.

  Connector (type: connector):
    from, to — endpoint: { "id": "target_id" }
                          { "id": "target_id", "anchor": { "x": 0..1, "y": 0..1 } }
                          { "point": { "x": number, "y": number } }
    routing: "straight" | "elbow" | "curved"
    curveSide: 1 | -1,  startArrow: bool,  endArrow: bool

  Path (type: path):
    points: [{ "x": number, "y": number }, ...]
    closed: bool,  curveStyle: "sharp" | "curved",  startArrow: bool,  endArrow: bool

  Image: type "image", assetId -> a raster asset, fit "contain"|"cover" (default
    "contain"), plus x/y/width/height/rotation/opacity/locked/groupId.
  Raster asset: { id, type:"raster", data:"data:image/{png|jpeg|webp};base64,...",
    mimeType, width, height }. Data must be valid, <=10 MiB, <=16,384px/axis,
    and <=40,000,000 decoded pixels.

  Grouping: set object.groupId to a key that exists in the top-level groups map.
  Extensions: unknown properties are rejected unless prefixed "ext:" (e.g. "ext:myMeta").
  Escaping: every literal < in JSON string values must be encoded as \u003C.

PUBLIC API  (window.sabura.*)
  readAiContract()        -> { found: bool, contract: string }
  getDocument()           -> board document object (deep copy)
  validateDocument(doc)   -> { valid: bool, errors: string[] }
  generateBoardFile(doc)  -> { success: bool, filename, byteLength } | { success: false, errors[] }
  applyCommands(cmds[])   -> { success: bool, document?, errors? }
  exportCanonicalJson()   -> canonical JSON string
  undo() / redo()  /  subscribe(listener) -> unsubscribe fn
  agent                     -> versioned live-authoring facade documented above

  generateBoardFile() never returns the HTML source. The runtime remains opaque.
-->

  background: #fdfbf7;

  -webkit-user-select: none;
}

#app {

  height: 100%;

  overflow: hidden;

#laser-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 100;
  display: none;
}

/* Presentation Mode states */
body.in-presentation .sabura-topbar,
body.in-presentation .wheel-trigger-fab,
body.in-presentation .sabura-wheel,
body.in-presentation .zoom-help-toolbar {
  display: none !important;
}

body.in-presentation #laser-canvas {
  display: block;
}

body.in-presentation {
  cursor: none;
}

/* Compact Bottom-Left Zoom & Help Toolbar */
.zoom-help-toolbar {
  position: fixed;
  bottom: 16px;
  left: 16px;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 4px 6px;
  background: var(--ui-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 2px solid var(--ui-border);
  border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
  box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.12);
  z-index: 40;
  user-select: none;
  -webkit-user-select: none;
}

.zoom-btn {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--ui-text);
  font-family: var(--font-hand);
  font-size: 15px;
  font-weight: 700;
  padding: 4px 8px;
  min-width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
}

.zoom-btn:hover {
  background: var(--ui-surface);
  border-color: var(--ui-border);
}

.zoom-btn:active {
  transform: scale(0.94);
}

.zoom-btn.zoom-percent {
  font-family: var(--font-mono);
  font-size: 13px;
  min-width: 52px;
}

.zoom-btn.zoom-fit {
  font-size: 13px;
  padding: 4px 6px;
}

.zoom-btn.zoom-help {
  font-size: 14px;
  border-radius: 50%;
  width: 26px;
  height: 26px;
  min-width: 26px;
  border: 1px dashed var(--ui-border);
}

/* Accessible Help & Shortcuts Modal Backdrop */
.sabura-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.15s ease-out;
}

.sabura-modal-backdrop.visible {
  display: flex;
  opacity: 1;
}

/* Modal Dialog Window */
.sabura-modal-dialog {
  background: var(--ui-bg);
  color: var(--ui-text);
  border: 2.5px solid var(--ui-border);
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
  max-width: 720px;
  width: 92%;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: var(--font-hand);
  animation: modalPop 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes modalPop {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.help-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  border-bottom: 2px solid var(--ui-border);
  background: var(--ui-surface);
}

.help-title-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.help-logo {
  font-size: 18px;
  font-weight: 800;
  color: #1971c2;
  border: 1.5px solid #1971c2;
  padding: 2px 8px;
  border-radius: 6px;
}

.help-header h2 {
  font-size: 18px;
  margin: 0;
  font-weight: 700;
}

.help-close-btn {
  background: transparent;
  border: 1.5px solid var(--ui-border);
  border-radius: 6px;
  font-size: 14px;
  font-weight: 700;
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ui-text);
  transition: background 0.15s ease;
}

.help-close-btn:hover {
  background: #ffe3e3;
  color: #c92a2a;
}

.help-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  padding: 18px 24px;
  overflow-y: auto;
}

@media (max-width: 620px) {
  .help-body {
    grid-template-columns: 1fr;
  }
}

.help-section {
  margin-bottom: 18px;
}

.help-section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 8px 0;
  color: #1971c2;
  border-bottom: 1px dashed var(--ui-border);
  padding-bottom: 4px;
}

[data-ui-theme="dark"] .help-section-title {
  color: #74c0fc;
}

.help-list {
  list-style: none;
  margin: 0;
  padding: 0;
  font-size: 13.5px;
}

.help-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
  gap: 12px;
}

.help-desc {
  font-weight: 500;
}

.kbd-badge {
  display: inline-block;
  padding: 2px 6px;
  font-size: 11px;
  font-family: var(--font-mono);
  background: var(--ui-surface);
  border: 1px solid var(--ui-border);
  border-radius: 4px;
  box-shadow: 0 1px 1px rgba(0, 0, 0, 0.15);
  font-weight: 600;
  color: var(--ui-text);
  white-space: nowrap;
}

.help-footer {
  padding: 10px 20px;
  border-top: 1px solid var(--ui-border);
  font-size: 12px;
  color: var(--ui-text-muted);
  background: var(--ui-surface);
  text-align: center;
}

.topbar-secondary-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

@media (max-width: 640px) {
  .sabura-topbar {
    left: 8px;
    right: 8px;
    padding: 0 8px;
    gap: 6px;
  }
  .topbar-left {
    gap: 6px;
  }
  .topbar-right {
    gap: 6px;
  }
  .brand-name {
    display: none;
  }
  .doc-title {
    max-width: 100px;
  }
  .topbar-btn {
    padding: 4px 7px;
    font-size: 12.5px;
  }
  .mode-editing .topbar-center {
    display: none;
  }
  #btn-fullscreen {
    display: none;
  }
  .topbar-divider {
    display: none;
  }
}

@media (max-width: 480px) {
  .sabura-topbar {
    padding: 0 6px;
    gap: 4px;
  }
  .topbar-left {
    gap: 4px;
  }
  .topbar-right {
    gap: 4px;
  }
  .mode-badge {
    display: none;
  }
  .status-badge {
    padding: 3px 6px;
  }
  .status-badge .status-text {
    display: none;
  }
  .status-badge .status-dot {
    margin: 0;
  }
  .doc-title {
    max-width: 85px;
    font-size: 15px;
  }
  .topbar-btn {
    padding: 4px 6px;
    font-size: 12px;
    gap: 2px;
  }
  .topbar-secondary-actions {
    display: none;
  }
  #btn-undo, #btn-redo, #btn-fullscreen, .topbar-divider {
    display: none;
  }
}

@media (max-width: 400px) {
  .mode-reading .topbar-right {
    gap: 2px;
  }
  .mode-reading .topbar-btn {
    padding-left: 5px;
    padding-right: 5px;
    font-size: 11px;
  }
  .mode-reading #btn-reading-fullscreen {
    width: 28px;
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
  }
  .mode-reading .reading-fullscreen-label {
    display: none;
  }

/* Sabura graphite + watercolor visual system. These render-only primitives are
   deliberately shared by the topbar, utility rails, and circular ToolWheel. */
:root {
  --sabura-vs-graphite: #343b3f;
  --sabura-vs-graphite-soft: rgba(52, 59, 63, 0.34);
  --sabura-vs-rail: rgba(255, 253, 247, 0.97);
  --sabura-vs-wash-blue: #dce7ed;
  --sabura-vs-wash-yellow: #f4f0df;
  --sabura-vs-wash-green: #e5f1e6;
  --sabura-vs-wash-red: #f7e3e1;
}

[data-ui-theme="dark"] {
  --sabura-vs-graphite: #edf0f0;
  --sabura-vs-graphite-soft: rgba(237, 240, 240, 0.34);
  --sabura-vs-rail: rgba(43, 47, 51, 0.98);
  --sabura-vs-wash-blue: #414b70;
  --sabura-vs-wash-yellow: #4a4540;
  --sabura-vs-wash-green: #30463b;
  --sabura-vs-wash-red: #4b363a;
}

@media (prefers-color-scheme: dark) {
  [data-ui-theme="system"] {
    --sabura-vs-graphite: #edf0f0;
    --sabura-vs-graphite-soft: rgba(237, 240, 240, 0.34);
    --sabura-vs-rail: rgba(43, 47, 51, 0.98);
    --sabura-vs-wash-blue: #414b70;
    --sabura-vs-wash-yellow: #4a4540;
    --sabura-vs-wash-green: #30463b;
    --sabura-vs-wash-red: #4b363a;
  }
}

.sabura-vs-icon {
  width: 19px;
  height: 19px;
  display: inline-block;
  flex: 0 0 auto;
  overflow: visible;
  color: currentColor;
}

.sabura-vs-app-mark {
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  overflow: visible;
}

.sabura-vs-app-link {
  display: flex;
  flex: 0 0 auto;
  color: inherit;
  text-decoration: none;
}

.sabura-vs-app-link:focus-visible {
  outline: 2px solid var(--ui-accent);
  outline-offset: 2px;
}

.sabura-topbar,
.wheel-trigger-fab,
.zoom-help-toolbar {
  background: var(--sabura-vs-rail);
  border: 1.6px solid var(--sabura-vs-graphite);
  border-radius: 1px;
  box-shadow: 3px 3px 0 var(--sabura-vs-graphite-soft);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.sabura-topbar::after,
.wheel-trigger-fab::after,
.zoom-help-toolbar::after {
  content: "";
  position: absolute;
  inset: 2px -3px -3px 2px;
  border: 1px solid var(--sabura-vs-graphite-soft);
  pointer-events: none;
  z-index: -1;
}

.sabura-topbar {
  height: 56px;
  padding: 0 10px;
}

.topbar-left,
.topbar-center,
.topbar-right,
.topbar-primary-actions,
.topbar-secondary-actions,
.grid-controls-group {
  gap: 0;
}

.topbar-primary-actions {
  display: flex;
  align-items: center;
}

.topbar-center {
  border-left: 1px dashed var(--sabura-vs-graphite-soft);
  border-right: 1px dashed var(--sabura-vs-graphite-soft);
  margin: 0 8px;
}

.brand-title,
.status-badge,
.mode-badge,
.control-label,
.topbar-btn {
  min-height: 36px;
}

.brand-title {
  gap: 8px;
  padding-right: 10px;
}

.brand-name {
  color: #1971c2;
  font-size: 24px;
}

.status-badge,
.mode-badge,
.topbar-select,
.topbar-btn {
  border-radius: 0;
  box-shadow: none;
}

.status-badge,
.mode-badge {
  border: 0;
  border-left: 1px dashed var(--sabura-vs-graphite-soft);
  background: transparent;
}

.control-label {
  padding: 0 8px;
  border-right: 1px dashed var(--sabura-vs-graphite-soft);
}

.control-label > .sabura-vs-icon {
  width: 17px;
  height: 17px;
}

.topbar-select {
  border: 0;
  border-bottom: 1px solid var(--sabura-vs-graphite-soft);
  background: transparent;
  padding: 3px 18px 3px 5px;
}

.topbar-select:hover {
  background: var(--sabura-vs-wash-yellow);
  border-color: var(--sabura-vs-graphite);
}

.topbar-btn {
  position: relative;
  padding: 5px 10px;
  border: 0;
  border-right: 1px dashed var(--sabura-vs-graphite-soft);
  background: transparent;
  color: var(--ui-text);
}

.topbar-btn:first-child {
  border-left: 1px dashed var(--sabura-vs-graphite-soft);
}

.topbar-btn:hover {
  background: var(--sabura-vs-wash-yellow);
  transform: none;
  box-shadow: none;
}

.topbar-btn:active {
  transform: translate(1px, 1px);
}

.topbar-btn.active,
.topbar-btn.primary {
  background: var(--sabura-vs-wash-blue);
  color: var(--ui-accent);
  border-color: var(--sabura-vs-graphite-soft);
  border-width: 0 1px 0 0;
}

.topbar-btn.primary:hover {
  background: var(--sabura-vs-wash-blue);
}

.topbar-btn.save-btn {
  background: var(--sabura-vs-wash-green);
  color: #2b8a3e;
  border: 1px solid #2f9e44;
}

.topbar-btn.save-btn:hover {
  background: var(--sabura-vs-wash-green);
}

.topbar-btn.icon-only {
  min-width: 38px;
  justify-content: center;
  padding: 5px 8px;
}

.topbar-divider {
  height: 34px;
  width: 0;
  background: transparent;
  border-left: 1px dashed var(--sabura-vs-graphite-soft);
}

.wheel-trigger-fab {
  padding: 8px 10px;
  gap: 7px;
}

.wheel-trigger-fab:hover {
  background: var(--sabura-vs-wash-yellow);
}

.wheel-trigger-fab .fab-key {
  border-radius: 0;
  background: transparent;
}

.zoom-help-toolbar {
  gap: 0;
  padding: 0;
}

.zoom-btn {
  height: 36px;
  min-width: 38px;
  border: 0;
  border-right: 1px dashed var(--sabura-vs-graphite-soft);
  border-radius: 0;
}

.zoom-btn:last-child { border-right: 0; }
.zoom-btn:hover { background: var(--sabura-vs-wash-yellow); }
.zoom-btn.zoom-help { width: 38px; height: 36px; border-radius: 0; border: 0; }

.sabura-wheel {
  filter: drop-shadow(4px 6px 0 rgba(52, 59, 63, 0.18)) drop-shadow(0 12px 24px rgba(0, 0, 0, 0.12));
  transform: translate(-50%, -50%) scale(var(--wheel-scale, 1));
  transform-origin: center;
}

.wheel-bezel-rim {
  stroke: var(--sabura-vs-graphite);
  stroke-width: 1.5px;
  stroke-dasharray: none;
  fill: none;
  opacity: 0.78;
}

.wheel-hub,
.wheel-wedge,
.wheel-sub-wedge,
.wheel-third-wedge {
  fill: var(--sabura-vs-rail);
}

.wheel-divider-sketch {
  stroke: var(--sabura-vs-graphite-soft);
  stroke-width: 1.1px;
  stroke-dasharray: 2.4 4.8;
  opacity: 0.82;
}

.wheel-wedge:hover,
.wheel-wedge.active,
.wheel-sub-wedge:not(.color-choice):hover,
.wheel-sub-wedge:not(.color-choice).active-choice,
.wheel-third-wedge:hover,
.wheel-third-wedge.active-choice {
  fill: url(#sabura-vs-wheel-wash) !important;
  filter: none;
}

.wheel-wedge.danger:hover { fill: url(#sabura-vs-wheel-danger-wash) !important; }
.wheel-sub-wedge.color-choice:hover,
.wheel-sub-wedge.color-choice.active-choice {
  filter: none;
  stroke: var(--ui-wheel-stroke) !important;
  stroke-width: 2px !important;
}

.sabura-vs-wheel-icon {
  color: var(--ui-wheel-text);
  overflow: visible;
}

.wheel-text,
.wheel-sub-text {
  font-weight: 700;
}

#app[data-sabura-vs-board-theme="high-contrast"] .topbar-btn.active,
#app[data-sabura-vs-board-theme="high-contrast"] .topbar-btn.primary,
#app[data-sabura-vs-board-theme="high-contrast"] .wheel-wedge:hover,
#app[data-sabura-vs-board-theme="high-contrast"] .wheel-wedge.active,
#app[data-sabura-vs-board-theme="high-contrast"] .wheel-sub-wedge:not(.color-choice):hover,
#app[data-sabura-vs-board-theme="high-contrast"] .wheel-sub-wedge:not(.color-choice).active-choice,
#app[data-sabura-vs-board-theme="high-contrast"] .wheel-third-wedge:hover,
#app[data-sabura-vs-board-theme="high-contrast"] .wheel-third-wedge.active-choice {
  background: var(--ui-active);
  fill: var(--ui-active) !important;
  filter: none;
}

/* Graphite interface layout. Tokens are defined once above; this block owns
   the final component geometry after the legacy compatibility rules. */
html, body { background: var(--ui-bg-solid); }

.sabura-topbar {
  top: 12px;
  left: 12px;
  right: 12px;
  height: auto;
  min-height: 0;
  padding: 0;
  gap: 0;
  background: transparent;
  border: 0;
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  pointer-events: none;
}

.sabura-topbar::after { display: none; }
.sabura-topbar > * { pointer-events: auto; }

.sabura-topbar .topbar-left,
.sabura-topbar .topbar-center,
.sabura-topbar .topbar-right,
.sabura-topbar .status-region {
  background: var(--sabura-vs-rail);
  border: 1px solid var(--ui-border);
  border-radius: 4px;
  box-shadow: 2px 2px 0 var(--sabura-vs-graphite-soft);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.sabura-topbar .topbar-left,
.sabura-topbar .topbar-right {
  position: fixed;
  top: 12px;
  min-height: 44px;
  gap: 0;
}

.sabura-topbar .topbar-left { left: 12px; }
.sabura-topbar .topbar-right { right: 12px; }

.sabura-topbar .topbar-center {
  position: fixed;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  min-height: 44px;
  max-width: calc(100vw - 24px);
  margin: 0;
  border-color: var(--ui-border);
  white-space: nowrap;
}

.sabura-topbar .status-region {
  position: fixed;
  right: 12px;
  bottom: 14px;
  z-index: 41;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 32px;
  max-width: min(34vw, 360px);
  padding: 5px 9px;
  color: var(--ui-text);
  font: 600 12px/1.25 var(--font-sans);
  overflow-wrap: anywhere;
}

.mode-reading .status-region[data-status="Clean"] { display: none; }
.mode-reading .topbar-center { display: none; }

.sabura-topbar .brand-name {
  color: var(--ui-text);
  font: 600 19px/1 var(--font-sans);
  letter-spacing: -0.02em;
}

.sabura-topbar .doc-title {
  color: var(--ui-text-muted);
  font: 500 12px/1.2 var(--font-sans);
}

.sabura-topbar .mode-badge {
  min-height: 30px;
  padding: 0 9px;
  color: var(--ui-accent);
  font: 600 12px/1 var(--font-sans);
  border-left: 1px solid var(--ui-border);
}

.sabura-topbar .topbar-btn,
.sabura-topbar .control-label,
.sabura-topbar .topbar-select {
  min-height: 42px;
  font: 600 12px/1.1 var(--font-sans);
}

.sabura-topbar .topbar-btn {
  color: var(--ui-text);
  border-right: 1px dotted var(--ui-border);
  border-radius: 0;
  box-shadow: none;
}

.sabura-topbar .topbar-btn:first-child { border-left: 0; }
.sabura-topbar .topbar-btn:last-child { border-right: 0; }
.sabura-topbar .topbar-btn:hover { background: var(--sabura-vs-wash-yellow); }
.sabura-topbar .topbar-btn.primary { background: var(--ui-active); color: var(--ui-accent); }
.sabura-topbar .topbar-btn.save-btn { background: var(--sabura-vs-wash-green); color: var(--ui-text); border: 0; }
.sabura-topbar .control-label { padding: 0 9px; border-right: 1px dotted var(--ui-border); }
.sabura-topbar .topbar-select { color: var(--ui-text); background: transparent; border: 0; padding: 3px 16px 3px 4px; }
.sabura-topbar .topbar-btn:focus-visible,
.sabura-topbar .topbar-select:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: -2px; }

.sabura-vs-app-mark { color: var(--ui-accent); }

.wheel-trigger-fab {
  bottom: 62px;
  left: 12px;
  padding: 7px 10px;
  min-height: 36px;
  border: 1px solid var(--ui-border);
  border-radius: 4px;
  box-shadow: 2px 2px 0 var(--sabura-vs-graphite-soft);
  background: var(--sabura-vs-rail);
  font: 600 12px/1 var(--font-sans);
}

.zoom-help-toolbar {
  bottom: 12px;
  left: 12px;
  border: 1px solid var(--ui-border);
  border-radius: 4px;
  box-shadow: 2px 2px 0 var(--sabura-vs-graphite-soft);
  background: var(--sabura-vs-rail);
}

.zoom-btn { color: var(--ui-text); font-family: var(--font-sans); }

.sabura-wheel {
  transform: translate(-50%, -50%) scale(var(--wheel-scale, 1));
  transform-origin: center;
}

.wheel-bezel-rim {
  fill: none;
  stroke: var(--sabura-vs-graphite);
  stroke-width: 1.5px;
  stroke-dasharray: none;
  opacity: 0.78;
}

.wheel-divider-sketch {
  stroke: var(--sabura-vs-graphite-soft);
  stroke-width: 1.1px;
  stroke-dasharray: 2.4 4.8;
  opacity: 0.82;
}

@media (max-width: 1050px) {
  .sabura-topbar .doc-title { display: none; }
}

@media (min-width: 641px) and (max-width: 1050px) {
  .sabura-topbar .status-region {
    position: absolute;
    left: 84px;
    right: auto;
    top: 6px;
    bottom: auto;
    max-width: 120px;
    width: auto;
    min-width: 0;
    padding: 5px 9px;
  }

  .sabura-topbar .topbar-center { transform: translateX(calc(-50% - 12px)); }
  .sabura-topbar .status-region .status-text { display: inline; }
}

@media (max-width: 640px) {
  .sabura-topbar { top: 6px; left: 6px; right: 6px; }
  .sabura-topbar .topbar-left,
  .sabura-topbar .topbar-right { top: 6px; }
  .sabura-topbar .topbar-left { left: 6px; }
  .sabura-topbar .topbar-right { right: 6px; }
  .sabura-topbar .topbar-center {
    top: 58px;
    bottom: auto;
    max-width: calc(100vw - 12px);
    overflow-x: auto;
    overflow-y: hidden;
  }
  /* The legacy compact grid uses display: contents for the editing right
     rail. Restore one framed flex group so all five actions share the same
     top-right hit area. */
  .sabura-topbar.mode-editing .topbar-right {
    display: flex;
    align-items: center;
    gap: 0;
  }
  .sabura-topbar.mode-editing .topbar-secondary-actions,
  .sabura-topbar.mode-editing .topbar-primary-actions {
    position: static;
    display: flex;
    align-items: center;
  }
  .sabura-topbar .status-region { right: 6px; bottom: 12px; max-width: 46vw; width: auto; min-width: 0; }
  .sabura-topbar .status-region .status-text { display: inline; }
  .sabura-topbar .topbar-btn { min-height: 38px; min-width: 36px; padding: 5px 7px; }
  .sabura-topbar .control-label { min-height: 38px; padding: 0 5px; }
  .wheel-trigger-fab { left: 6px; bottom: 58px; }
  .zoom-help-toolbar { left: 6px; bottom: 8px; }
}

@media (min-width: 641px) and (max-width: 680px) {
  /* At the 641px edge the bottom dock would share the zoom rail's hit area;
     keep the settings group on the same independent upper row as compact mode. */
  .sabura-topbar .topbar-center { top: 58px; bottom: auto; }
}

@media (max-width: 400px) {
  .sabura-topbar .topbar-btn { min-width: 34px; padding-inline: 5px; }
  .sabura-topbar .status-region { max-width: 42vw; }
}

@media (max-width: 380px) {
  /* Preserve compact 360px wheel geometry while keeping labels readable after
     the required outer-ring scale; hierarchy and slot positions stay fixed. */
  .sabura-wheel .wheel-text { font-size: 15px; }
  .sabura-wheel .wheel-sub-text { font-size: 13px; letter-spacing: -0.25px; }
}
